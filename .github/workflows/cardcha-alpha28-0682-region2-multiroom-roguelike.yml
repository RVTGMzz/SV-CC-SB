name: Cardcha 0682 Region II Multi-Room Roguelike

on:
  push:
    branches:
      - cardcha-alpha28-0682-region2-multiroom-roguelike

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate 0682 Region II multi-room runtime
        run: python3 tools/alpha28_0682_region2_room_variety.py

      - name: Scope Archive Seal interaction to Warden Vault
        run: python3 tools/alpha28_0682_gate_scope_hotfix.py

      - name: Validate repository rendering depth contract
        run: python3 tools/validate_render_depth_contract.py

      - name: Validate 0682 multi-room roguelike contracts
        run: |
          python3 tools/validate_0682_region2_multiroom.py
          grep -F 'this.CurrentRoom == Region2RoomKind.WardenVault && (gateClose || gateFacing)' src/Cardcha/Services/Region2RoguelikeRunService.cs

      - name: Verify accepted art and later-region assets are untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/cardcha-alpha28-0681-hollow-curator-records-you -- \
            src/Cardcha/assets/mimi_walk.png \
            src/Cardcha/assets/airship_visual.png \
            src/Cardcha/assets/airship_deck.tmx \
            src/Cardcha/assets/sky_dock_interior.tmx \
            src/Cardcha/assets/region2_forgotten_archive.tmx \
            src/Cardcha/assets/region2_forgotten_archive_tiles.png \
            src/Cardcha/assets/region2_forgotten_archive_enemies.png \
            src/Cardcha/assets/region3_mirrorwild.tmx \
            src/Cardcha/assets/region4_resonance_verge.tmx \
            src/Cardcha/assets/boss2_hollow_curator_arena.tmx \
            src/Cardcha/assets/boss3_tricolor_resonance_arena.tmx \
            src/Cardcha/assets/boss4_mimi_resonance_arena.tmx \
            src/Cardcha/assets/bosses/milestone/hollow_curator.png \
            src/Cardcha/assets/bosses/milestone/tricolor_guardians.png \
            src/Cardcha/assets/bosses/milestone/tricolor_unified.png \
            src/Cardcha/assets/bosses/milestone/mimi_resonance_master.png

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize 0682 source and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.50 Region II multi-room [skip ci]'
            git push origin HEAD:cardcha-alpha28-0682-region2-multiroom-roguelike
          fi

      - name: Package 0682 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name Cardcha.dll | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP='Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.50_0682_Region2_MultiRoomRoguelike_TEST.zip'
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile, xml.etree.ElementTree as ET
          p=Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.50_0682_Region2_MultiRoomRoguelike_TEST.zip')
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              m=json.loads(z.read('Cardcha/manifest.json'))
              assert m['Version']=='0.3.0-alpha.28.0.4.14.4.5.12.50'
              dll=z.read('Cardcha/Cardcha.dll')
              assert dll[:2]==b'MZ' and len(dll)>50000
              required=[
                  'Cardcha/assets/region2_forgotten_archive.tmx',
                  'Cardcha/assets/region2_inkbound_stacks.tmx',
                  'Cardcha/assets/region2_mirror_gallery.tmx',
                  'Cardcha/assets/region2_warden_vault.tmx',
                  'Cardcha/assets/region2_forgotten_archive_tiles.png',
                  'Cardcha/assets/region2_forgotten_archive_enemies.png',
                  'Cardcha/assets/bosses/milestone/hollow_curator.png',
                  'Cardcha/assets/mimi_walk.png',
                  'Cardcha/i18n/default.json','Cardcha/i18n/vi.json']
              for req in required: assert req in names, req
              for req in ['Cardcha/assets/region2_inkbound_stacks.tmx','Cardcha/assets/region2_mirror_gallery.tmx','Cardcha/assets/region2_warden_vault.tmx']:
                  root=ET.fromstring(z.read(req))
                  assert (int(root.attrib['width']),int(root.attrib['height']))==(40,28)
          print('0682 package audit PASS:',p)
          PY

      - name: Upload 0682 TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0682-region2-multiroom-roguelike
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.50_0682_Region2_MultiRoomRoguelike_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.50_0682_Region2_MultiRoomRoguelike_TEST.zip.sha256
          if-no-files-found: error
