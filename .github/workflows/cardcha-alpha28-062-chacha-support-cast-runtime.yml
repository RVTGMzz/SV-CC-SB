name: Cardcha alpha28.0.4.14.4.4 ChaCha Support Cast Runtime

on:
  push:
    branches: [ cardcha-alpha28-062-chacha-support-cast-runtime ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Support Cast finalizer
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/alpha28_41444_chacha_support_cast_runtime.py
          python3 tools/alpha28_41436_auto_audit.py

      - name: Source acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, struct

          root=Path('src/Cardcha')
          version='0.3.0-alpha.28.0.4.14.4.4'
          assert json.loads((root/'manifest.json').read_text())['Version']==version
          assert f'<Version>{version}</Version>' in (root/'Cardcha.csproj').read_text()
          assert 'CurrentSchemaVersion = 19' in (root/'Services/SaveService.cs').read_text()

          support=(root/'Services/ChaChaSupportCastService.cs').read_text()
          farmer=(root/'Patches/FarmerDamagePatch.cs').read_text()
          deaths=(root/'Services/MonsterDeathService.cs').read_text()
          entry=(root/'ModEntry.cs').read_text()
          resonance=(root/'UI/ChaChaResonanceMenu.cs').read_text()
          skills=(root/'Services/ChaChaSkillService.cs').read_text()
          mats=(root/'Services/ChaChaSkillMaterialService.cs').read_text()
          boss=(root/'Services/ChaChaBossFormService.cs').read_text()
          airship=(root/'Services/AirshipFoundationService.cs').read_text()
          audit=json.loads((root/'assets/card_auto_audit.json').read_text())

          # Locked trigger/balance tables.
          for token in [
              'KillChanceByLevel = { 0.06d, 0.09d, 0.12d, 0.15d, 0.18d }',
              'LuckyDamageChanceByLevel = { 0.04d, 0.05d, 0.06d, 0.07d, 0.08d }',
              'CooldownSecondsByLevel = { 40, 35, 30, 25, 20 }',
              'VitalHealPercentByLevel = { 0.10d, 0.13d, 0.16d, 0.20d, 0.25d }',
              'ShieldReductionByLevel = { 0.20d, 0.25d, 0.30d, 0.35d, 0.40d }',
              'StaminaRestorePercentByLevel = { 0.10d, 0.15d, 0.20d, 0.25d, 0.30d }',
              'EmergencyThreshold = 0.30d',
              'SpiritProcChance = 0.30d',
              'LuckProcChance = 0.50d',
              'ShieldDurationMs = 20000',
              'LuckDurationMs = 10000',
              'LuckBuffAmount = 1'
          ]:
              assert token in support, token

          # One cast architecture + forced trigger rules.
          assert 'if (!this.CanSupport(who) || !this.CooldownReady)' in support
          assert 'this.NextRoll() < GetLuckyDamageChance(level)' in support
          assert 'beforeRatio > EmergencyThreshold && afterRatio <= EmergencyThreshold' in support
          assert 'string trigger = lucky && emergency ? "lucky+emergency"' in support
          assert 'this.PerformCast(farmer, trigger, ignoreCooldown: true)' in support
          assert 'this.CooldownReadyAtMs = Environment.TickCount64 + GetCooldownSeconds(vitalLevel) * 1000L' in support
          assert '&& !this.IsBossFormActive()' in support

          # Real effects are live.
          assert 'farmer.health = Math.Min(farmer.maxHealth, farmer.health + heal)' in support
          assert 'return Math.Max(1, (int)Math.Ceiling(damage * (1d - reduction)))' in support
          assert 'farmer.Stamina = Math.Min(max, farmer.Stamina + restore)' in support
          assert 'effects.LuckLevel.Value = LuckBuffAmount' in support

          # Damage and kill pipelines feed exactly one support service.
          assert 'ChaChaSupportCastService? Support' in farmer
          assert 'Support.ModifyIncomingDamage' in farmer
          assert 'Support?.AfterFarmerTakesDamage' in farmer
          assert 'private readonly ChaChaSupportCastService Support;' in deaths
          assert deaths.count('this.Support.OnMonsterKilled(who);') == 2
          assert 'new MonsterDeathService(this.Drops, this.Combat, this.ChaChaMaterials, this.ChaChaSupport)' in entry
          assert 'FarmerDamagePatch.Apply(harmony, this.Combat, this.ChaChaSupport, this.CardArena)' in entry

          # One HUD icon, no four-active-skill selection in Resonance UI.
          assert 'this.ChaChaSupport.OnRenderedHud' in entry
          assert 'this.ChaChaSupport.OnRenderedWorld' in entry
          assert 'resonance.ability.module-on' in resonance
          assert 'skills.SetActive(skillId)' not in resonance
          assert 'ChaChaSupportCastService.GetKillChance' in resonance
          assert 'SupportCastRuntime=ENABLED' in skills

          # Existing materials/airship contract preserved.
          for token in [
              'Ronvotri.Cardcha_VitalDewdrop',
              'Ronvotri.Cardcha_MoonshieldShard',
              'Ronvotri.Cardcha_BreezeFeather',
              'Ronvotri.Cardcha_FortuneCoin',
              'StationTile = new(19, 5)',
              'UpgradeMaterialCosts = { 3, 5, 8, 12 }',
              'UpgradeDustCosts = { 5, 10, 15, 25 }'
          ]:
              assert token in mats
          assert 'CollisionEdits=NONE' in airship
          assert 'BossFormDurationMs = 10000' in boss
          assert 'SButton.LeftShift' in boss and 'SButton.A' in boss
          assert 'ControllerAction.Confirm' in boss and 'ControllerAction.Deselect' in boss

          def png_size(p):
              b=p.read_bytes(); assert b[:8]==b'\x89PNG\r\n\x1a\n'
              return struct.unpack('>II',b[16:24])
          assert png_size(root/'assets/items.png')==(112,16)
          assert png_size(root/'assets/chacha_skill_materials.png')==(128,32)
          assert png_size(root/'assets/chacha_skill_icons.png')==(128,32)
          assert png_size(root/'assets/card_icons.png')==(320,1024)
          assert len(audit)==76 and all(r['status']=='PASS' for r in audit)
          print('ChaCha Support Cast source acceptance PASS')
          PY

          test "$(git hash-object src/Cardcha/assets/items.png)" = "448d5805225e2ea8f32e893912a0755912c76f10"
          test "$(git hash-object src/Cardcha/assets/chacha_skill_materials.png)" = "421ef435d4d4964a858223b5d2f1589c59602dd2"
          test "$(git hash-object src/Cardcha/assets/chacha_skill_icons.png)" = "9d6d71ebb2eaf86fc6de9bf65df21c176dd17280"
          test "$(sha256sum src/Cardcha/assets/card_icons.png | cut -d' ' -f1)" = "c5ff456e9a0a697a10537a391ec5abf2f90966de89299799fd2153356b1e6e41"
          test "$(sha256sum src/Cardcha/assets/airship_visual.png | cut -d' ' -f1)" = "1821ee869759a924f7ff2b6821aaeb64b80a000d84c46f207a578d3a1e771132"
          test "$(git hash-object src/Cardcha/assets/mimi_broom.png)" = "0410660a8ec2f3190b20882898c1897e67819f9d"
          test "$(git hash-object src/Cardcha/assets/mimi_profile.png)" = "2cecabf9d4249c0ee5801f32c7d780a0151a17c9"

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile test build
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Materialize generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/chacha-support-cast-canon.md \
            src/Cardcha/manifest.json \
            src/Cardcha/Cardcha.csproj \
            src/Cardcha/Directory.Build.targets \
            src/Cardcha/ModEntry.cs \
            src/Cardcha/Patches/FarmerDamagePatch.cs \
            src/Cardcha/Services/ChaChaSupportCastService.cs \
            src/Cardcha/Services/ChaChaSkillService.cs \
            src/Cardcha/Services/MonsterDeathService.cs \
            src/Cardcha/Services/GeneratedCardAutoAudit.cs \
            src/Cardcha/UI/ChaChaResonanceMenu.cs \
            src/Cardcha/assets/card_auto_audit.json \
            src/Cardcha/i18n/default.json \
            src/Cardcha/i18n/vi.json \
            tools/alpha28_41444_chacha_support_cast_runtime.py \
            .github/workflows/cardcha-alpha28-062-chacha-support-cast-runtime.yml
          if git diff --cached --quiet; then
            echo "No generated source diff."
          else
            git commit -m "chore: materialize alpha28.0.4.14.4.4 ChaCha Support Cast runtime [skip ci]"
            git push origin HEAD:cardcha-alpha28-062-chacha-support-cast-runtime
          fi

      - name: Final regression
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CurrentSchemaVersion = 19' src/Cardcha/Services/SaveService.cs
          grep -q 'CooldownSecondsByLevel = { 40, 35, 30, 25, 20 }' src/Cardcha/Services/ChaChaSupportCastService.cs
          grep -q 'LuckyDamageChanceByLevel = { 0.04d, 0.05d, 0.06d, 0.07d, 0.08d }' src/Cardcha/Services/ChaChaSupportCastService.cs
          grep -q 'BossFormDurationMs = 10000' src/Cardcha/Services/ChaChaBossFormService.cs
          grep -q 'CollisionEdits=NONE' src/Cardcha/Services/AirshipFoundationService.cs
          test "$(git hash-object src/Cardcha/assets/chacha_skill_icons.png)" = "9d6d71ebb2eaf86fc6de9bf65df21c176dd17280"
          test "$(git hash-object src/Cardcha/assets/chacha_skill_materials.png)" = "421ef435d4d4964a858223b5d2f1589c59602dd2"
          python3 - <<'PY'
          import json
          rows=json.load(open('src/Cardcha/assets/card_auto_audit.json',encoding='utf-8'))
          assert len(rows)==76 and all(r['status']=='PASS' for r in rows)
          print('76/76 card contract preserved')
          PY

      - name: Package compiled test build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha
          cp "$(find src/Cardcha/bin -name Cardcha.dll -print -quit)" stage/Cardcha/
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/
          test -s stage/Cardcha/Cardcha.dll
          test "$(python3 -c "import json; print(json.load(open('stage/Cardcha/manifest.json'))['Version'])")" = "0.3.0-alpha.28.0.4.14.4.4"
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.28.0.4.14.4.4_ChaChaSupportCastRuntime_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-062-chacha-support-cast-runtime
          path: artifact
          if-no-files-found: error
