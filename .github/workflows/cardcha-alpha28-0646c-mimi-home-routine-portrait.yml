name: Cardcha alpha28.0.4.14.4.5.11.3 MiMi Home Routine Portrait

on:
  push:
    branches: [ cardcha-alpha28-0646c-mimi-home-routine-portrait ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate or reuse .5.11.3 source
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '0.3.0-alpha.28.0.4.14.4.5.11.3' src/Cardcha/manifest.json; then
            echo '0646C source already materialized.'
          else
            python3 tools/alpha28_0646c_mimi_home_routine_portrait.py
          fi

      - name: Validate .5.11.3 behavior and locked contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('src/Cardcha'); assets=root/'assets'
          version='0.3.0-alpha.28.0.4.14.4.5.11.3'
          assert json.loads((root/'manifest.json').read_text())['Version']==version
          home=(root/'Services/MimiHomeService.cs').read_text()
          for t in ['HomeIdleTiles', 'TvIdleTiles', 'LateIdleTiles', 'UpdateHomeWander', 'living wander active', 'OwnsAnyAtticDialogueNow', 'RegisterHomeTalkFriendship', 'ShowMimiPortraitDialogue']:
              assert t in home, t
          mod=(root/'ModEntry.cs').read_text()
          assert '() => this.Home.OwnsAnyAtticDialogueNow()' in mod
          social=(root/'Services/MimiSocialService.cs').read_text()
          assert "MiMi's attic is her home, never a shop" in social
          en=json.loads((root/'i18n/default.json').read_text())
          vi=json.loads((root/'i18n/vi.json').read_text())
          assert 'mimi.attic.routine.home.talk' in en and 'mimi.attic.routine.home.talk' in vi
          save=(root/'Models/SaveData.cs').read_text(); assert 'SchemaVersion { get; set; } = 19' in save
          assert hashlib.sha256((assets/'airship_visual.png').read_bytes()).hexdigest()=='1821ee869759a924f7ff2b6821aaeb64b80a000d84c46f207a578d3a1e771132'
          assert 'BossFormDurationMs = 10000' in (root/'Services/ChaChaBossFormService.cs').read_text()
          assert 'EnergyGainScale = 1d / 3d' in (root/'Services/BossEnergyService.cs').read_text()
          audit=json.loads((assets/'card_auto_audit.json').read_text()); assert len(audit)==76 and all(x['status']=='PASS' for x in audit)
          gate=(root/'Patches/AirshipGateRelocationPatch.cs').read_text()
          assert 'CanonicalGateUseDistance = 160f' in gate and 'CollisionEdits=NONE' in gate
          print('0646C validation PASS')
          PY

      - name: Materialize .5.11.3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized diff.'
          else
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.11.3 MiMi home routine portrait [skip ci]'
            git push origin HEAD:cardcha-alpha28-0646c-mimi-home-routine-portrait
          fi

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Package .5.11.3 test build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha
          dll="$(find src/Cardcha/bin/Release -name Cardcha.dll -print -quit)"
          test -n "$dll" && test -s "$dll"
          cp "$dll" stage/Cardcha/Cardcha.dll
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.11.3_MiMiHomeRoutinePortrait_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0646c-mimi-home-routine-portrait
          path: artifact
          if-no-files-found: error
