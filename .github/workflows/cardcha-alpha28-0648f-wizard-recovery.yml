name: Cardcha alpha28.0.4.14.4.5.12.12 Wizard Recovery

on:
  push:
    branches: [ cardcha-alpha28-0648f-wizard-recovery ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 0648F recovery candidate
        run: python3 tools/alpha28_0648f_wizard_recovery.py

      - name: Validate portrait and Wizard acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, struct, subprocess, zlib

          root=Path('src/Cardcha')
          version='0.3.0-alpha.28.0.4.14.4.5.12.12'
          assert json.loads((root/'manifest.json').read_text())['Version']==version
          assert version in (root/'Cardcha.csproj').read_text()
          assert version in (root/'Directory.Build.targets').read_text()

          # One portrait sheet only, physically 6 x 64x64 in the shipped assets.
          portrait=root/'assets/mimi_portraits.png'
          raw=portrait.read_bytes()
          assert raw[:8] == b'\x89PNG\r\n\x1a\n'
          width,height=struct.unpack('>II', raw[16:24])
          assert (width,height)==(384,64), (width,height)
          assert not (root/'assets/mimi_portraits_runtime64.png').exists()
          assert not (root/'assets/mimi_npc_portraits.png').exists()

          mystery=(root/'Services/MimiMysteryTownService.cs').read_text()
          assert 'e.LoadFromModFile<Texture2D>(MimiPortraitsPath, AssetLoadPriority.Exclusive);' in mystery
          assert 'SetRectangleProperty(mimi, "MugShotSourceRect", 8, 0, 16, 24);' in mystery
          assert 'GetNativePortraitCompatibilitySheet' not in mystery
          assert 'CreateRuntimePortraitSheet' not in mystery
          assert 'targetSize = 64' not in mystery

          # Stair is a single hard-coded SVE tile. No percentage/map-size/search fallback in this method.
          home=(root/'Services/MimiHomeService.cs').read_text()
          a=home.index('internal static Point ResolvePreferredWizardStairTile')
          b=home.index('private static Point ResolveWizardLandingTile', a)
          stair_method=home[a:b]
          assert 'return new Point(11, 15);' in stair_method
          for forbidden in ['LayerWidth','LayerHeight','Math.Clamp','Math.Round','FindClearTileNear','IsTileClear','for (','foreach']:
              assert forbidden not in stair_method, (forbidden, stair_method)

          # Stair art is split and normal-depth sorted, never one whole always-front overlay.
          visual=(root/'Services/MimiAtticVisualService.cs').read_text()
          a=visual.index('private void DrawStairMarker')
          b=visual.index('private static AtticLayout GetLayout', a)
          draw=visual[a:b]
          assert 'upperSource' in draw and 'lowerSource' in draw
          assert 'upperDepth' in draw and 'lowerDepth' in draw
          assert '0.995f' not in draw

          # Scope firewall: no Airship, Gate, MiMi routine, or unrelated implementation changes.
          changed=subprocess.check_output([
              'git','diff','--name-only','origin/cardcha-alpha28-0648d-wizard-stair-placement'
          ], text=True).splitlines()
          allowed={
              'tools/alpha28_0648f_wizard_recovery.py',
              '.github/workflows/cardcha-alpha28-0648f-wizard-recovery.yml',
              'src/Cardcha/Services/MimiMysteryTownService.cs',
              'src/Cardcha/Services/MimiHomeService.cs',
              'src/Cardcha/Services/MimiAtticVisualService.cs',
              'src/Cardcha/assets/mimi_portraits.png',
              'src/Cardcha/manifest.json',
              'src/Cardcha/Cardcha.csproj',
              'src/Cardcha/Directory.Build.targets',
          }
          unexpected=[x for x in changed if x not in allowed]
          assert not unexpected, f'unrelated files changed: {unexpected}'

          for protected in [
              'src/Cardcha/Services/AirshipFoundationService.cs',
              'src/Cardcha/Services/WorldActorService.cs',
              'src/Cardcha/Services/ProgressionService.cs',
              'src/Cardcha/assets/airship_visual.png',
              'src/Cardcha/assets/airship_deck.tmx',
              'src/Cardcha/assets/sky_dock_interior.tmx',
              'src/Cardcha/assets/mimi_attic.tmx',
          ]:
              rc=subprocess.run(['git','diff','--quiet','origin/cardcha-alpha28-0648d-wizard-stair-placement','--',protected]).returncode
              assert rc==0, f'protected file changed: {protected}'

          # MiMi routine section in HomeService must be byte-identical outside the stair method replacement.
          base=subprocess.check_output(['git','show','origin/cardcha-alpha28-0648d-wizard-stair-placement:src/Cardcha/Services/MimiHomeService.cs'], text=True)
          def strip_stair_method(text):
              a=text.index('    internal static Point ResolvePreferredWizardStairTile')
              b=text.index('    private static Point ResolveWizardLandingTile',a)
              return text[:a] + '<WIZARD_STAIR_METHOD>\n' + text[b:]
          assert strip_stair_method(home)==strip_stair_method(base), 'MimiHomeService changed outside Wizard stair method'

          print('0648F acceptance validator PASS')
          print('portrait:', width, 'x', height, 'single static six-frame sheet')
          print('gift/social mugshot:', (8,0,16,24))
          print('SVE WizardHouse dimensions verified externally: 15x35; fixed stair tile: (11,15)')
          print('changed files:', changed)
          PY
          sha256sum src/Cardcha/assets/mimi_portraits.png

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.12 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Cardcha
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.12 Wizard recovery [skip ci]'
            git push origin HEAD:cardcha-alpha28-0648f-wizard-recovery
          fi

      - name: Package .5.12.12 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.12_WizardRecovery_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"

          python3 - <<'PY'
          from pathlib import Path
          import json, struct, zipfile
          z=Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.12_WizardRecovery_TEST.zip')
          with zipfile.ZipFile(z) as f:
              names=f.namelist()
              manifest=json.loads(f.read('Cardcha/manifest.json'))
              assert manifest['Version']=='0.3.0-alpha.28.0.4.14.4.5.12.12'
              assert 'Cardcha/assets/mimi_portraits.png' in names
              assert not any(n.endswith('mimi_portraits_runtime64.png') or n.endswith('mimi_npc_portraits.png') for n in names)
              raw=f.read('Cardcha/assets/mimi_portraits.png')
              w,h=struct.unpack('>II',raw[16:24])
              assert (w,h)==(384,64)
              assert len(f.read('Cardcha/Cardcha.dll'))>100000
          print('Final .5.12.12 package audit PASS')
          PY

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0648f-wizard-recovery
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.12_WizardRecovery_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.12_WizardRecovery_TEST.zip.sha256
          if-no-files-found: error
