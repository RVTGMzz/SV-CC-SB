name: Cardcha alpha28.0.4.14.4.5.12.39 Remaining Boss Foundation

on:
  push:
    branches: [ cardcha-alpha28-0670-remaining-boss-foundation ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 0670 remaining boss foundation
        run: python3 tools/alpha28_0670_remaining_boss_foundation.py

      - name: Validate 0670 boss contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, xml.etree.ElementTree as ET

          root = Path('src/Cardcha')
          version = '0.3.0-alpha.28.0.4.14.4.5.12.39'
          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['Version'] == version
          assert version in (root/'Cardcha.csproj').read_text(encoding='utf-8')
          assert version in (root/'Directory.Build.targets').read_text(encoding='utf-8')

          boss = (root/'Services/MilestoneBossService.cs').read_text(encoding='utf-8')
          required = [
              'MilestoneBossKind.HollowCurator',
              'MilestoneBossKind.TricolorResonance',
              'MilestoneBossKind.Mimi',
              'HollowCuratorMaxHealth = 2200',
              'TricolorGuardianMaxHealth = 780',
              'TricolorUnifiedMaxHealth = 1650',
              'MimiMaxHealth = 3600',
              'MirrorArchiveBossCardId = "mirror_archive"',
              'TricolorBossCardId = "tricolor_resonance"',
              'MimiBossCardId = "mimis_resonance"',
              'SpawnTricolorUnified()',
              '("ignis", new Point(8, 8))',
              '("vita", new Point(14, 6))',
              '("aether", new Point(20, 8))',
              'foreach ((string role, Point tile) in TricolorGuardianTiles)',
              'this.SpawnProxy(arena, role, tile, TricolorGuardianMaxHealth)',
              'proxy.isInvisible.Value = false',
              'this.CuratorAdaptationStacks = Math.Min(3',
              'ratio <= 0.75f',
              'ratio <= 0.50f',
              'ratio <= 0.25f',
              'BossCardsUnlocked.Add(reward)',
              'AirshipHighestRegionUnlocked = Math.Max',
          ]
          for token in required:
              assert token in boss, token

          entry = (root/'ModEntry.cs').read_text(encoding='utf-8')
          for token in [
              'MilestoneBossService MilestoneBosses',
              'new MilestoneBossService(helper, this.Monitor, this.Save)',
              'this.MilestoneBosses.OnAssetRequested',
              'this.MilestoneBosses.OnSaveLoaded',
              'this.MilestoneBosses.OnUpdateTicked',
              'this.MilestoneBosses.OnRenderedHud',
              'this.MilestoneBosses.OnRenderedWorld',
              'this.MilestoneBosses.OnButtonPressed',
              'this.MilestoneBosses.OnWarped',
              'cardcha_test_boss2',
              'cardcha_test_boss3',
              'cardcha_test_boss4',
              'cardcha_boss_milestone_status',
              'REMAINING BOSS FOUNDATION TEST',
          ]:
              assert token in entry, token

          draw_patch = (root/'Patches/VerdantGuardianProxyDrawPatch.cs').read_text(encoding='utf-8')
          assert 'MilestoneBossService.BossMarkerKey' in draw_patch
          assert 'VerdantGuardianBossService.BossAddMarkerKey' in draw_patch

          damage_patch = (root/'Patches/MonsterDamagePatch.cs').read_text(encoding='utf-8')
          for token in [
              'bool isMilestoneBoss',
              'isVerdantTotem || isMilestoneBoss',
              '!__instance.modData.ContainsKey(MilestoneBossService.BossMarkerKey)',
          ]:
              assert token in damage_patch, token

          save = (root/'Services/SaveService.cs').read_text(encoding='utf-8')
          assert 'CurrentSchemaVersion = 19' in save
          assert 'CurrentSchemaVersion = 20' not in save

          # Locked MiMi walk art must be byte-for-byte unchanged from materialized 0669.
          mimi = root/'assets/mimi_walk.png'
          assert mimi.exists() and mimi.stat().st_size == 65167
          diff = subprocess.run([
              'git', 'diff', '--quiet',
              'origin/cardcha-alpha28-0669-visual-auth-pass', '--',
              'src/Cardcha/assets/mimi_walk.png'
          ])
          assert diff.returncode == 0, 'mimi_walk.png changed from 0669 baseline'

          cards = json.loads((root/'assets/cards.json').read_text(encoding='utf-8'))
          legacy = {'endless_hunt','fate_weaver','immortal_echo','worldbreaker'}
          assert len(cards) == 80
          assert len([c for c in cards if c.get('Id') not in legacy]) == 76

          # Preserve 0669 Boss I actor-auth baseline while 0669 is awaiting player acceptance.
          verdant = (root/'Services/VerdantGuardianBossService.cs').read_text(encoding='utf-8')
          assert verdant.count('isInvisible.Value = false') >= 2
          summon_visual = (root/'Services/VerdantGuardianSummonVisualService.cs').read_text(encoding='utf-8')
          assert '2.05f' in summon_visual and '2.20f' in summon_visual

          checked = 0
          for tmx in sorted((root/'assets').rglob('*.tmx')):
              map_root = ET.parse(tmx).getroot()
              for layer in map_root.findall('layer'):
                  data = layer.find('data')
                  if data is None or data.attrib.get('encoding') != 'csv':
                      continue
                  vals = []
                  for i, token in enumerate((data.text or '').split(',')):
                      st = token.strip()
                      assert st != '', f'{tmx}: empty CSV token {i}'
                      n = int(st)
                      assert 0 <= n <= 0xFFFFFFFF
                      vals.append(n)
                  assert len(vals) == int(layer.attrib['width']) * int(layer.attrib['height']), tmx
                  checked += 1
          assert checked >= 21, checked

          print(f'0670 validator PASS; BossII/III/IV=FUNCTIONAL schema=19 cards=76/80 strictTMX={checked}')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.39 source + handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.39 remaining boss foundation [skip ci]'
            git push origin HEAD:cardcha-alpha28-0670-remaining-boss-foundation
          fi

      - name: Package .5.12.39 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.39_RemainingBossFoundation_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile
          z = Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.39_RemainingBossFoundation_TEST.zip')
          with zipfile.ZipFile(z) as f:
              assert json.loads(f.read('Cardcha/manifest.json'))['Version'] == '0.3.0-alpha.28.0.4.14.4.5.12.39'
              assert len(f.read('Cardcha/Cardcha.dll')) > 100000
              assert len(f.read('Cardcha/assets/mimi_walk.png')) == 65167
          print('0670 final package audit PASS')
          PY

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0670-remaining-boss-foundation
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.39_RemainingBossFoundation_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.39_RemainingBossFoundation_TEST.zip.sha256
          if-no-files-found: error
