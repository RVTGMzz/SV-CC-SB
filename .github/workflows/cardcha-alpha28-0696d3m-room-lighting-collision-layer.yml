name: Cardcha 0696D3-M Room Lighting Collision Layer TEST

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout D3-M branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup deterministic image tooling
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Materialize clean console asset
        run: python3 tools/materialize_0696d3i_console_asset.py

      - name: Run D3-M room runtime validator
        run: python3 tools/alpha28_0696d3m_room_lighting_collision_layer.py

      - name: Validate no legacy Window overlay reuse
        run: python3 tools/validate_0696d2_no_legacy_overlay_reuse.py

      - name: Validate render-depth contract
        run: python3 tools/validate_render_depth_contract.py

      - name: Prove validators did not mutate tracked production inputs
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD --             src/Cardcha/Patches/AirshipGateDepthPatch.cs             src/Cardcha/Services/AirshipFoundationService.cs             src/Cardcha/Services/AirshipAmbientAnimationService.cs             src/Cardcha/ModEntry.cs             src/Cardcha/manifest.json             src/Cardcha/Cardcha.csproj             src/Cardcha/Directory.Build.targets             src/Cardcha/assets/sky_dock_interior.tmx             src/Cardcha/assets/airship_deck.tmx             src/Cardcha/assets/airship_props/set01_redux/airship_ambient_manifest.json

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha Release
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Package D3-M .77 TEST
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION='0.3.0-alpha.28.0.4.14.4.5.12.77'
          ZIP="Cardcha_v${VERSION}_0696D3M_RoomLightingCollisionLayer_TEST.zip"
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name Cardcha.dll | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 "$GITHUB_WORKSPACE/tools/alpha28_0696d3m_package_audit.py"             "$ZIP" --report "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3M_PACKAGE_AUDIT.json"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Record D3-M CI evidence
        id: evidence
        shell: bash
        env:
          ZIP_NAME: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          TAG="cardcha-0696d3m-test-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root=Path(os.environ['GITHUB_WORKSPACE'])
          package=root/'package'/os.environ['ZIP_NAME']
          evidence={
              'phase':'0696D3-M-ci-evidence',
              'runId':int(os.environ['GITHUB_RUN_ID']),
              'runUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'sourceCommit':os.environ['GITHUB_SHA'],
              'releaseTag':f"cardcha-0696d3m-test-{os.environ['GITHUB_SHA'][:8]}",
              'package':package.name,
              'packageSha256':hashlib.sha256(package.read_bytes()).hexdigest(),
              'roomRuntimeValidator':'PASS',
              'renderDepth':'PASS',
              'compile':'PASS',
              'packageAudit':'PASS',
              'runtimeAcceptance':'PENDING-RON-IN-GAME',
          }
          (root/'handoff/AIRSHIP_0696D3M_CI_EVIDENCE.json').write_text(json.dumps(evidence,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(evidence,indent=2))
          PY

      - name: Publish D3-M TEST as GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ steps.package.outputs.zip }}
          TAG: ${{ steps.evidence.outputs.tag }}
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/package/$ZIP_NAME"
          NOTES=$(cat <<'EOF'
          0696D3-M TEST package from Ron's 2026-09-29 in-game screenshots.

          Narrow runtime fixes:
          - Room 1 gets a readable indoor ambient guard and restores the previous ambient on exit.
          - Observation Window + console transient FX use true background layer depths behind Farmer.
          - Observation Window lower sill gets native TMX collision.
          - All four UPGRADE machines use 3x2 full-body TMX collision instead of base-row-only collision.
          - TRAVEL and BOARD AIRSHIP center lanes remain open.
          - No broad GameLocation.isCollidingPosition Harmony postfix is restored.
          - No Farmer.Position pin/rewind architecture is restored.

          Expected startup:
          Cardcha! 0.3.0-alpha.28.0.4.14.4.5.12.77 0696D3-M ROOM LIGHTING COLLISION LAYER FIX TEST

          First runtime acceptance:
          1. Room 1 is readable instead of near-black.
          2. Farmer cannot stand inside any UPGRADE machine.
          3. Window/console no longer visually blanket-cover Farmer.
          4. Window lower sill is solid.
          5. TRAVEL / BOARD AIRSHIP / Resonance interactions still work.

          CI/static/package PASS is not Runtime PASS.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving canonical assets and skipping publish."
            exit 0
          fi

          gh release create "$TAG"             "$ZIP_PATH" "$ZIP_PATH.sha256"             "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3M_ROOM_FIX_VALIDATION.json"             "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3M_PACKAGE_AUDIT.json"             "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3M_CI_EVIDENCE.json"             --target "$GITHUB_SHA" --prerelease             --title "Cardcha 0696D3-M Room Lighting Collision Layer TEST"             --notes "$NOTES"
