name: Cardcha 0696D3-J Collision Lanes TEST

# Historical D3-J workflow. D3-K changes runtime collision hook resolution and startup identity.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout D3-J branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup deterministic image tooling
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Materialize clean console asset
        run: python3 tools/materialize_0696d3i_console_asset.py

      - name: Run D3-J collision lane validator
        run: python3 tools/alpha28_0696d3j_collision_lanes.py

      - name: Validate no legacy Window overlay reuse
        run: python3 tools/validate_0696d2_no_legacy_overlay_reuse.py

      - name: Validate render-depth contract
        run: python3 tools/validate_render_depth_contract.py

      - name: Prove validators did not mutate tracked production inputs
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- \
            src/Cardcha/Patches/AirshipGateDepthPatch.cs \
            src/Cardcha/Services/AirshipFoundationService.cs \
            src/Cardcha/Services/ChaChaSkillMaterialService.cs \
            src/Cardcha/assets/sky_dock_interior.tmx \
            src/Cardcha/assets/airship_deck.tmx \
            src/Cardcha/assets/airship_props/set01_redux/airship_ambient_manifest.json \
            src/Cardcha/manifest.json \
            src/Cardcha/Cardcha.csproj \
            src/Cardcha/Directory.Build.targets

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha Release
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Package D3-J .74 TEST
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION='0.3.0-alpha.28.0.4.14.4.5.12.74'
          ZIP="Cardcha_v${VERSION}_0696D3J_CollisionLanes_TEST.zip"
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name Cardcha.dll | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 "$GITHUB_WORKSPACE/tools/alpha28_0696d3j_package_audit.py" \
            "$ZIP" --report "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3J_PACKAGE_AUDIT.json"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Record D3-J CI evidence
        id: evidence
        shell: bash
        env:
          ZIP_NAME: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          TAG="cardcha-0696d3j-test-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root=Path(os.environ['GITHUB_WORKSPACE'])
          package=root/'package'/os.environ['ZIP_NAME']
          evidence={
              'phase':'0696D3-J-ci-evidence',
              'runId':int(os.environ['GITHUB_RUN_ID']),
              'runUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'sourceCommit':os.environ['GITHUB_SHA'],
              'releaseTag':f"cardcha-0696d3j-test-{os.environ['GITHUB_SHA'][:8]}",
              'package':package.name,
              'packageSha256':hashlib.sha256(package.read_bytes()).hexdigest(),
              'collisionValidator':'PASS',
              'renderDepth':'PASS',
              'compile':'PASS',
              'packageAudit':'PASS',
              'runtimeAcceptance':'PENDING-RON-IN-GAME',
          }
          (root/'handoff/AIRSHIP_0696D3J_CI_EVIDENCE.json').write_text(json.dumps(evidence,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(evidence,indent=2))
          PY

      - name: Publish D3-J TEST as GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ steps.package.outputs.zip }}
          TAG: ${{ steps.evidence.outputs.tag }}
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/package/$ZIP_NAME"
          NOTES=$(cat <<'EOF'
          0696D3-J TEST package focused on Ron's original collision/blocking requirements.

          Main changes:
          - Room 1 notice board, Lost & Found, waiting bench, luggage and cargo use full-body native collision footprints.
          - Room 1 keeps one explicit horizontal interaction lane in front of each prop.
          - Waiting bench/luggage reflow keeps the boarding runner completely clear.
          - Boarding gate side furnishings are solid while the center throat remains open.
          - Room 1 ambient lighting raised substantially for readability.
          - Deck Navigation console uses full-body collision with a front interaction lane.
          - TRAVEL gate uses segmented side collision with the center lane open.
          - All four UPGRADE bases are solid.
          - Signal lamp and 2x ChaCha Resonance machine are solid; Resonance interaction moved to the front lane.
          - Travel runner is rerouted around the Engine station and never crosses a blocked tile.
          - Runtime collision-query segments mirror the TMX footprints without changing Farmer.Position.

          CI/static/package PASS is not Runtime PASS.
          Ron must test actual movement in this exact package.
          EOF
          )
          # Rerun-safe release behavior:
          # if this exact source tag already exists, keep the first canonical package untouched.
          # Rebuild ZIP bytes may differ because compiler/zip metadata isn't fully reproducible.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving canonical assets and skipping publish."
            exit 0
          fi

          gh release create "$TAG" \
            "$ZIP_PATH" "$ZIP_PATH.sha256" \
            "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3J_COLLISION_LANES_VALIDATION.json" \
            "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3J_PACKAGE_AUDIT.json" \
            "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3J_CI_EVIDENCE.json" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Cardcha 0696D3-J Collision Lanes TEST" \
            --notes "$NOTES"
