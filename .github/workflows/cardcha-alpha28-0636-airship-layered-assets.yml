name: Cardcha alpha28.0.4.14.4.5.5 Real Layered Airship Assets

on:
  push:
    branches: [ cardcha-alpha28-0636-airship-layered-assets ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install layered-asset tools
        shell: bash
        run: python3 -m pip install --quiet pillow

      - name: Generate real Airship layers + finalize source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/alpha28_0636_airship_layered_assets_finalize.py

      - name: Validate layered Airship contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json

          root = Path('src/Cardcha')
          assets = root/'assets'
          version = '0.3.0-alpha.28.0.4.14.4.5.5'
          locked = '1821ee869759a924f7ff2b6821aaeb64b80a000d84c46f207a578d3a1e771132'

          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['Version'] == version, manifest['Version']
          assert f'<Version>{version}</Version>' in (root/'Cardcha.csproj').read_text(encoding='utf-8')
          assert f'<Version>{version}</Version>' in (root/'Directory.Build.targets').read_text(encoding='utf-8')

          official = assets/'airship_visual.png'
          assert hashlib.sha256(official.read_bytes()).hexdigest() == locked

          names = [
              'airship_layer_shadow.png',
              'airship_layer_balloon.png',
              'airship_layer_hull.png',
              'airship_layer_rigging.png',
              'airship_layer_glow.png',
          ]
          for name in names:
              path = assets/name
              assert path.is_file() and path.stat().st_size > 1000, name
              with Image.open(path) as im:
                  im.load()
                  assert im.mode == 'RGBA', (name, im.mode)
                  assert im.size == (384, 256), (name, im.size)
                  assert im.getchannel('A').getbbox() is not None, name

          renderer = (root/'Services/AirshipLayeredRenderer.cs').read_text(encoding='utf-8')
          foundation = (root/'Services/AirshipFoundationService.cs').read_text(encoding='utf-8')
          depth = (root/'Patches/AirshipVisualDepthPatch.cs').read_text(encoding='utf-8')
          assert 'airship_layer_balloon.png' in renderer
          assert 'airship_layer_hull.png' in renderer
          assert 'airship_layer_rigging.png' in renderer
          assert 'airship_layer_glow.png' in renderer
          assert 'AirshipLayeredRenderer.TryDraw(batch, center, targetWidth' in foundation
          assert depth.count('AirshipLayeredRenderer.HasLayerAssets()') >= 2

          gate = (root/'Patches/AirshipGateRelocationPatch.cs').read_text(encoding='utf-8')
          assert 'RelocatedGateUseDistance = 160f' in gate
          assert 'BuildAlternateZones' in gate and 'BuildSectorSweep' in gate

          energy = (root/'Services/BossEnergyService.cs').read_text(encoding='utf-8')
          assert 'EnergyGainScale = 1d / 3d' in energy
          assert 'BossFormDurationMs = 10000' in (root/'Services/ChaChaBossFormService.cs').read_text(encoding='utf-8')
          assert 'CurrentSchemaVersion = 19' in (root/'Services/SaveService.cs').read_text(encoding='utf-8')

          audit = json.loads((assets/'card_auto_audit.json').read_text(encoding='utf-8'))
          assert len(audit) == 76 and all(row['status'] == 'PASS' for row in audit)

          pngs = sorted(assets.glob('*.png'))
          for path in pngs:
              with Image.open(path) as im:
                  im.load()
          print(f'Real layered Airship acceptance PASS | decoded PNGs={len(pngs)}')
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Materialize generated layered assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            src/Cardcha/assets/airship_layer_shadow.png \
            src/Cardcha/assets/airship_layer_balloon.png \
            src/Cardcha/assets/airship_layer_hull.png \
            src/Cardcha/assets/airship_layer_rigging.png \
            src/Cardcha/assets/airship_layer_glow.png \
            src/Cardcha/Services/AirshipLayeredRenderer.cs \
            src/Cardcha/Services/AirshipFoundationService.cs \
            src/Cardcha/Patches/AirshipVisualDepthPatch.cs \
            src/Cardcha/manifest.json \
            src/Cardcha/Cardcha.csproj \
            src/Cardcha/Directory.Build.targets \
            src/Cardcha/ModEntry.cs \
            tools/alpha28_0636_airship_layered_assets_finalize.py \
            tools/airship_layered_assets_marker.txt \
            docs/airship-layered-assets-plan-2026-09-03.md \
            .github/workflows/cardcha-alpha28-0636-airship-layered-assets.yml || true

          if git diff --cached --quiet; then
            echo "No materialized source diff."
          else
            git commit -m "chore: materialize alpha28.0.4.14.4.5.5 real layered Airship assets [skip ci]"
            git push origin HEAD:cardcha-alpha28-0636-airship-layered-assets
          fi

      - name: Package test build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha

          dll="$(find src/Cardcha/bin/Release -name Cardcha.dll -print -quit)"
          test -n "$dll" && test -s "$dll"
          cp "$dll" stage/Cardcha/Cardcha.dll
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/

          test "$(python3 -c "import json; print(json.load(open('stage/Cardcha/manifest.json'))['Version'])")" = "0.3.0-alpha.28.0.4.14.4.5.5"
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.5_RealLayeredAirshipAssets_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

          python3 - <<'PY'
          from zipfile import ZipFile
          from PIL import Image
          from io import BytesIO
          from pathlib import Path
          import json

          z = next(Path('artifact').glob('Cardcha_*.zip'))
          required = [
              'Cardcha/assets/airship_layer_shadow.png',
              'Cardcha/assets/airship_layer_balloon.png',
              'Cardcha/assets/airship_layer_hull.png',
              'Cardcha/assets/airship_layer_rigging.png',
              'Cardcha/assets/airship_layer_glow.png',
          ]
          with ZipFile(z) as f:
              assert 'Cardcha/Cardcha.dll' in f.namelist()
              manifest = json.loads(f.read('Cardcha/manifest.json'))
              assert manifest['Version'] == '0.3.0-alpha.28.0.4.14.4.5.5'
              for name in required:
                  assert name in f.namelist(), name
              for name in [n for n in f.namelist() if n.lower().endswith('.png')]:
                  im = Image.open(BytesIO(f.read(name)))
                  im.load()
          print('Artifact ZIP real-layer assets + PNG decode PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0636-airship-layered-assets
          path: artifact
          if-no-files-found: error
