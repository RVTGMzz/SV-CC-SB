name: Cardcha alpha28.0.4.14.4.5.12.29 Guardian Rabbit Boss Form

on:
  push:
    branches: [ cardcha-alpha28-0662-guardian-rabbit-boss-form ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install generator deps
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Generate 0662 Guardian Rabbit Boss Form
        run: python3 tools/alpha28_0662_guardian_rabbit_boss_form.py

      - name: Validate 0662 acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, xml.etree.ElementTree as ET

          root = Path('src/Cardcha')
          version = '0.3.0-alpha.28.0.4.14.4.5.12.29'
          manifest = json.loads((root/'manifest.json').read_text())
          assert manifest['Version'] == version
          assert version in (root/'Cardcha.csproj').read_text()
          assert version in (root/'Directory.Build.targets').read_text()

          form = (root/'Services/ChaChaBossFormService.cs').read_text()
          for token in [
              'public const string GuardianRabbitFormId = "guardian_rabbit";',
              'public const int BossFormDurationMs = 10000;',
              'public const int GuardianRootPulseIntervalMs = 2000;',
              'public const int GuardianRootPulseDamage = 18;',
              'public const float GuardianRootPulseRadius = 176f;',
              'this.Save.Data.Region1BossDefeated',
              'BossCardService.VerdantCoreId',
              'this.BossEnergy.TrySpend(BossEnergyService.MaxEnergy)',
              'this.BossEnergy.SetGainSuppressed(true)',
              'EmitGuardianRootPulse',
              'monster.takeDamage(GuardianRootPulseDamage, 0, 0, false, 0d, who)',
              'DebugForceGuardianRabbit',
          ]:
              assert token in form, token

          energy = (root/'Services/BossEnergyService.cs').read_text()
          assert 'public const double EnergyGainScale = 1d / 3d;' in energy
          assert 'public const double MaxEnergy = 100d;' in energy

          world = (root/'Services/WorldActorService.cs').read_text()
          for token in [
              'ChaChaGuardianCharacterAsset = "Characters/Ronvotri.Cardcha_ChaCha_GuardianRabbit"',
              'ChaChaGuardianSheetPath = "assets/chacha_guardian_rabbit.png"',
              'private const float ChaChaBossNativeScale = 0.82f;',
              'this.ChaChaBossVisualActive ? ChaChaGuardianCharacterAsset : ChaChaCharacterAsset',
              'new AnimatedSprite(desired, Math.Clamp(frame, 0, 15), 32, 32)',
          ]:
              assert token in world, token

          sprite = root/'assets/chacha_guardian_rabbit.png'
          assert sprite.exists() and sprite.stat().st_size > 500
          with Image.open(sprite) as im:
              assert im.size == (128, 128)
              assert im.mode == 'RGBA'
              # Dedicated art must actually occupy every directional row.
              for row in range(4):
                  crop = im.crop((0, row*32, 128, (row+1)*32))
                  assert crop.getbbox() is not None, row

          save = (root/'Models/SaveData.cs').read_text()
          assert 'SchemaVersion { get; set; } = 19;' in save
          assert 'Region1BossDefeated' in save
          assert 'BossCardsUnlocked' in save
          assert 'EquippedBossCardId' in save

          # 76 active normal cards stay untouched; all 80 stored IDs remain present.
          cards = json.loads((root/'assets/cards.json').read_text())
          legacy_mythic = {'endless_hunt', 'fate_weaver', 'immortal_echo', 'worldbreaker'}
          assert len(cards) == 80
          assert len([c for c in cards if c.get('Id') not in legacy_mythic]) == 76
          assert all(c.get('Id') not in {'guardian_rabbit', 'verdant_core'} for c in cards)

          for lang in ['default.json', 'vi.json']:
              data = json.loads((root/'i18n'/lang).read_text())
              for key in [
                  'chacha.boss.guardian.name',
                  'chacha.boss.guardian.desc',
                  'chacha.boss.guardian.activated',
                  'chacha.boss.guardian.locked',
              ]:
                  assert key in data, (lang, key)

          mod = (root/'ModEntry.cs').read_text()
          assert 'cardcha_guardian_rabbit_test' in mod
          assert 'runtime-only unlock' in mod
          assert '0.3.0-alpha.28.0.4.14.4.5.12.29 GUARDIAN RABBIT BOSS FORM TEST' in mod

          # Preserve 0660 Verdant Colossus + 0661 Boss Card runtime.
          visual = (root/'Services/VerdantGuardianVisualService.cs').read_text()
          assert 'private const float DrawScale = 8f;' in visual
          boss = (root/'Services/VerdantGuardianBossService.cs').read_text()
          assert 'private const int DefeatSequenceDurationMs = 2200;' in boss
          assert 'private Vector2 HeavyAnchor;' in boss
          proxy = (root/'Patches/VerdantGuardianProxyDrawPatch.cs').read_text()
          assert 'BossMarkerKey' in proxy
          boss_card = (root/'Services/BossCardService.cs').read_text()
          assert 'public const string VerdantCoreId = "verdant_core";' in boss_card
          assert 'public const double VerdantDamageReduction = 0.35d;' in boss_card
          assert 'public const int VerdantActiveDurationMs = 6000;' in boss_card
          assert 'public const int VerdantCooldownMs = 24000;' in boss_card

          # Preserve MiMi/stair/profile acceptance work.
          home = (root/'Services/MimiHomeService.cs').read_text()
          assert 'ResolvePreferredWizardStairTile' in home
          assert 'bool rightIsBoundary' in home
          profile = (root/'Patches/MimiProfileMenuPatch.cs').read_text()
          assert 'DrawScale=vanilla-4x' in profile
          vi = json.loads((root/'i18n/vi.json').read_text())
          assert 'trú mưa' in vi['mimi.social.community-center']

          checked_layers = 0
          for tmx in sorted((root/'assets').rglob('*.tmx')):
              map_root = ET.parse(tmx).getroot()
              for layer in map_root.findall('layer'):
                  data = layer.find('data')
                  if data is None or data.attrib.get('encoding') != 'csv':
                      continue
                  tokens = (data.text or '').split(',')
                  vals = []
                  for i, token in enumerate(tokens):
                      s = token.strip()
                      assert s != '', f'{tmx}: empty CSV token layer={layer.attrib.get("name")} index={i}'
                      n = int(s)
                      assert 0 <= n <= 0xFFFFFFFF
                      vals.append(n)
                  assert len(vals) == int(layer.attrib['width']) * int(layer.attrib['height'])
                  checked_layers += 1
          assert checked_layers >= 21
          print(f'0662 validator PASS; baseCards=80 active=76 form=guardian_rabbit TMXLayers={checked_layers}')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.29 source + handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.29 Guardian Rabbit Boss Form [skip ci]'
            git push origin HEAD:cardcha-alpha28-0662-guardian-rabbit-boss-form
          fi

      - name: Package .5.12.29 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.29_GuardianRabbitBossForm_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"

          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile, xml.etree.ElementTree as ET
          z = Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.29_GuardianRabbitBossForm_TEST.zip')
          with zipfile.ZipFile(z) as f:
              assert json.loads(f.read('Cardcha/manifest.json'))['Version'] == '0.3.0-alpha.28.0.4.14.4.5.12.29'
              assert len(f.read('Cardcha/Cardcha.dll')) > 100000
              assert len(f.read('Cardcha/assets/chacha_guardian_rabbit.png')) > 500
              vi = json.loads(f.read('Cardcha/i18n/vi.json'))
              assert vi['chacha.boss.guardian.name'] == 'Guardian Rabbit'
              for name in [n for n in f.namelist() if n.endswith('.tmx')]:
                  map_root = ET.fromstring(f.read(name))
                  for layer in map_root.findall('layer'):
                      data = layer.find('data')
                      if data is None or data.attrib.get('encoding') != 'csv':
                          continue
                      tokens = (data.text or '').split(',')
                      vals = [int(t.strip()) for t in tokens if t.strip()]
                      assert len(vals) == len(tokens), f'{name}: packaged empty CSV token'
                      assert len(vals) == int(layer.attrib['width']) * int(layer.attrib['height'])
          print('Final .5.12.29 package audit PASS')
          PY

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0662-guardian-rabbit-boss-form
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.29_GuardianRabbitBossForm_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.29_GuardianRabbitBossForm_TEST.zip.sha256
          if-no-files-found: error
