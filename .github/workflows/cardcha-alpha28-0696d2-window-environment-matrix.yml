name: Cardcha 0696D2 Rebaselined Window Environment Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - cardcha-alpha28-0696d2-window-environment-matrix
    paths:
      - .github/workflows/cardcha-alpha28-0696d2-window-environment-matrix.yml
      - tools/alpha28_0696d2_rebaseline_contract.py
      - tools/alpha28_0696d2_rebaseline_ci.py
      - tools/alpha28_0696d2_package_audit_rebaseline.py
      - recovery/0696d2-concept-masters/01_approved_time_of_day_masters/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout D2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup deterministic image tooling
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Materialize apply and validate D2 rebaseline
        run: python3 tools/alpha28_0696d2_rebaseline_ci.py

      - name: Validate no legacy Window overlay reuse
        run: python3 tools/validate_0696d2_no_legacy_overlay_reuse.py

      - name: Validate render-depth contract remains intact
        run: python3 tools/validate_render_depth_contract.py

      - name: Freeze accepted ship console maps and legacy overlays
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- \
            src/Cardcha/assets/airship_props/set01_redux/window_runtime/observation_window_airship.png \
            src/Cardcha/assets/airship_props/set01_redux/observation_window_overlay_1.png \
            src/Cardcha/assets/airship_props/set01_redux/observation_window_overlay_2.png \
            src/Cardcha/assets/airship_props/set01_redux/observation_window_overlay_3.png \
            src/Cardcha/assets/airship_props/set01_redux/observation_window_overlay_4.png \
            src/Cardcha/assets/airship_props/set01_redux/navigation_console_base.png \
            src/Cardcha/assets/airship_props/set01_redux/navigation_console_overlay_1.png \
            src/Cardcha/assets/airship_props/set01_redux/navigation_console_overlay_2.png \
            src/Cardcha/assets/airship_props/set01_redux/navigation_console_overlay_3.png \
            src/Cardcha/assets/airship_props/set01_redux/navigation_console_overlay_4.png \
            src/Cardcha/assets/airship_props/set01_redux/console_runtime \
            src/Cardcha/assets/airship_deck.tmx \
            src/Cardcha/assets/sky_dock_interior.tmx

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Commit validated rebaseline outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/Cardcha/assets/airship_props/set01_redux/window_runtime/window_scene_default_morning_clear.png \
            src/Cardcha/assets/airship_props/set01_redux/window_runtime/window_scene_default_noon_clear.png \
            src/Cardcha/assets/airship_props/set01_redux/window_runtime/window_scene_default_evening_clear.png \
            src/Cardcha/assets/airship_props/set01_redux/window_runtime/window_scene_default_night_clear.png \
            src/Cardcha/manifest.json \
            src/Cardcha/Cardcha.csproj \
            src/Cardcha/Directory.Build.targets \
            src/Cardcha/ModEntry.cs \
            src/Cardcha/Services/AirshipAmbientAnimationService.cs \
            src/Cardcha/Services/AirshipAmbientResolver.cs \
            src/Cardcha/assets/airship_props/set01_redux/airship_ambient_manifest.json \
            handoff/AIRSHIP_0696D2_REBASELINE_CANONICAL.json \
            handoff/AIRSHIP_0696D2_WINDOW_ENVIRONMENT_MATRIX_VALIDATION.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize 0696D2 rebaseline canonical outputs [skip ci]'
            git push origin HEAD:cardcha-alpha28-0696d2-window-environment-matrix
          fi

      - name: Package D2 .69 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name Cardcha.dll | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP='Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.69_0696D2_Rebaseline_WindowEnvironmentMatrix_TEST.zip'
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 "$GITHUB_WORKSPACE/tools/alpha28_0696d2_package_audit_rebaseline.py" "$ZIP"

      - name: Upload D2 .69 TEST and evidence
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0696D2-rebaseline-window-environment-matrix
          if-no-files-found: error
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.69_0696D2_Rebaseline_WindowEnvironmentMatrix_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.69_0696D2_Rebaseline_WindowEnvironmentMatrix_TEST.zip.sha256
            handoff/AIRSHIP_0696D2_REBASELINE_CANONICAL.json
            handoff/AIRSHIP_0696D2_WINDOW_ENVIRONMENT_MATRIX_VALIDATION.json
