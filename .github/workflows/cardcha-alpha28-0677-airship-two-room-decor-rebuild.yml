name: Cardcha 0677 Airship Two-Room Native Decor Rebuild

on:
  push:
    branches: [ cardcha-alpha28-0677-airship-two-room-decor-rebuild ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize 0677 two-room decor source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, xml.etree.ElementTree as ET

          old='0.3.0-alpha.28.0.4.14.4.5.12.45.2'
          new='0.3.0-alpha.28.0.4.14.4.5.12.45.3'
          root=Path('src/Cardcha')

          # Version bump only in authoritative version-bearing files.
          for rel in ['manifest.json','Cardcha.csproj','Directory.Build.targets','ModEntry.cs']:
              p=root/rel
              s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'{rel}: expected baseline version {old} missing')
              s=s.replace(old,new)
              s=s.replace('REGION LAYERING + MAP CLEANUP + GATE ALIGNMENT + WORLD DEPTH SAFETY HOTFIX TEST',
                          'AIRSHIP TWO-ROOM NATIVE DECOR REBUILD TEST')
              p.write_text(s,encoding='utf-8')

          # Replace the empty 0668 furniture hooks with a real, purposeful Stardew-native layout.
          p=root/'Services/AirshipFoundationService.cs'
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'private const string InteriorDecorVersion = "[^"]+";',
                   'private const string InteriorDecorVersion = "alpha.28.0.4.14.4.5.12.45.3";',s,count=1)

          start=s.index('    private void EnsureDeckVanillaFurniture(GameLocation deck)')
          end=s.index('    private static (AirshipUpgradeSystem System, Point Tile)[] ResolveDeckUpgradeSockets()', start)
          replacement=r'''    private void EnsureDeckVanillaFurniture(GameLocation deck)
    {
        if (ReferenceEquals(this.DeckDecorAppliedLocation, deck)
            && deck.modData.TryGetValue(InteriorDecorMarkerKey, out string? version)
            && string.Equals(version, InteriorDecorVersion + "-0677-bridge", StringComparison.Ordinal))
        {
            return;
        }

        this.DeckDecorAppliedLocation = deck;
        ClearInteriorDecor(deck);

        // 0677: Bridge is a lived-in flying workshop, not a showroom and not a test grid.
        // Wall identity. These are real Stardew wall furniture, so normal depth rules apply.
        TryAddInteriorFurniture(deck, "(F)1614", 5, 1);   // window
        TryAddInteriorFurniture(deck, "(F)1614", 17, 1);  // window
        TryAddInteriorFurniture(deck, "(F)1541", 9, 1);   // wall art
        TryAddInteriorFurniture(deck, "(F)1541", 14, 1);  // wall art
        TryAddInteriorFurniture(deck, "(F)1289", 2, 4);   // navigation/reference bookcase
        TryAddInteriorFurniture(deck, "(F)1289", 20, 4);  // maintenance/reference bookcase

        // Navigation / helm side. Keep x=10..14 as the main walking spine.
        TryAddInteriorFurniture(deck, "(F)1443", 3, 5);                         // warm lamp
        TryAddInteriorFurniture(deck, "(F)1120", 3, 7, heldId: "(F)1369");   // engine work table + lantern
        TryAddInteriorFurniture(deck, "(F)1399", 2, 10, heldId: "(F)1369");  // tool side table
        TryAddInteriorFurniture(deck, "(F)1390", 5, 10);                       // plant softens machinery corner
        TryAddInteriorFurniture(deck, "(F)704", 6, 10);                        // hull parts cabinet

        // Resonance / navigation side.
        TryAddInteriorFurniture(deck, "(F)1443", 20, 5);                        // warm lamp
        TryAddInteriorFurniture(deck, "(F)1132", 18, 7, heldId: "(F)1368");  // navigation table + crystal
        TryAddInteriorFurniture(deck, "(F)1399", 20, 10, heldId: "(F)1369"); // reactor side table
        TryAddInteriorFurniture(deck, "(F)1390", 18, 10);                       // plant
        TryAddInteriorFurniture(deck, "(F)1132", 15, 10, heldId: "(F)1368"); // reactor focus table

        // Soft zones. Rugs provide visual grouping without blocking the Farmer.
        TryAddInteriorFurniture(deck, "(F)1456", 9, 6);   // helm rug
        TryAddInteriorFurniture(deck, "(F)1623", 2, 9);   // left workshop rug
        TryAddInteriorFurniture(deck, "(F)1623", 18, 9);  // right workshop rug

        deck.modData[InteriorDecorMarkerKey] = InteriorDecorVersion + "-0677-bridge";
    }

    private void EnsureSkyDockVanillaFurniture(GameLocation dock)
    {
        if (ReferenceEquals(this.SkyDockDecorAppliedLocation, dock)
            && dock.modData.TryGetValue(InteriorDecorMarkerKey, out string? version)
            && string.Equals(version, InteriorDecorVersion + "-0677-dock", StringComparison.Ordinal))
        {
            return;
        }

        this.SkyDockDecorAppliedLocation = dock;
        ClearInteriorDecor(dock);

        // Wall rhythm: three windows break the long station wall into readable zones.
        TryAddInteriorFurniture(dock, "(F)1614", 4, 1);
        TryAddInteriorFurniture(dock, "(F)1614", 14, 1);
        TryAddInteriorFurniture(dock, "(F)1614", 24, 1);
        TryAddInteriorFurniture(dock, "(F)1541", 9, 1);
        TryAddInteriorFurniture(dock, "(F)1541", 20, 1);

        // LEFT: service / Lost & Found corner.
        TryAddInteriorFurniture(dock, "(F)1289", 2, 5);
        TryAddInteriorFurniture(dock, "(F)1443", 2, 8);
        TryAddInteriorFurniture(dock, "(F)1399", 3, 9, heldId: "(F)1369");
        TryAddInteriorFurniture(dock, "(F)1390", 7, 11);
        TryAddInteriorFurniture(dock, "(F)1623", 2, 10);
        TryAddInteriorChest(dock, ResolveSkyDockLostFoundTile(dock));

        // ROUTE DESK: furniture frames the real route tile rather than sitting on top of it.
        TryAddInteriorFurniture(dock, "(F)1120", 6, 5, heldId: "(F)1368");
        TryAddInteriorFurniture(dock, "(F)1443", 9, 5);
        TryAddInteriorFurniture(dock, "(F)704", 10, 5);

        // RIGHT: boarding / luggage side. The actual bay tile remains open and obvious.
        TryAddInteriorFurniture(dock, "(F)1289", 27, 5);
        TryAddInteriorFurniture(dock, "(F)1443", 21, 6);
        TryAddInteriorFurniture(dock, "(F)1443", 26, 6);
        TryAddInteriorFurniture(dock, "(F)1399", 25, 11, heldId: "(F)1369");
        TryAddInteriorFurniture(dock, "(F)1390", 27, 11);
        TryAddInteriorFurniture(dock, "(F)1456", 22, 9);

        // A modest waiting nook, deliberately away from the center arrival/exit corridor.
        TryAddInteriorFurniture(dock, "(F)432", 10, 11, rotation: 0);
        TryAddInteriorFurniture(dock, "(F)1399", 9, 12, heldId: "(F)1362");

        dock.modData[InteriorDecorMarkerKey] = InteriorDecorVersion + "-0677-dock";
    }

    private static void ClearInteriorDecor(GameLocation location)
    {
        foreach (Furniture old in location.furniture
                     .Where(f => f.modData.ContainsKey(InteriorDecorMarkerKey))
                     .ToList())
        {
            location.furniture.Remove(old);
        }

        // Only Cardcha-owned decor objects are removed. Never sweep arbitrary location objects.
        foreach (Vector2 key in location.Objects.Pairs
                     .Where(pair => pair.Value?.modData.ContainsKey(InteriorDecorMarkerKey) == true)
                     .Select(pair => pair.Key)
                     .ToList())
        {
            location.Objects.Remove(key);
        }
    }

    private static void TryAddInteriorFurniture(
        GameLocation location,
        string itemId,
        int x,
        int y,
        int rotation = 0,
        string? heldId = null)
    {
        try
        {
            Furniture item = ItemRegistry.Create<Furniture>(itemId).SetPlacement(x, y, rotation);
            item.modData[InteriorDecorMarkerKey] = InteriorDecorVersion;
            if (heldId is not null)
                item.SetHeldObject(ItemRegistry.Create<Furniture>(heldId));
            location.furniture.Add(item);
        }
        catch
        {
            // A changed vanilla furniture ID must never make either Airship room unloadable.
        }
    }

    private static void TryAddInteriorChest(GameLocation location, Point tile)
    {
        try
        {
            Vector2 key = new(tile.X, tile.Y);
            if (location.Objects.TryGetValue(key, out StardewValley.Object? existing)
                && existing is not null
                && !existing.modData.ContainsKey(InteriorDecorMarkerKey))
            {
                return;
            }

            location.Objects.Remove(key);
            Chest chest = new(true);
            chest.modData[InteriorDecorMarkerKey] = InteriorDecorVersion;
            location.setObject(key, chest);
        }
        catch
        {
            // Lost & Found interaction remains available even if the decorative chest cannot spawn.
        }
    }

'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')

          # The native Furniture/Object pass supersedes the three fake physical post-world calls.
          p=root/'Services/AirshipInteriorStardewRenderer.cs'
          s=p.read_text(encoding='utf-8')
          for call in ['        DrawDeckStardewDecor(batch);\n','        DrawUpgradeStations(batch, save, phase);\n','        DrawDockStardewDecor(batch);\n']:
              if call not in s:
                  raise SystemExit(f'AirshipInteriorStardewRenderer expected legacy call missing: {call.strip()}')
              s=s.replace(call,'',1)
          p.write_text(s,encoding='utf-8')

          # Remove the old full-room custom decor image from both rooms. Keep the vanilla shell,
          # simplify collision to walls/perimeter, then let native Furniture provide the detail.
          def rewrite_room(path: Path, width: int, height: int, doorway_xs: set[int], role: str):
              tree=ET.parse(path); m=tree.getroot()
              props=m.find('properties')
              for prop in props.findall('property'):
                  if prop.attrib.get('name')=='CardchaAirshipVersion':
                      prop.set('value','alpha.28.0.4.14.4.5.12.45.3')
                  elif prop.attrib.get('name')=='CardchaVisualProfile':
                      prop.set('value',role+'|native-stardew-furniture|warm-wood-brass|clear-walking-spine')
                  elif prop.attrib.get('name')=='CardchaArchitecture':
                      prop.set('value','vanilla-shell|native-furniture-and-object|no-postworld-physical-decor|depth-contract-0677')
              layers={x.attrib['name']:x for x in m.findall('layer')}
              zero=[0]*(width*height)
              layers['BackDecor'].find('data').text='\n'+','.join(map(str,zero))+'\n'
              # Preserve top wall mass and perimeter collision, remove old arbitrary interior blockers.
              block_gid=4431 if width==24 else 4635
              b=[]
              for y in range(height):
                  for x in range(width):
                      blocked=False
                      if y in (1,2,3,4): blocked=True
                      if 5 <= y <= height-2 and x in (0,width-1): blocked=True
                      if y==height-1 and x not in doorway_xs: blocked=True
                      b.append(block_gid if blocked else 0)
              layers['Buildings'].find('data').text='\n'+','.join(map(str,b))+'\n'
              layers['Front'].find('data').text='\n'+','.join(map(str,zero))+'\n'
              ET.indent(tree,space=' ')
              tree.write(path,encoding='UTF-8',xml_declaration=True)

          rewrite_room(root/'assets/airship_deck.tmx',24,14,{11,12},'airship-bridge')
          rewrite_room(root/'assets/sky_dock_interior.tmx',30,18,{14,15},'airship-dock-waiting-hall')

          # Handoff: this user-requested visual rebuild takes priority over further feature expansion.
          handoff=Path('handoff/ALPHA28_0677_AIRSHIP_TWO_ROOM_DECOR_REBUILD.md')
          handoff.write_text('''# Cardcha alpha28 — 0677 Airship Two-Room Decor Rebuild\n\n## Source of truth\n- Branch: `cardcha-alpha28-0677-airship-two-room-decor-rebuild`\n- Build: `0.3.0-alpha.28.0.4.14.4.5.12.45.3`\n- Base: 0676B world-depth safety contract.\n\n## User acceptance problem\nThe two Airship rooms looked too empty, generic and test-like to be worth testing. 0677 is a deliberate room-composition rebuild, not a small prop sprinkle.\n\n## Bridge\n- Native Stardew furniture only for physical decor.\n- Clear central walking spine.\n- Navigation/reference wall, engine/hull work side, resonance/reactor side, rugs, lamps, plants, windows and storage.\n- Four upgrade sockets remain gameplay-authoritative and unobstructed by fake post-world machine bodies.\n\n## Dock / waiting hall\n- Service/Lost & Found zone, route desk, boarding/luggage side and waiting nook.\n- Lost & Found is represented by a real Cardcha-owned Chest object at the existing interaction tile.\n- Center arrival/exit corridor and boarding bay remain open.\n\n## Depth contract\n- Old full-room BackDecor image layer is disabled.\n- No solid room prop is restored through RenderedWorld.\n- Physical room detail is Furniture/Object/TMX owned.\n- Existing magical cues may remain VFX-only.\n\n## Frozen\nNo card balance, boss balance, progression, fare, save schema, MiMi art, ChaCha mechanics, Region I/III/IV gameplay changes.\n\n## Acceptance\n1. `cardcha_test_airship`: Bridge should immediately read as a furnished flying workshop/bridge, not an empty rectangle.\n2. Walk through the center and around all four upgrade sockets; no furniture should paint over Farmer incorrectly.\n3. Return to Dock: left service zone, route desk, waiting zone and boarding side must be visually distinct.\n4. Lost & Found chest must be visible at its actual interaction position.\n5. Farmer/NPC depth must remain native around all furniture.\n''',encoding='utf-8')
          Path('handoff/LATEST_CARDCHA_HANDOFF.md').write_text('''# Latest Cardcha Handoff\n\nCurrent branch: `cardcha-alpha28-0677-airship-two-room-decor-rebuild`\nCurrent build: `0.3.0-alpha.28.0.4.14.4.5.12.45.3`\nContinue from: `handoff/ALPHA28_0677_AIRSHIP_TWO_ROOM_DECOR_REBUILD.md`\n\n0677 directly answers user rejection of the two Airship rooms as too superficial/empty. It inherits the 0676B render-depth contract: physical world decor must be TMX/Furniture/Object/native actor owned, never a RenderedWorld fake prop.\n\nDo not resume from stale main or earlier branches.\n''',encoding='utf-8')
          PY

      - name: Validate repository rendering depth contract
        run: python3 tools/validate_render_depth_contract.py

      - name: Validate 0677 room composition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, xml.etree.ElementTree as ET
          root=Path('src/Cardcha'); version='0.3.0-alpha.28.0.4.14.4.5.12.45.3'
          assert json.loads((root/'manifest.json').read_text())['Version']==version
          assert version in (root/'Cardcha.csproj').read_text()
          assert version in (root/'Directory.Build.targets').read_text()
          entry=(root/'ModEntry.cs').read_text(); assert version in entry and 'AIRSHIP TWO-ROOM NATIVE DECOR REBUILD TEST' in entry

          air=(root/'Services/AirshipFoundationService.cs').read_text()
          assert '0677-bridge' in air and '0677-dock' in air
          assert air.count('TryAddInteriorFurniture(deck,') >= 18
          assert air.count('TryAddInteriorFurniture(dock,') >= 19
          assert 'TryAddInteriorChest(dock, ResolveSkyDockLostFoundTile(dock));' in air
          assert 'Chest chest = new(true);' in air
          assert 'location.setObject(key, chest);' in air
          renderer=(root/'Services/AirshipInteriorStardewRenderer.cs').read_text()
          assert 'DrawDeckStardewDecor(batch);' not in renderer
          assert 'DrawDockStardewDecor(batch);' not in renderer
          assert 'DrawUpgradeStations(batch, save, phase);' not in renderer

          for name,w,h,door in [('airship_deck.tmx',24,14,{11,12}),('sky_dock_interior.tmx',30,18,{14,15})]:
              m=ET.parse(root/'assets'/name).getroot(); layers={x.attrib['name']:x for x in m.findall('layer')}
              assert set(layers)>={'Back','BackDecor','Buildings','Front'}
              for lname in ('BackDecor','Front'):
                  vals=[int(x.strip()) for x in (layers[lname].find('data').text or '').split(',') if x.strip()]
                  assert len(vals)==w*h and all(v==0 for v in vals),f'{name}:{lname}'
              b=[int(x.strip()) for x in (layers['Buildings'].find('data').text or '').split(',') if x.strip()]
              assert len(b)==w*h
              # Center floor must be open, with only native Furniture deciding physical collision.
              for y in range(5,h-1):
                  for x in range(1,w-1):
                      assert b[y*w+x]==0,f'{name}: unexpected interior blocker {x},{y}'
              for x in range(w):
                  if x in door: assert b[(h-1)*w+x]==0
                  else: assert b[(h-1)*w+x]!=0
          save=(root/'Services/SaveService.cs').read_text(); assert 'CurrentSchemaVersion = 19' in save
          cards=json.loads((root/'assets/cards.json').read_text()); assert len(cards)==80
          print('0677 native two-room decor validator PASS')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize 0677 source and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.45.3 airship two-room decor [skip ci]'
            git push origin HEAD:cardcha-alpha28-0677-airship-two-room-decor-rebuild
          fi

      - name: Package 0677 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"; rm -rf "$GITHUB_WORKSPACE/package"; mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"; cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"; cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name Cardcha.dll | head -n1); test -n "$DLL" -a -s "$DLL"; cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP='Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.45.3_0677_AirshipTwoRoomDecorRebuild_TEST.zip'
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Upload 0677 TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0677-airship-two-room-decor-rebuild
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.45.3_0677_AirshipTwoRoomDecorRebuild_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.45.3_0677_AirshipTwoRoomDecorRebuild_TEST.zip.sha256
          if-no-files-found: error
