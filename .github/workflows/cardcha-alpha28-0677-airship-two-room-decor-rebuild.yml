name: Cardcha 0677 Airship Two-Room Native Decor Rebuild

on:
  push:
    branches:
      - cardcha-alpha28-0677-airship-two-room-decor-rebuild

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize 0677 source
        run: python3 tools/materialize_0677_airship_decor.py

      - name: Validate repository rendering depth contract
        run: python3 tools/validate_render_depth_contract.py

      - name: Validate 0677 room composition
        run: python3 tools/validate_0677_airship_decor.py

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize 0677 source and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.45.3 airship two-room decor [skip ci]'
            git push origin HEAD:cardcha-alpha28-0677-airship-two-room-decor-rebuild
          fi

      - name: Package 0677 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name Cardcha.dll | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP='Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.45.3_0677_AirshipTwoRoomDecorRebuild_TEST.zip'
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Upload 0677 TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0677-airship-two-room-decor-rebuild
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.45.3_0677_AirshipTwoRoomDecorRebuild_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.45.3_0677_AirshipTwoRoomDecorRebuild_TEST.zip.sha256
          if-no-files-found: error
