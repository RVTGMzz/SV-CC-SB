name: Cardcha 0693 Airship Interior Density Rebuild

on:
  push:
    branches:
      - cardcha-alpha28-0693-airship-interior-density-rebuild
    paths-ignore:
      - 'handoff/**'

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup 0693 asset pipeline
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Materialize native-resolution dense Airship art
        run: python3 tools/alpha28_0693_airship_density_assets.py

      - name: Materialize flat RGBA runtime density textures
        run: python3 tools/alpha28_0693_airship_density_flatten.py

      - name: Integrate 0693 Airship interior density rebuild
        run: python3 tools/alpha28_0693_airship_interior_density_rebuild.py

      - name: Patch 0693 TMX to flat RGBA runtime paths
        run: python3 tools/alpha28_0693_airship_density_tmx_flat_patch.py

      - name: Clear protected Airship gameplay anchors
        run: python3 tools/alpha28_0693_airship_anchor_clear.py

      - name: Validate repository rendering depth contract
        run: python3 tools/validate_render_depth_contract.py

      - name: Validate 0693 Airship density contracts
        run: python3 tools/validate_0693_airship_interior_density_rebuild_v2.py

      - name: Freeze 0692 gate/runtime and inherited Boss/Region content
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cardcha-alpha28-0692-airship-rgba-gate-restore:refs/remotes/origin/cardcha-alpha28-0692-airship-rgba-gate-restore
          git diff --exit-code origin/cardcha-alpha28-0692-airship-rgba-gate-restore -- \
            src/Cardcha/Patches/AirshipGateDepthPatch.cs \
            src/Cardcha/Patches/AirshipGatePatchUsings.cs \
            src/Cardcha/Patches/AirshipGateRelocationPatch.cs \
            src/Cardcha/Patches/AirshipVisualDepthPatch.cs \
            src/Cardcha/Services/AirshipInteriorStardewRenderer.cs \
            src/Cardcha/assets/airship_gate_auth.png \
            src/Cardcha/assets/boss2_hollow_curator_arena.tmx \
            src/Cardcha/assets/boss3_tricolor_resonance_arena.tmx \
            src/Cardcha/assets/boss4_mimi_resonance_arena.tmx \
            src/Cardcha/assets/bosses \
            src/Cardcha/assets/region1_hunting.tmx \
            src/Cardcha/assets/region1_rooms \
            src/Cardcha/assets/region2_forgotten_archive.tmx \
            src/Cardcha/assets/region2_mirror_gallery.tmx \
            src/Cardcha/assets/region2_inkbound_stacks.tmx \
            src/Cardcha/assets/region2_warden_vault.tmx \
            src/Cardcha/assets/region3_mirrorwild.tmx \
            src/Cardcha/assets/region4_resonance_verge.tmx

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize 0693 source and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff render_depth_audit.json \
            tools/alpha28_0693_airship_density_assets.py \
            tools/alpha28_0693_airship_density_flatten.py \
            tools/alpha28_0693_airship_interior_density_rebuild.py \
            tools/alpha28_0693_airship_density_tmx_flat_patch.py \
            tools/alpha28_0693_airship_anchor_clear.py \
            tools/validate_0693_airship_interior_density_rebuild_v2.py
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.60 Airship interior density rebuild [skip ci]'
            git push origin HEAD:cardcha-alpha28-0693-airship-interior-density-rebuild
          fi

      - name: Package 0693 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name Cardcha.dll | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP='Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.60_0693_AirshipInterior_DensityRebuild_TEST.zip'
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 - <<'PY'
          from pathlib import Path
          import json,struct,zipfile,xml.etree.ElementTree as ET
          p=Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.60_0693_AirshipInterior_DensityRebuild_TEST.zip')
          def png_info(raw):
              assert raw[:8]==b'\x89PNG\r\n\x1a\n' and raw[12:16]==b'IHDR'
              return struct.unpack('>II',raw[16:24]),raw[25]
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              m=json.loads(z.read('Cardcha/manifest.json'))
              assert m['Version']=='0.3.0-alpha.28.0.4.14.4.5.12.60'
              dll=z.read('Cardcha/Cardcha.dll')
              assert dll[:2]==b'MZ' and len(dll)>50000
              for q,size in [
                  ('Cardcha/assets/airship_0693_sky_dock_density.png',(480,288)),
                  ('Cardcha/assets/airship_0693_deck_density.png',(384,224)),
              ]:
                  assert q in names,q
                  wh,ct=png_info(z.read(q)); assert wh==size,(q,wh); assert ct==6,(q,ct)
              for q,wh,tsname,source in [
                  ('Cardcha/assets/sky_dock_interior.tmx',(30,18),'CardchaSkyDockDensity0693','airship_0693_sky_dock_density.png'),
                  ('Cardcha/assets/airship_deck.tmx',(24,14),'CardchaAirshipDeckDensity0693','airship_0693_deck_density.png'),
              ]:
                  r=ET.fromstring(z.read(q)); assert (int(r.attrib['width']),int(r.attrib['height']))==wh
                  ts=next(x for x in r.findall('tileset') if x.attrib.get('name')==tsname)
                  assert ts.find('image').attrib['source']==source
                  props={x.attrib.get('name'):x.attrib.get('value') for ps in r.findall('properties') for x in ps.findall('property')}
                  assert props.get('CardchaTextureContract')=='0693|flat-rgba-density-and-hero-tmx-textures|png-color-type-6'
                  for custom in r.findall('tileset'):
                      if int(custom.attrib.get('firstgid','0')) < 5000: continue
                      image=custom.find('image'); assert image is not None
                      src=image.attrib['source']; assert '/' not in src and '\\' not in src,(q,src)
                      tex='Cardcha/assets/'+src; assert tex in names,tex
                      _,ct=png_info(z.read(tex)); assert ct==6,(tex,ct)
                  for layer in r.findall('layer'):
                      data=layer.find('data')
                      if data is None or data.attrib.get('encoding')!='csv': continue
                      toks=[x.strip() for x in (data.text or '').split(',')]
                      assert toks and all(toks) and len(toks)==wh[0]*wh[1]
          print('0693 package audit PASS:',p)
          PY

      - name: Upload 0693 TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0693-airship-interior-density-rebuild
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.60_0693_AirshipInterior_DensityRebuild_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.60_0693_AirshipInterior_DensityRebuild_TEST.zip.sha256
          if-no-files-found: error
