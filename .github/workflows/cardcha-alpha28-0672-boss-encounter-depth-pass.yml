name: Cardcha alpha28.0.4.14.4.5.12.41 Boss Encounter Depth Pass

on:
  push:
    branches: [ cardcha-alpha28-0672-boss-encounter-depth-pass ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 0672 encounter depth pass
        run: python3 tools/alpha28_0672_boss_encounter_depth_pass.py

      - name: Validate 0672 boss contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess, xml.etree.ElementTree as ET

          root = Path('src/Cardcha')
          version = '0.3.0-alpha.28.0.4.14.4.5.12.41'
          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['Version'] == version
          assert version in (root/'Cardcha.csproj').read_text(encoding='utf-8')
          assert version in (root/'Directory.Build.targets').read_text(encoding='utf-8')

          boss = (root/'Services/MilestoneBossService.cs').read_text(encoding='utf-8')
          required = [
              '0672 encounter-depth pass',
              'HollowCuratorMaxHealth = 2200',
              'TricolorGuardianMaxHealth = 780',
              'TricolorUnifiedMaxHealth = 1650',
              'MimiMaxHealth = 3600',
              'private Point EchoTargetTile;',
              'private int MimiCadenceIndex;',
              'private void RepositionTricolorGuardian(string role)',
              'new[] { 0, 1, 2, 4, 4 }',
              'this.CurrentAttack = role == "ignis" ? 10 : role == "vita" ? 11 : 12',
              '0 => 13',
              '1 => 14',
              '_ => 15',
              '2 => new[] { 20, 22, 26, 26 }',
              '3 => new[] { 22, 23, 27, 27 }',
              'new[] { 24, 25, 26, 27, 28, 28 }',
              'case 26:',
              'case 27:',
              'case 28:',
              'BossCardsUnlocked.Add(reward)',
              'AirshipHighestRegionUnlocked = Math.Max',
          ]
          for token in required:
              assert token in boss, token

          chacha = (root/'Services/ChaChaBossFormService.cs').read_text(encoding='utf-8')
          for token in [
              'BossFormDurationMs = 10000',
              'MirrorPulseDamage = 12',
              'TrinityPulseDamage = 13',
              'ResonancePulseDamage = 16',
              'private int CurrentPulseDamage()',
              'private int CurrentPulseIntervalMs()',
              'private float CurrentPulseRadius()',
              'MirrorRabbitFormId => 1900',
              'TrinityRabbitFormId => 1800',
              'ResonanceRabbitFormId => 1700',
              'bonusDamage = 6',
              'heal = 5',
              'bonusDamage = 5',
              'heal = 3',
          ]:
              assert token in chacha, token

          entry = (root/'ModEntry.cs').read_text(encoding='utf-8')
          assert 'BOSS ENCOUNTER DEPTH PASS TEST' in entry
          for cmd in ['cardcha_test_boss2','cardcha_test_boss3','cardcha_test_boss4','cardcha_boss_milestone_status','cardcha_chacha_boss_status']:
              assert cmd in entry, cmd

          save = (root/'Services/SaveService.cs').read_text(encoding='utf-8')
          assert 'CurrentSchemaVersion = 19' in save
          assert 'CurrentSchemaVersion = 20' not in save

          for asset in [
              'assets/bosses/milestone/hollow_curator.png',
              'assets/bosses/milestone/tricolor_guardians.png',
              'assets/bosses/milestone/tricolor_unified.png',
              'assets/bosses/milestone/mimi_resonance_master.png',
              'assets/chacha_mirror_rabbit.png',
              'assets/chacha_trinity_rabbit.png',
              'assets/chacha_resonance_rabbit.png',
              'assets/boss2_hollow_curator_arena.tmx',
              'assets/boss3_tricolor_resonance_arena.tmx',
              'assets/boss4_mimi_resonance_arena.tmx',
          ]:
              p = root/asset
              assert p.exists() and p.stat().st_size > 100, asset

          mimi = root/'assets/mimi_walk.png'
          assert mimi.exists() and mimi.stat().st_size == 65167
          diff = subprocess.run(['git','diff','--quiet','origin/cardcha-alpha28-0671-authored-boss-visuals-arenas','--','src/Cardcha/assets/mimi_walk.png'])
          assert diff.returncode == 0, 'mimi_walk.png changed'

          cards = json.loads((root/'assets/cards.json').read_text(encoding='utf-8'))
          legacy = {'endless_hunt','fate_weaver','immortal_echo','worldbreaker'}
          assert len(cards) == 80
          assert len([c for c in cards if c.get('Id') not in legacy]) == 76

          checked = 0
          for tmx in sorted((root/'assets').rglob('*.tmx')):
              map_root = ET.parse(tmx).getroot()
              for layer in map_root.findall('layer'):
                  data = layer.find('data')
                  if data is None or data.attrib.get('encoding') != 'csv':
                      continue
                  vals=[]
                  for i, token in enumerate((data.text or '').split(',')):
                      st=token.strip()
                      assert st != '', f'{tmx}: empty CSV token {i}'
                      vals.append(int(st))
                  assert len(vals) == int(layer.attrib['width']) * int(layer.attrib['height']), tmx
                  checked += 1
          assert checked >= 24, checked
          print(f'0672 validator PASS; encounterDepth=ON schema=19 cards=76/80 strictTMX={checked}')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.41 source handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.41 boss encounter depth pass [skip ci]'
            git push origin HEAD:cardcha-alpha28-0672-boss-encounter-depth-pass
          fi

      - name: Package .5.12.41 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.41_BossEncounterDepthPass_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile
          z=Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.41_BossEncounterDepthPass_TEST.zip')
          with zipfile.ZipFile(z) as f:
              assert json.loads(f.read('Cardcha/manifest.json'))['Version'] == '0.3.0-alpha.28.0.4.14.4.5.12.41'
              assert len(f.read('Cardcha/Cardcha.dll')) > 100000
              assert len(f.read('Cardcha/assets/mimi_walk.png')) == 65167
              for n in [
                  'Cardcha/assets/bosses/milestone/hollow_curator.png',
                  'Cardcha/assets/bosses/milestone/tricolor_guardians.png',
                  'Cardcha/assets/bosses/milestone/mimi_resonance_master.png',
                  'Cardcha/assets/chacha_mirror_rabbit.png',
                  'Cardcha/assets/chacha_trinity_rabbit.png',
                  'Cardcha/assets/chacha_resonance_rabbit.png',
              ]:
                  assert len(f.read(n)) > 100
          print('0672 final package audit PASS')
          PY

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0672-boss-encounter-depth-pass
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.41_BossEncounterDepthPass_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.41_BossEncounterDepthPass_TEST.zip.sha256
          if-no-files-found: error
