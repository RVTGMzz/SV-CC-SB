name: Cardcha alpha28.0.4.14.4.5.3 Gate Relocation + Energy Pace

on:
  push:
    branches: [ cardcha-alpha28-0634-gate-relocation-energy-pace ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate milestone contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('src/Cardcha')
          version = '0.3.0-alpha.28.0.4.14.4.5.3'
          assert json.loads((root/'manifest.json').read_text())['Version'] == version
          assert f'<Version>{version}</Version>' in (root/'Cardcha.csproj').read_text()
          assert f'<Version>{version}</Version>' in (root/'Directory.Build.targets').read_text()

          gate = (root/'Patches/AirshipGateRelocationPatch.cs').read_text()
          assert 'LegacyWideGateUseDistance = 320f' in gate
          assert 'RelocatedGateUseDistance = 160f' in gate
          assert 'BuildAlternateZones' in gate and 'BuildSectorSweep' in gate
          assert 'GetLayer("Buildings")' in gate and 'GetLayer("Front")' in gate
          assert 'instead of widening its interaction radius' in gate

          energy = (root/'Services/BossEnergyService.cs').read_text()
          assert 'EnergyGainScale = 1d / 3d' in energy
          assert 'amount *= EnergyGainScale;' in energy
          assert 'baseGain *= EnergyGainScale;' in energy
          assert 'victoryBonus *= EnergyGainScale;' in energy
          assert 'MaxEnergy = 100d' in energy

          audit=json.loads((root/'assets/card_auto_audit.json').read_text())
          assert len(audit)==76 and all(r['status']=='PASS' for r in audit)
          assert 'BossFormDurationMs = 10000' in (root/'Services/ChaChaBossFormService.cs').read_text()
          assert 'CurrentSchemaVersion = 19' in (root/'Services/SaveService.cs').read_text()

          expected = {
              'airship_visual.png': '1821ee869759a924f7ff2b6821aaeb64b80a000d84c46f207a578d3a1e771132',
              'items.png': '95029fb703777305b097136f6b12c0eae6f021fde6070f03424943463ea3e3e4',
              'chacha_skill_materials.png': '76261133b2df191f516af74f4e866bddcf171c1a0739e269579994a40b15dfc7',
              'chacha_skill_icons.png': 'd36f5cef2d409a1b3b1c123bb02957131393473cc7e4a4ea1b326514a6cab036',
          }
          for name, sha in expected.items():
              raw=(root/'assets'/name).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==sha, name

          print('Gate relocation + Boss Energy pace acceptance PASS')
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Package test build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha
          cp "$(find src/Cardcha/bin -name Cardcha.dll -print -quit)" stage/Cardcha/
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/
          test -s stage/Cardcha/Cardcha.dll
          test "$(python3 -c "import json; print(json.load(open('stage/Cardcha/manifest.json'))['Version'])")" = "0.3.0-alpha.28.0.4.14.4.5.3"
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.3_GateRelocation_EnergyPace_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0634-gate-relocation-energy-pace
          path: artifact
          if-no-files-found: error
