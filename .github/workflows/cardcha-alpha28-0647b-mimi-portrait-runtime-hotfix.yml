name: Cardcha alpha28.0.4.14.4.5.12.2 MiMi Portrait Runtime Hotfix

on:
  push:
    branches: [ cardcha-alpha28-0647b-mimi-portrait-runtime-hotfix ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate .5.12.2 runtime hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/alpha28_0647b_mimi_portrait_runtime_hotfix.py

      - name: Validate source ownership and locked contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('src/Cardcha'); assets=root/'assets'
          version='0.3.0-alpha.28.0.4.14.4.5.12.2'
          forbidden=('mimi_portraits_runtime64.png','mimi_npc_portraits.png')

          assert json.loads((root/'manifest.json').read_text())['Version']==version
          assert version in (root/'Cardcha.csproj').read_text()
          assert version in (root/'Directory.Build.targets').read_text()
          assert (assets/'mimi_portraits.png').is_file()
          for token in forbidden:
              assert not (assets/token).exists(), token
              for p in root.rglob('*.cs'):
                  assert token not in p.read_text(), f'{token} survives in {p}'

          world=(root/'Services/WorldActorService.cs').read_text()
          mystery=(root/'Services/MimiMysteryTownService.cs').read_text()
          story=(root/'Services/CardchaStoryService.cs').read_text()
          home=(root/'Services/MimiHomeService.cs').read_text()

          # One logical Portrait asset, one loader owner. WorldActor may request it, but must
          # never register a competing LoadFromModFile handler again.
          assert 'private const string MimiPortraitAsset = "Portraits/Ronvotri.Cardcha_MiMi";' in world
          assert 'Game1.content.Load<Texture2D>(MimiPortraitAsset)' in world
          assert 'e.Name.IsEquivalentTo(MimiPortraitAsset)' not in world
          assert 'MimiPortraitSheetPath' not in world
          assert 'e.Name.IsEquivalentTo(PortraitAsset)' in mystery
          assert 'e.LoadFrom(() => this.GetNativePortraitCompatibilitySheet()' in mystery
          assert 'private Texture2D GetNativePortraitCompatibilitySheet()' in mystery

          # Both story/world dialogue compatibility sheets are derived from the same master,
          # with nearest-neighbour sampling and no averaging blur.
          for name,text in [('mystery',mystery),('story',story)]:
              assert 'assets/mimi_portraits.png' in text, name
              assert 'private static Texture2D CreateRuntimePortraitSheet(Texture2D master)' in text, name
              assert 'sumRA' not in text and 'sumGA' not in text and 'sumBA' not in text, name
              assert 'ty * sourceFrameHeight / targetSize' in text, name
              assert 'tx * sourceFrameWidth / targetSize' in text, name

          # Preserve 0647A living movement diagnostics.
          for token in [
              'DefaultHomeTile = new(10, 6)',
              'SecretTvWatchTile = new(5, 9)',
              'if (!IsTileClear(attic, anchor))',
              'return FindClearTileNear(attic, pool[0]);',
              'RoutineState=',
              'WanderTarget='
          ]:
              assert token in home, token

          # Preserve 0647 Airship room architecture.
          air=(root/'Services/AirshipFoundationService.cs').read_text()
          assert 'InteriorDecorVersion = "alpha.28.0.4.14.4.5.12"' in air
          assert 'IsPortalZone(playerTile, bay, radiusX: 1, radiusY: 1)' in air
          assert 'IsBottomDoorwayZone(location, playerTile)' in air
          assert 'BoardingUseDistance = 160f' in air

          # Locked gameplay/canon.
          save=(root/'Models/SaveData.cs').read_text(); assert 'SchemaVersion { get; set; } = 19' in save
          assert hashlib.sha256((assets/'airship_visual.png').read_bytes()).hexdigest()=='1821ee869759a924f7ff2b6821aaeb64b80a000d84c46f207a578d3a1e771132'
          assert 'BossFormDurationMs = 10000' in (root/'Services/ChaChaBossFormService.cs').read_text()
          assert 'EnergyGainScale = 1d / 3d' in (root/'Services/BossEnergyService.cs').read_text()
          audit=json.loads((assets/'card_auto_audit.json').read_text()); assert len(audit)==76 and all(x['status']=='PASS' for x in audit)
          gate=(root/'Patches/AirshipGateRelocationPatch.cs').read_text()
          assert 'CanonicalGateUseDistance = 160f' in gate and 'CollisionEdits=NONE' in gate
          print('0647B source validation PASS')
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Audit compiled DLL portrait paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          dll=next(Path('src/Cardcha/bin/Release').rglob('Cardcha.dll'))
          data=dll.read_bytes()
          forbidden=('assets/mimi_portraits_runtime64.png','assets/mimi_npc_portraits.png')
          for token in forbidden:
              assert token.encode('utf-8') not in data, f'forbidden UTF-8 DLL reference: {token}'
              assert token.encode('utf-16le') not in data, f'forbidden UTF-16 DLL reference: {token}'
          canonical='assets/mimi_portraits.png'
          assert canonical.encode('utf-16le') in data or canonical.encode('utf-8') in data, 'canonical portrait path missing from DLL'
          print(f'COMPILED DLL PORTRAIT AUDIT PASS: {dll}')
          PY

      - name: Materialize .5.12.2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized diff.'
          else
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.2 MiMi portrait runtime hotfix [skip ci]'
            git push origin HEAD:cardcha-alpha28-0647b-mimi-portrait-runtime-hotfix
          fi

      - name: Package .5.12.2 test build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha
          dll="$(find src/Cardcha/bin/Release -name Cardcha.dll -print -quit)"
          test -n "$dll" && test -s "$dll"
          cp "$dll" stage/Cardcha/Cardcha.dll
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/
          test -f stage/Cardcha/assets/mimi_portraits.png
          test ! -e stage/Cardcha/assets/mimi_portraits_runtime64.png
          test ! -e stage/Cardcha/assets/mimi_npc_portraits.png
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.2_MiMiPortraitRuntimeHotfix_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0647b-mimi-portrait-runtime-hotfix
          path: artifact
          if-no-files-found: error
