name: Cardcha alpha28.0.4.14.4.5.12.33 Region I Hunt Run 2.0 Foundation

on:
  push:
    branches: [ cardcha-alpha28-0666-region1-huntrun2-foundation ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 0666 Hunt Run 2.0
        run: python3 tools/alpha28_0666_region1_huntrun2_foundation.py

      - name: Validate 0666 acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET

          root = Path('src/Cardcha')
          version = '0.3.0-alpha.28.0.4.14.4.5.12.33'
          assert json.loads((root/'manifest.json').read_text())['Version'] == version
          assert version in (root/'Cardcha.csproj').read_text()
          assert version in (root/'Directory.Build.targets').read_text()

          air = (root/'Services/AirshipFoundationService.cs').read_text()
          required = [
              'private const int Region1RunMinNodes = 7;',
              'private const int Region1RunMaxNodes = 10;',
              'private const int Region1CheckpointNodeA = 3;',
              'private const int Region1CheckpointNodeB = 6;',
              'private const int Region1BossBranchMinNode = 7;',
              'enum Region1RunEncounterType',
              'Combat,', 'Ambush,', 'Elite,', 'RootNest,', 'Shrine',
              'enum Region1RunRouteKind', 'Moss,', 'Briar,', 'Ancient',
              'random.Next(Region1RunMinNodes, Region1RunMaxNodes + 1)',
              'PrepareRegion1RunRouteChoices',
              'PrepareRegion1RunBoonChoices',
              'ChooseRegion1RunBoon',
              'BankRegion1RunRewards',
              'DescribeHuntRun2',
              'DebugClearHuntRunNode',
              'Region1RunUnbankedScrap',
              'Region1RunUnbankedShiny',
              'Region1EliteMarkerKey',
              'Region1RootNestMarkerKey',
              'ResolveRegion1RunBoonTiles',
              'ResolveRegion1RunChoiceTiles',
              'ResolveRegion1RunBossTile',
              'DrawRegion1HuntRun2Overlay',
              'nodeNumber == 2 || nodeNumber == 5 || nodeNumber == 8',
              'nodeNumber == Region1CheckpointNodeA || nodeNumber == Region1CheckpointNodeB',
          ]
          for token in required:
              assert token in air, token
          assert 'private const int Region1RunRoomCount = 4;' not in air
          assert 'Array.IndexOf(this.Region1RunRoute' not in air

          # Run boons are temporary runtime state, not new save schema fields.
          save = (root/'Models/SaveData.cs').read_text()
          assert 'SchemaVersion { get; set; } = 19;' in save
          assert 'Region1RunBoons' not in save

          # Monster -> Scrap -> Gacha canon is preserved. No finished-card grant in Airship service.
          assert '.OwnedCards.Add(' not in air
          assert 'CardboardScraps +=' in air
          assert 'ShinyScraps +=' in air

          # Existing six handcrafted rooms remain the visual pool.
          assert air.count('"Cardcha_R1_') >= 6
          for i in range(1, 7):
              assert (root/f'assets/region1_rooms').exists()
          cards = json.loads((root/'assets/cards.json').read_text())
          legacy = {'endless_hunt', 'fate_weaver', 'immortal_echo', 'worldbreaker'}
          assert len(cards) == 80
          assert len([c for c in cards if c.get('Id') not in legacy]) == 76

          # Boss I / boss-card / form locked contracts from 0660-0665.
          boss = (root/'Services/VerdantGuardianBossService.cs').read_text()
          assert 'private const int BossMaxHealth = 1600;' in boss
          assert 'HeavyRecoilCapPixels = 18f' in boss
          boss_card = (root/'Services/BossCardService.cs').read_text()
          assert 'public const double VerdantDamageReduction = 0.30d;' in boss_card
          assert 'public const int VerdantCooldownMs = 28000;' in boss_card
          form = (root/'Services/ChaChaBossFormService.cs').read_text()
          assert 'public const int BossFormDurationMs = 10000;' in form
          assert 'public const int GuardianRootPulseDamage = 14;' in form
          energy = (root/'Services/BossEnergyService.cs').read_text()
          assert 'public const double EnergyGainScale = 1d / 3d;' in energy

          # MiMi and stair accepted/preserved branch work stays in place.
          home = (root/'Services/MimiHomeService.cs').read_text()
          assert 'ResolvePreferredWizardStairTile' in home
          assert 'bool rightIsBoundary' in home
          profile = (root/'Patches/MimiProfileMenuPatch.cs').read_text()
          assert 'DrawScale=vanilla-4x' in profile

          mod = (root/'ModEntry.cs').read_text()
          for token in [
              'cardcha_huntrun_status',
              'cardcha_huntrun_clear',
              '0.3.0-alpha.28.0.4.14.4.5.12.33 REGION I HUNT RUN 2.0 FOUNDATION TEST',
          ]:
              assert token in mod, token

          for lang in ['default.json','vi.json']:
              data = json.loads((root/'i18n'/lang).read_text())
              for key in [
                  'airship.region1.run.enter2',
                  'airship.region1.run.encounter.combat',
                  'airship.region1.run.encounter.ambush',
                  'airship.region1.run.encounter.elite',
                  'airship.region1.run.encounter.rootnest',
                  'airship.region1.run.encounter.shrine',
                  'airship.region1.run.route.moss',
                  'airship.region1.run.route.briar',
                  'airship.region1.run.route.ancient',
                  'airship.region1.run.route.boss',
                  'airship.region1.run.boon.verdant_recovery.name',
                  'airship.region1.run.boon.scrap_compass.name',
                  'airship.region1.run.boon.deep_roots.name',
                  'airship.region1.run.boon.fortune_bud.name',
                  'airship.region1.run.boon.hunters_edge.name',
                  'airship.region1.run.boon.moss_ward.name',
              ]:
                  assert key in data, (lang,key)

          # Strict TMX CSV runtime contract survives all existing maps.
          checked = 0
          for tmx in sorted((root/'assets').rglob('*.tmx')):
              map_root = ET.parse(tmx).getroot()
              for layer in map_root.findall('layer'):
                  data = layer.find('data')
                  if data is None or data.attrib.get('encoding') != 'csv':
                      continue
                  tokens = (data.text or '').split(',')
                  vals = []
                  for i, token in enumerate(tokens):
                      text = token.strip()
                      assert text != '', f'{tmx}: empty CSV token layer={layer.attrib.get("name")} index={i}'
                      value = int(text)
                      assert 0 <= value <= 0xFFFFFFFF
                      vals.append(value)
                  assert len(vals) == int(layer.attrib['width']) * int(layer.attrib['height'])
                  checked += 1
          assert checked >= 21
          print(f'0666 validator PASS; nodes=7-10 routes=3 encounters=5 boons=6 checkpoints=3,6 strictTMXLayers={checked}')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.33 source + handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.33 Region I Hunt Run 2.0 [skip ci]'
            git push origin HEAD:cardcha-alpha28-0666-region1-huntrun2-foundation
          fi

      - name: Package .5.12.33 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.33_Region1HuntRun2_FOUNDATION_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"

          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile, xml.etree.ElementTree as ET
          z = Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.33_Region1HuntRun2_FOUNDATION_TEST.zip')
          with zipfile.ZipFile(z) as f:
              assert json.loads(f.read('Cardcha/manifest.json'))['Version'] == '0.3.0-alpha.28.0.4.14.4.5.12.33'
              assert len(f.read('Cardcha/Cardcha.dll')) > 100000
              vi = json.loads(f.read('Cardcha/i18n/vi.json'))
              assert vi['airship.region1.run.route.briar'] == 'LỐI GAI'
              assert vi['airship.region1.run.encounter.shrine'] == 'ĐIỆN THỜ CỔ'
              room_maps = [n for n in f.namelist() if 'region1_rooms/' in n and n.endswith('.tmx')]
              assert len(room_maps) == 6
              for name in [n for n in f.namelist() if n.endswith('.tmx')]:
                  map_root = ET.fromstring(f.read(name))
                  for layer in map_root.findall('layer'):
                      data = layer.find('data')
                      if data is None or data.attrib.get('encoding') != 'csv':
                          continue
                      tokens = (data.text or '').split(',')
                      vals = [int(t.strip()) for t in tokens if t.strip()]
                      assert len(vals) == len(tokens), f'{name}: packaged empty CSV token'
                      assert len(vals) == int(layer.attrib['width']) * int(layer.attrib['height'])
          print('Final .5.12.33 package audit PASS')
          PY

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0666-region1-huntrun2-foundation
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.33_Region1HuntRun2_FOUNDATION_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.33_Region1HuntRun2_FOUNDATION_TEST.zip.sha256
          if-no-files-found: error
