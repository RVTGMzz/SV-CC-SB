name: Cardcha alpha28.0.4.14.4.5.12.38 Visual Auth Pass

on:
  push:
    branches: [ cardcha-alpha28-0669-visual-auth-pass ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 0669 visual auth pass
        run: python3 tools/alpha28_0669_visual_auth_pass.py

      - name: Validate 0669 acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, struct, xml.etree.ElementTree as ET

          root=Path('src/Cardcha')
          version='0.3.0-alpha.28.0.4.14.4.5.12.38'
          assert json.loads((root/'manifest.json').read_text())['Version']==version
          assert version in (root/'Cardcha.csproj').read_text()
          assert version in (root/'Directory.Build.targets').read_text()
          assert version in (root/'ModEntry.cs').read_text()

          def png_size(path):
              b=Path(path).read_bytes()
              assert b[:8]==b'\x89PNG\r\n\x1a\n', path
              return struct.unpack('>II', b[16:24])

          assert png_size(root/'assets/bosses/verdant_guardian/arena/verdant_seed_totem.png')==(128,48)
          assert png_size(root/'assets/region1_environment_decor.png')==(256,32)
          assert png_size(root/'assets/airship_gate_auth.png')==(128,128)

          patch=(root/'Patches/VerdantGuardianProxyDrawPatch.cs').read_text()
          assert 'BossAddMarkerKey' in patch
          assert 'TotemMarkerKey' in patch

          boss=(root/'Services/VerdantGuardianBossService.cs').read_text()
          for token in [
              'TotemMaxHealth = 90',
              'TotemStaggerDurationMs = 1200',
              'ReassertBossActorAuth()',
              'add.isInvisible.Value = false;',
              'proxy.isInvisible.Value = false;',
              'custom summon silhouettes. Custom art hides the proxy draw, never the actor.',
              'this.GetLivingTotemCount() switch { >= 4 => 15, 3 => 10, 2 => 6, 1 => 3, _ => 0 }',
              'ms * 0.92d',
          ]: assert token in boss, token

          spawn=boss.split('private void SpawnAdds()',1)[1].split('private void ReassertBossActorAuth()',1)[0]
          assert 'new Bug(pos, 0)' not in spawn
          assert spawn.count('new GreenSlime(pos, 0)') >= 2

          arena=(root/'Services/VerdantGuardianArenaPolishService.cs').read_text()
          draw=arena.split('private void DrawObelisks',1)[1].split('private void DrawTotemStaggerBurst',1)[0]
          assert 'totem.Position + new Vector2(32f, 64f)' in draw
          assert 'barW' not in draw
          assert 'Objective halo, not a monster HP bar' in draw
          assert 'brokenSrc = new(96, 0, 32, 48)' in draw

          summons=(root/'Services/VerdantGuardianSummonVisualService.cs').read_text()
          for token in [
              'float scale = wisp ? 2.05f : 2.20f;',
              'Summons are real killable enemies',
              'EngineActorsVisible=YES',
              'Killable=YES',
          ]: assert token in summons, token

          airship=(root/'Services/AirshipFoundationService.cs').read_text()
          for token in [
              'AirshipGateVisualPath = "assets/airship_gate_auth.png"',
              'GetAirshipGateVisual()',
              'one compact authored boarding object',
              'Region1LostCacheMarkerKey',
              'TryHandleRegion1LostCacheInteraction',
              'Chest cache = new(true);',
          ]: assert token in airship, token
          gate=airship.split('private void DrawSkyDock(SpriteBatch batch, Point tile)',1)[1].split('private void DrawSkyDockInteriorDetails',1)[0]
          assert 'DrawEllipticArc' not in gate
          assert 'DrawCrystalPylon' not in gate

          interior=(root/'Services/AirshipInteriorStardewRenderer.cs').read_text()
          assert '0669 foundation: grouped by purpose' in interior
          assert 'DrawPixelRing(batch, bay, 20' not in interior

          region=(root/'Services/Region1StardewDecorRenderer.cs').read_text()
          assert 'CellCount = 8' in region
          assert 'roomIndex switch' in region
          assert 'room-specific organic edge clusters' in region

          core=(root/'Services/CoreCardEffectsService.cs').read_text()
          for token in [
              'Add("adrenaline", this.AdrenalineUntil, 3000, 90);',
              'Add("momentum", this.MomentumUntil, 2000, 70);',
              'Add("battle_trance", this.BattleTranceUntil, 2000, 74);',
          ]: assert token in core, token
          hud=(root/'UI/CombatHudRenderer.cs').read_text()
          assert 'ShowPersistentReadyIndicators = false' in hud
          assert 'foreach (TimedCardHudState timed in this.Combat.CurrentTimedCardHudStates)' in hud

          vi=json.loads((root/'i18n'/'vi.json').read_text())
          en=json.loads((root/'i18n'/'default.json').read_text())
          for table in (vi,en):
              assert 'boss.verdant.totem.hud' in table
              assert 'airship.region1.run.rare.lostcache.opened' in table

          cards=json.loads((root/'assets/cards.json').read_text())
          legacy={'endless_hunt','fate_weaver','immortal_echo','worldbreaker'}
          assert len(cards)==80 and len([c for c in cards if c.get('Id') not in legacy])==76

          checked=0
          for tmx in sorted((root/'assets').rglob('*.tmx')):
              map_root=ET.parse(tmx).getroot()
              for layer in map_root.findall('layer'):
                  data=layer.find('data')
                  if data is None or data.attrib.get('encoding')!='csv': continue
                  vals=[]
                  for i, token in enumerate((data.text or '').split(',')):
                      st=token.strip(); assert st!='', f'{tmx}: empty CSV token {i}'
                      n=int(st); assert 0<=n<=0xFFFFFFFF; vals.append(n)
                  assert len(vals)==int(layer.attrib['width'])*int(layer.attrib['height'])
                  checked+=1
          assert checked>=21

          handoff=Path('handoff/ALPHA28_0669_VISUAL_AUTH_PASS.md').read_text()
          latest=Path('handoff/LATEST_CARDCHA_HANDOFF.md').read_text()
          assert version in handoff and version in latest
          assert 'cardcha-alpha28-0669-visual-auth-pass' in latest
          print(f'0669 validator PASS; actorAuth=YES gate=AUTHORED regionAtlas=8 strictTMX={checked}')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.38 source + assets + handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.38 visual auth pass [skip ci]'
            git push origin HEAD:cardcha-alpha28-0669-visual-auth-pass
          fi

      - name: Package .5.12.38 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.38_VisualAuthPass_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile
          z=Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.38_VisualAuthPass_TEST.zip')
          with zipfile.ZipFile(z) as f:
              assert json.loads(f.read('Cardcha/manifest.json'))['Version']=='0.3.0-alpha.28.0.4.14.4.5.12.38'
              assert len(f.read('Cardcha/Cardcha.dll'))>100000
              for name in [
                  'Cardcha/assets/airship_gate_auth.png',
                  'Cardcha/assets/region1_environment_decor.png',
                  'Cardcha/assets/bosses/verdant_guardian/arena/verdant_seed_totem.png',
              ]:
                  assert len(f.read(name))>500, name
          print('0669 final package audit PASS')
          PY

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0669-visual-auth-pass
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.38_VisualAuthPass_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.38_VisualAuthPass_TEST.zip.sha256
          if-no-files-found: error
