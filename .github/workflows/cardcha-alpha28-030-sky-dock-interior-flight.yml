name: Cardcha alpha28.0.3.0 Sky Dock interior + flight

on:
  push:
    branches: [ cardcha-alpha28-airship-foundation ]
    paths:
      - '.github/workflows/cardcha-alpha28-030-sky-dock-interior-flight.yml'
      - 'build_assets/apply_alpha28_sky_dock_interior_flight.py'
      - 'src/Cardcha/Services/AirshipFoundationService.cs'
      - 'src/Cardcha/Models/SaveData.cs'
      - 'src/Cardcha/Services/SaveService.cs'
      - 'src/Cardcha/assets/sky_dock_interior.tmx'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply alpha28 Sky Dock interior + flight candidate
        run: python3 build_assets/apply_alpha28_sky_dock_interior_flight.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, xml.etree.ElementTree as ET

          r = Path('src/Cardcha')
          target = '0.3.0-alpha.28.0.3.0'
          assert json.loads((r/'manifest.json').read_text())['Version'] == target
          assert target in (r/'Cardcha.csproj').read_text()
          assert target in (r/'Directory.Build.targets').read_text()
          assert target in (r/'ModEntry.cs').read_text()

          save = (r/'Models/SaveData.cs').read_text()
          assert 'SchemaVersion { get; set; } = 16' in save
          assert 'AirshipFlightsTaken' in save
          assert 'AirshipTotalFarePaid' in save

          save_service = (r/'Services/SaveService.cs').read_text()
          assert 'CurrentSchemaVersion = 16' in save_service
          assert '// v16: Sky Dock interior + MiMi fare telemetry.' in save_service
          assert 'data.AirshipFlightsTaken' in save_service
          assert 'data.AirshipTotalFarePaid' in save_service
          assert save_service.count('// v15: Airship foundation.') == 1

          airship = (r/'Services/AirshipFoundationService.cs').read_text()
          required = [
              'SkyDockInteriorLocationName = "Cardcha_SkyDockInterior"',
              'SkyDockInteriorMapAssetName = "Maps/Cardcha_SkyDockInterior"',
              'Region1Fare = 100',
              'Region2Fare = 250',
              'Region3Fare = 500',
              'Region4Fare = 1000',
              'GetRegionFare',
              'AirshipFlightsTaken <= 0',
              'HandleRegion1DepartureRequest',
              'StartFlightCutscene(returning: false)',
              'StartFlightCutscene(returning: true)',
              'DrawFlightCutscene',
              'DrawCinematicAirship',
              'WarpToSkyDockInterior',
              'ReturnToSkyDockExterior',
              'Game1.player.Money -= fare',
              'this.Save.Data.AirshipFlightsTaken++',
              'this.Save.Data.AirshipTotalFarePaid += fare',
              'CollisionEdits=NONE'
          ]
          for marker in required:
              assert marker in airship, marker

          # Fare must only happen on outbound confirmation; return path must not charge.
          return_start = airship.index('private void StartFlightCutscene(bool returning)')
          return_end = airship.index('private bool WarpToSkyDockInterior()', return_start)
          assert 'Money -=' not in airship[return_start:return_end]

          # Exterior compatibility promise remains frozen.
          forbidden = [
              '.Tiles[', 'Objects.Remove(', 'Objects.Add(',
              'terrainFeatures.Remove(', 'terrainFeatures.Add(',
              'setTileProperty', 'removeTileProperty'
          ]
          for marker in forbidden:
              assert marker not in airship, marker

          tmx = r/'assets/sky_dock_interior.tmx'
          root = ET.fromstring(tmx.read_text())
          assert root.attrib['width'] == '30' and root.attrib['height'] == '18'
          props = {p.attrib.get('name'): p.attrib.get('value') for p in root.find('properties')}
          assert props['CardchaAssetPolicy'] == 'cardcha-owned-map|vanilla-tiles-only|no-druid-assets'
          assert 'route-board' in props['CardchaSkyDockRole']
          for layer in root.findall('layer'):
              values = [x.strip() for x in layer.find('data').text.replace('\n', '').split(',') if x.strip()]
              assert len(values) == 30 * 18, (layer.attrib['name'], len(values))

          default = json.loads((r/'i18n/default.json').read_text())
          vi = json.loads((r/'i18n/vi.json').read_text())
          for key in [
              'airship.route.region1.first_free',
              'airship.route.region1.confirm',
              'airship.route.not_enough',
              'airship.cutscene.departure',
              'airship.cutscene.return'
          ]:
              assert default.get(key)
              assert vi.get(key)

          # Frozen alpha.27 / 0.7.9.0 regressions.
          binder = (r/'UI/CardchaBinderMenu.cs').read_text()
          assert 'TryConsumeSyntheticDetailClick(x, y)' in binder
          assert 'SuppressSyntheticDetailClickUntilMs' in binder
          assert 'LockedCard' in binder and 'PreviewCard' in binder

          item_asset = (r/'Services/ItemAssetService.cs').read_text()
          assert 'CanBePlacedIndoors = true' in item_asset
          assert item_asset.count('CanBePlacedOutdoors = false') >= 2

          assert hashlib.sha256((r/'assets/mimi_walk.png').read_bytes()).hexdigest() == '04ff1cbf031c2be0a21f114b8f8eb6f8850bb800eeabd4c27df036d7b23d4fb7'
          assert hashlib.sha256((r/'assets/mimi_broom.png').read_bytes()).hexdigest() == '875c305258151512e46a66d42574a271590f4d184269c03be7b1c1f4f6a161e8'
          assert hashlib.sha256((r/'assets/mimi_social_mugshot.png').read_bytes()).hexdigest() == '7db5cd2f6c8815148d68e534bda26036c55f200402f09713d742d1ab1bfebd11'

          mystery = (r/'Services/MimiMysteryTownService.cs').read_text()
          mystery_phase = mystery.index('// This also corrects stale/native schedule state')
          mystery_end = mystery.index('// During broom flight', mystery_phase)
          assert 'UpdateChaChaEmotes' not in mystery[mystery_phase:mystery_end]

          print('alpha28.0.3.0 Sky Dock interior + flight static validation PASS')
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile candidate
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Package TEST
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha artifact/canonical-src/Services artifact/canonical-src/Models artifact/canonical-src/assets artifact/canonical-src/i18n

          cp "$(find src/Cardcha/bin -name Cardcha.dll -print -quit)" stage/Cardcha/
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/
          test -s stage/Cardcha/Cardcha.dll
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.28.0.3.0_SkyDockInteriorFlight_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

          cp src/Cardcha/Services/AirshipFoundationService.cs src/Cardcha/Services/SaveService.cs artifact/canonical-src/Services/
          cp src/Cardcha/Models/SaveData.cs artifact/canonical-src/Models/
          cp src/Cardcha/assets/sky_dock_interior.tmx artifact/canonical-src/assets/
          cp src/Cardcha/i18n/default.json src/Cardcha/i18n/vi.json artifact/canonical-src/i18n/
          cp src/Cardcha/Cardcha.csproj src/Cardcha/Directory.Build.targets src/Cardcha/manifest.json src/Cardcha/ModEntry.cs artifact/canonical-src/

      - name: Canonicalize alpha28 Sky Dock interior + flight source if needed
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/Cardcha/Services/AirshipFoundationService.cs \
            src/Cardcha/Services/SaveService.cs \
            src/Cardcha/Models/SaveData.cs \
            src/Cardcha/assets/sky_dock_interior.tmx \
            src/Cardcha/i18n/default.json \
            src/Cardcha/i18n/vi.json \
            src/Cardcha/Cardcha.csproj \
            src/Cardcha/Directory.Build.targets \
            src/Cardcha/manifest.json \
            src/Cardcha/ModEntry.cs

          if git diff --cached --quiet; then
            echo 'Canonical source already matches alpha28.0.3.0.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'alpha28.0.3.0: canonicalize Sky Dock interior + flight'
            git push origin HEAD:cardcha-alpha28-airship-foundation
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-030-sky-dock-interior-flight
          path: artifact
          if-no-files-found: error
