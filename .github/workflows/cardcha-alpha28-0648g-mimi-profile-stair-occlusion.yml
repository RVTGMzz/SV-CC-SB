name: Cardcha alpha28.0.4.14.4.5.12.13 MiMi Profile Stair Occlusion

on:
  push:
    branches: [ cardcha-alpha28-0648g-mimi-profile-stair-occlusion ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 0648G candidate
        run: python3 tools/alpha28_0648g_mimi_profile_stair_occlusion.py

      - name: Validate exact requested fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, struct, subprocess

          root=Path('src/Cardcha')
          version='0.3.0-alpha.28.0.4.14.4.5.12.13'
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['Version']==version
          assert version in (root/'Cardcha.csproj').read_text()
          assert version in (root/'Directory.Build.targets').read_text()

          # User-uploaded mimi_walk.png is byte-identical to this canonical repo asset.
          walk=root/'assets/mimi_walk.png'
          raw=walk.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='04ff1cbf031c2be0a21f114b8f8eb6f8850bb800eeabd4c27df036d7b23d4fb7'
          assert struct.unpack('>II',raw[16:24])==(128,192)

          # No ugly half-scale profile sheet. Existing ProfileMenu 32x48 frame/scale now reads mimi_walk.png.
          assert not (root/'assets/mimi_profile.png').exists()
          world=(root/'Services/WorldActorService.cs').read_text()
          assert 'private const string MimiProfileSheetPath = "assets/mimi_walk.png";' in world
          patch=(root/'Patches/MimiProfileMenuPatch.cs').read_text()
          assert 'new(WorldActorService.MimiProfileCharacterAsset, 0, 32, 48)' in patch

          # Small social/avatar crop restored to the dedicated 16x24 slot appended to runtime sheet.
          mystery=(root/'Services/MimiMysteryTownService.cs').read_text()
          assert 'SetRectangleProperty(mimi, "MugShotSourceRect", 0, 192, 16, 24);' in mystery
          runtime=(root/'assets/mimi_walk_runtime.png').read_bytes()
          assert struct.unpack('>II',runtime[16:24])==(128,216)

          # Stair moved exactly three tiles left, y unchanged.
          home=(root/'Services/MimiHomeService.cs').read_text()
          a=home.index('internal static Point ResolvePreferredWizardStairTile')
          b=home.index('private static Point ResolveWizardLandingTile',a)
          method=home[a:b]
          assert 'return new Point(8, 15);' in method
          assert 'return new Point(11, 15);' not in method

          # Post-world custom draw can no longer paint a rung over a visible character.
          visual=(root/'Services/MimiAtticVisualService.cs').read_text()
          a=visual.index('private void DrawStairMarker')
          b=visual.index('private static AtticLayout GetLayout',a)
          draw=visual[a:b]
          assert 'for (int segment = 0; segment < 4; segment++)' in draw
          assert 'IntersectsVisibleCharacter(location, worldRect)' in draw
          assert 'GetCharacterVisualBounds' in draw
          assert '0.995f' not in draw
          assert 'upperSource' not in draw and 'lowerSource' not in draw

          # Scope firewall: only these implementation files/assets plus version metadata may change.
          changed=subprocess.check_output([
              'git','diff','--name-only','origin/cardcha-alpha28-0648f-wizard-recovery'
          ],text=True).splitlines()
          allowed={
              'tools/alpha28_0648g_mimi_profile_stair_occlusion.py',
              '.github/workflows/cardcha-alpha28-0648g-mimi-profile-stair-occlusion.yml',
              'src/Cardcha/Services/WorldActorService.cs',
              'src/Cardcha/Services/MimiMysteryTownService.cs',
              'src/Cardcha/Services/MimiHomeService.cs',
              'src/Cardcha/Services/MimiAtticVisualService.cs',
              'src/Cardcha/assets/mimi_profile.png',
              'src/Cardcha/manifest.json',
              'src/Cardcha/Cardcha.csproj',
              'src/Cardcha/Directory.Build.targets',
          }
          unexpected=[x for x in changed if x not in allowed]
          assert not unexpected, f'unexpected changes: {unexpected}'

          for protected in [
              'src/Cardcha/assets/mimi_walk.png',
              'src/Cardcha/assets/mimi_portraits.png',
              'src/Cardcha/assets/mimi_attic.tmx',
              'src/Cardcha/assets/airship_visual.png',
              'src/Cardcha/assets/airship_deck.tmx',
              'src/Cardcha/assets/sky_dock_interior.tmx',
              'src/Cardcha/Services/AirshipFoundationService.cs',
              'src/Cardcha/Services/ProgressionService.cs',
          ]:
              rc=subprocess.run(['git','diff','--quiet','origin/cardcha-alpha28-0648f-wizard-recovery','--',protected]).returncode
              assert rc==0, f'protected file changed: {protected}'

          print('0648G acceptance validator PASS')
          print('stair: (11,15) -> (8,15), character-aware rung occlusion')
          print('profile: same ProfileMenu 32x48 scaling, canonical mimi_walk.png backing sheet')
          print('small avatar: MugShotSourceRect restored to (0,192,16,24)')
          print('mimi_profile.png: deleted')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.13 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.13 MiMi profile stair occlusion [skip ci]'
            git push origin HEAD:cardcha-alpha28-0648g-mimi-profile-stair-occlusion
          fi

      - name: Package .5.12.13 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.13_MiMiProfileStair_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, struct, zipfile
          z=Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.13_MiMiProfileStair_TEST.zip')
          with zipfile.ZipFile(z) as f:
              names=set(f.namelist())
              assert json.loads(f.read('Cardcha/manifest.json'))['Version']=='0.3.0-alpha.28.0.4.14.4.5.12.13'
              assert 'Cardcha/assets/mimi_walk.png' in names
              assert 'Cardcha/assets/mimi_profile.png' not in names
              walk=f.read('Cardcha/assets/mimi_walk.png')
              assert hashlib.sha256(walk).hexdigest()=='04ff1cbf031c2be0a21f114b8f8eb6f8850bb800eeabd4c27df036d7b23d4fb7'
              assert struct.unpack('>II',walk[16:24])==(128,192)
              assert len(f.read('Cardcha/Cardcha.dll'))>100000
          print('Final .5.12.13 package audit PASS')
          PY

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0648g-mimi-profile-stair-occlusion
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.13_MiMiProfileStair_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.13_MiMiProfileStair_TEST.zip.sha256
          if-no-files-found: error
