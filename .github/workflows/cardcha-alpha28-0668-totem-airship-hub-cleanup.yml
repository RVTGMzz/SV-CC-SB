name: Cardcha alpha28.0.4.14.4.5.12.35 Totem Airship Hub Cleanup

on:
  push:
    branches: [ cardcha-alpha28-0668-totem-airship-hub-cleanup ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install generator deps
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Generate 0668 cleanup
        run: python3 tools/alpha28_0668_totem_airship_hub_cleanup.py

      - name: Apply compile normalization
        run: python3 tools/alpha28_0668_compile_hotfix.py

      - name: Validate 0668 acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, hashlib, xml.etree.ElementTree as ET

          root=Path('src/Cardcha')
          version='0.3.0-alpha.28.0.4.14.4.5.12.35'
          assert json.loads((root/'manifest.json').read_text())['Version']==version
          assert version in (root/'Cardcha.csproj').read_text()
          assert version in (root/'Directory.Build.targets').read_text()

          boss=(root/'Services/VerdantGuardianBossService.cs').read_text()
          for token in [
              'TotemStagger','TotemMarkerKey','TotemIndexKey','TotemMaxHealth = 90',
              'TotemStaggerDurationMs = 1200','SpawnTotems','UpdateTotemAnchors','ObserveTotemBreaks',
              'ModifyBossIncomingDamage','GetLivingTotemCount','GetTotemDamageReductionPercent',
              '>= 4 => 15, 3 => 10, 2 => 6, 1 => 3, _ => 0','ms * 0.92d'
          ]: assert token in boss, token

          damage=(root/'Patches/MonsterDamagePatch.cs').read_text()
          for token in ['VerdantGuardianBossService? VerdantBoss','ModifyBossIncomingDamage','isVerdantTotem','xTrajectory = 0','NotifyTotemHit']:
              assert token in damage, token
          draw=(root/'Patches/VerdantGuardianProxyDrawPatch.cs').read_text()
          assert 'TotemMarkerKey' in draw
          deaths=(root/'Services/MonsterDeathService.cs').read_text()
          assert 'TotemMarkerKey' in deaths

          arena=(root/'Services/VerdantGuardianArenaPolishService.cs').read_text()
          for token in ['verdant_seed_totem.png','VisualTotems','VisualLastTotemHitAtMs','DestructibleTotems']:
              assert token in arena, token

          air=(root/'Services/AirshipFoundationService.cs').read_text()
          for token in ['Region1StardewDecorRenderer.Draw','ResolveSkyDockLostFoundTile','airship.lostfound.empty','0668-lived-in-stardew-decor']:
              assert token in air, token
          renderer=(root/'Services/AirshipInteriorStardewRenderer.cs').read_text()
          for token in ['airship_hub_decor.png','DrawDeckStardewDecor','DrawDockStardewDecor','GetHubDecorAtlas']:
              assert token in renderer, token
          region=(root/'Services/Region1StardewDecorRenderer.cs').read_text()
          assert 'region1_environment_decor.png' in region

          for path,size in [
              (root/'assets/bosses/verdant_guardian/arena/verdant_seed_totem.png',(128,48)),
              (root/'assets/airship_hub_decor.png',(128,96)),
              (root/'assets/region1_environment_decor.png',(128,32)),
          ]:
              assert path.exists() and path.stat().st_size>100
              with Image.open(path) as im: assert im.size==size,(path,im.size)

          vi=json.loads((root/'i18n/vi.json').read_text())
          assert vi['airship.lostfound.empty'].startswith('KHO ĐỒ THẤT LẠC')
          assert 'Nhấn chuột phải' not in vi['airship.lostfound.empty']
          assert 'boss.verdant.totem.all-broken' in vi

          # Airship accepted visual asset must remain byte-identical.
          airship=root/'assets/airship_visual.png'
          assert hashlib.sha256(airship.read_bytes()).hexdigest()=='1821ee869759a924f7ff2b6821aaeb64b80a000d84c46f207a578d3a1e771132'

          # Regression locks.
          save=(root/'Models/SaveData.cs').read_text(); assert 'SchemaVersion { get; set; } = 19;' in save
          chacha=(root/'Services/ChaChaBossFormService.cs').read_text(); assert 'BossFormDurationMs = 10000' in chacha
          energy=(root/'Services/BossEnergyService.cs').read_text(); assert '/ 3' in energy or 'GainDivisor = 3' in energy
          home=(root/'Services/MimiHomeService.cs').read_text(); assert 'ResolvePreferredWizardStairTile' in home and 'rightIsBoundary' in home
          profile=(root/'Patches/MimiProfileMenuPatch.cs').read_text(); assert 'DrawScale=vanilla-4x' in profile
          assert 'trú mưa' in vi['mimi.social.community-center']

          cards=json.loads((root/'assets/cards.json').read_text()); assert len(cards)==80
          legacy={'endless_hunt','fate_weaver','immortal_echo','worldbreaker'}
          assert len([c for c in cards if c.get('Id') not in legacy])==76

          checked=0
          for tmx in sorted((root/'assets').rglob('*.tmx')):
              mr=ET.parse(tmx).getroot()
              for layer in mr.findall('layer'):
                  data=layer.find('data')
                  if data is None or data.attrib.get('encoding')!='csv': continue
                  toks=(data.text or '').split(','); vals=[]
                  for i,t in enumerate(toks):
                      st=t.strip(); assert st!='',f'{tmx}: empty CSV {i}'; n=int(st); assert 0<=n<=0xffffffff; vals.append(n)
                  assert len(vals)==int(layer.attrib['width'])*int(layer.attrib['height'])
                  checked+=1
          assert checked>=21
          print(f'0668 validator PASS; strictTMXLayers={checked}')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.35 source + handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.35 Totem Airship Hub cleanup [skip ci]'
            git push origin HEAD:cardcha-alpha28-0668-totem-airship-hub-cleanup
          fi

      - name: Package .5.12.35 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"; mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"; cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.35_TotemAirshipHubCleanup_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,json
          z=Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.35_TotemAirshipHubCleanup_TEST.zip')
          with zipfile.ZipFile(z) as f:
              assert json.loads(f.read('Cardcha/manifest.json'))['Version']=='0.3.0-alpha.28.0.4.14.4.5.12.35'
              assert len(f.read('Cardcha/Cardcha.dll'))>100000
              for n in ['Cardcha/assets/bosses/verdant_guardian/arena/verdant_seed_totem.png','Cardcha/assets/airship_hub_decor.png','Cardcha/assets/region1_environment_decor.png']:
                  assert len(f.read(n))>100
          print('Final 0668 package audit PASS')
          PY

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0668-totem-airship-hub-cleanup
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.35_TotemAirshipHubCleanup_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.35_TotemAirshipHubCleanup_TEST.zip.sha256
          if-no-files-found: error
