name: Cardcha alpha28.0.4.14.4.5.12.9 Wizard Stair Lock

on:
  push:
    branches: [ cardcha-alpha28-0648c-wizard-stair-lock ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 0648C candidate
        run: python3 tools/alpha28_0648c_wizard_stair_lock.py

      - name: Validate WIZ-only scope and fixed stair contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess
          root=Path('src/Cardcha')
          v='0.3.0-alpha.28.0.4.14.4.5.12.9'
          assert json.loads((root/'manifest.json').read_text())['Version']==v
          assert v in (root/'Cardcha.csproj').read_text()
          assert v in (root/'Directory.Build.targets').read_text()

          src=(root/'Services/MimiHomeService.cs').read_text()
          a=src.index('internal static Point ResolvePreferredWizardStairTile')
          b=src.index('private static Point ResolveWizardLandingTile', a)
          body=src[a:b]
          assert 'WIZ-01/WIZ-02 LOCKED' in body
          assert 'width - 4' in body
          assert 'height * 0.58f' in body
          assert 'return new Point(x, y);' in body
          assert 'IsTileClear' not in body
          assert 'FindClearTileNear' not in body
          assert 'for (' not in body
          assert 'foreach' not in body

          visual=(root/'Services/MimiAtticVisualService.cs').read_text()
          assert 'PrepareWizardStairArea(location, stair);' not in visual

          # Regression firewall: this candidate may not modify Airship, Gate, portrait, MiMi
          # routine assets/services, or any other gameplay file. Only Wizard stair source,
          # version metadata, generator and this workflow are allowed to differ from 0648B.
          base='e279369ab1f307d71a12e67b34cfc73697bd39ae'
          changed=subprocess.check_output(['git','diff','--name-only',base], text=True).splitlines()
          allowed={
              'tools/alpha28_0648c_wizard_stair_lock.py',
              '.github/workflows/cardcha-alpha28-0648c-wizard-stair-lock.yml',
              'src/Cardcha/Services/MimiHomeService.cs',
              'src/Cardcha/manifest.json',
              'src/Cardcha/Cardcha.csproj',
              'src/Cardcha/Directory.Build.targets',
          }
          unexpected=[p for p in changed if p not in allowed]
          assert not unexpected, f'0648C touched unrelated files: {unexpected}'
          print('WIZ-01/WIZ-02 candidate validator PASS')
          print('Changed files:', changed)
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.9 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Cardcha
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.9 Wizard stair lock [skip ci]'
            git push origin HEAD:cardcha-alpha28-0648c-wizard-stair-lock
          fi

      - name: Package .5.12.9 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.9_WizardStairLock_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0648c-wizard-stair-lock
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.9_WizardStairLock_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.9_WizardStairLock_TEST.zip.sha256
          if-no-files-found: error
