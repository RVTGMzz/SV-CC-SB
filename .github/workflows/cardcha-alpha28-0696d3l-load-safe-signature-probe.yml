name: Cardcha 0696D3-L Load-Safe Signature Probe TEST

on:
  workflow_dispatch:
  push:
    branches:
      - cardcha-alpha28-0696d2-window-environment-matrix
    paths:
      - src/Cardcha/Patches/AirshipGateDepthPatch.cs
      - src/Cardcha/ModEntry.cs
      - src/Cardcha/manifest.json
      - src/Cardcha/Cardcha.csproj
      - src/Cardcha/Directory.Build.targets
      - src/Cardcha/assets/sky_dock_interior.tmx
      - src/Cardcha/assets/airship_deck.tmx
      - src/Cardcha/assets/airship_props/set01_redux/airship_ambient_manifest.json
      - tools/materialize_0696d3i_console_asset.py
      - tools/alpha28_0696d3l_load_safe_signature_probe.py
      - tools/alpha28_0696d3l_package_audit.py
      - .github/workflows/cardcha-alpha28-0696d3l-load-safe-signature-probe.yml

permissions:
  contents: write

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout D3-L branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup deterministic image tooling
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Materialize clean console asset
        run: python3 tools/materialize_0696d3i_console_asset.py

      - name: Run D3-L load-safe signature validator
        run: python3 tools/alpha28_0696d3l_load_safe_signature_probe.py

      - name: Validate no legacy Window overlay reuse
        run: python3 tools/validate_0696d2_no_legacy_overlay_reuse.py

      - name: Validate render-depth contract
        run: python3 tools/validate_render_depth_contract.py

      - name: Prove validators did not mutate tracked production inputs
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD --             src/Cardcha/Patches/AirshipGateDepthPatch.cs             src/Cardcha/ModEntry.cs             src/Cardcha/manifest.json             src/Cardcha/Cardcha.csproj             src/Cardcha/Directory.Build.targets             src/Cardcha/assets/sky_dock_interior.tmx             src/Cardcha/assets/airship_deck.tmx             src/Cardcha/assets/airship_props/set01_redux/airship_ambient_manifest.json

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha Release
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Package D3-L .76 TEST
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION='0.3.0-alpha.28.0.4.14.4.5.12.76'
          ZIP="Cardcha_v${VERSION}_0696D3L_LoadSafeSignatureProbe_TEST.zip"
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name Cardcha.dll | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 "$GITHUB_WORKSPACE/tools/alpha28_0696d3l_package_audit.py"             "$ZIP" --report "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3L_PACKAGE_AUDIT.json"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Record D3-L CI evidence
        id: evidence
        shell: bash
        env:
          ZIP_NAME: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          TAG="cardcha-0696d3l-test-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root=Path(os.environ['GITHUB_WORKSPACE'])
          package=root/'package'/os.environ['ZIP_NAME']
          evidence={
              'phase':'0696D3-L-ci-evidence',
              'runId':int(os.environ['GITHUB_RUN_ID']),
              'runUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'sourceCommit':os.environ['GITHUB_SHA'],
              'releaseTag':f"cardcha-0696d3l-test-{os.environ['GITHUB_SHA'][:8]}",
              'package':package.name,
              'packageSha256':hashlib.sha256(package.read_bytes()).hexdigest(),
              'loadSafeSignatureValidator':'PASS',
              'renderDepth':'PASS',
              'compile':'PASS',
              'packageAudit':'PASS',
              'runtimeAcceptance':'PENDING-RON-IN-GAME',
          }
          (root/'handoff/AIRSHIP_0696D3L_CI_EVIDENCE.json').write_text(json.dumps(evidence,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(evidence,indent=2))
          PY

      - name: Publish D3-L TEST as GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ steps.package.outputs.zip }}
          TAG: ${{ steps.evidence.outputs.tag }}
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/package/$ZIP_NAME"
          NOTES=$(cat <<'EOF'
          0696D3-L TEST package for Ron's D3-K .75 save-load stall.

          Safety correction:
          - Removes the generic Harmony postfix from all GameLocation.isCollidingPosition overloads.
          - Probes compatible overload signatures once at startup only.
          - Preserves D3-J/K TMX Buildings collision for Room 1 and Room 2.
          - Keeps Farmer.Position correction forbidden.
          - Defers the Forest gate runtime collision layer until exact runtime signature evidence is captured safely.
          - Version is .76 / 0696D3-L.

          Expected runtime:
          - save reaches the playable world;
          - 0696D3-L collision signature probe [1]: ...
          - 0696D3-L load-safe mode: observed <N> compatible GameLocation.isCollidingPosition overload(s); runtime collision Harmony postfix is intentionally disabled.
          - Cardcha! 0.3.0-alpha.28.0.4.14.4.5.12.76 0696D3-L LOAD-SAFE SIGNATURE PROBE TEST

          CI/static/package PASS is not Runtime PASS.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving canonical assets and skipping publish."
            exit 0
          fi

          gh release create "$TAG"             "$ZIP_PATH" "$ZIP_PATH.sha256"             "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3L_LOAD_SAFE_SIGNATURE_VALIDATION.json"             "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3L_PACKAGE_AUDIT.json"             "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3L_CI_EVIDENCE.json"             --target "$GITHUB_SHA" --prerelease             --title "Cardcha 0696D3-L Load-Safe Signature Probe TEST"             --notes "$NOTES"
