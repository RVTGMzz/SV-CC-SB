name: Cardcha alpha28.0.4.14.4.5.12.45 Region III IV Terrain Depth Pass

on:
  push:
    branches: [ cardcha-alpha28-0676-region3-region4-terrain-depth-pass ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 0676 Region III IV terrain depth pass
        run: python3 tools/alpha28_0676_region3_region4_terrain_depth_pass.py

      - name: Validate 0676 terrain and frozen gameplay contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, struct, subprocess, xml.etree.ElementTree as ET

          root=Path('src/Cardcha')
          version='0.3.0-alpha.28.0.4.14.4.5.12.45'
          previous='0.3.0-alpha.28.0.4.14.4.5.12.44'
          base='origin/cardcha-alpha28-0675-region3-region4-authored-visual-pass'

          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['Version']==version
          assert version in (root/'Cardcha.csproj').read_text()
          targets=(root/'Directory.Build.targets').read_text()
          assert targets.count(version)>=2, 'Directory.Build.targets must update both Version and manifest rewrite target'
          assert previous not in targets, 'stale .12.44 manifest rewrite target remains'

          def png_size(path):
              b=Path(path).read_bytes()
              assert b[:8]==b'\x89PNG\r\n\x1a\n', path
              return struct.unpack('>II',b[16:24])

          for rel in ['assets/region3_mirrorwild_terrain.png','assets/region4_resonance_terrain.png']:
              p=root/rel
              assert png_size(p)==(512,64), (rel,png_size(p))
              assert p.stat().st_size>700, (rel,p.stat().st_size)

          region=(root/'Services/RegionExpeditionService.cs').read_text()
          for token in [
              '0676 terrain-depth pass',
              'Region3TerrainAtlasPath = "assets/region3_mirrorwild_terrain.png"',
              'Region4TerrainAtlasPath = "assets/region4_resonance_terrain.png"',
              'private void DrawTerrainClusters(SpriteBatch batch, Texture2D terrain, ExpeditionRegion region)',
              'private void DrawDecorClusters(SpriteBatch batch, Texture2D decor, ExpeditionRegion region)',
              'this.GetTerrainAtlas(region)',
              'new Point(20,14),0',
              'new Point(20,14),3',
              'private const float AuthoredWorldScale = 4f;',
              'Rectangle src = new(cell * 64, 0, 64, 64);',
              'AuthoredWorldScale, SpriteEffects.None, 0.001f',
          ]: assert token in region, token

          # Enemy authored rendering stays exactly at the 0675 fixed 4x policy.
          enemy_draw=region.split('private void DrawEnemyIdentity',1)[1].split('private Texture2D? GetTerrainAtlas',1)[0]
          assert 'AuthoredWorldScale' in enemy_draw
          assert 'roleIndex * 2 + frame' in enemy_draw
          assert 'Scale' not in '\n'.join(line for line in enemy_draw.splitlines() if 'monster' in line.lower())

          # Gameplay contract remains frozen from 0674/0675.
          for token in [
              'WaveCount = 3',
              'wave switch { 1 => 10, 2 => 15, _ => 22 }',
              'wave switch { 1 => 15, 2 => 22, _ => 32 }',
              '(wave == 3 ? 2 : wave == 2 ? 1 : 0)',
              '(wave == 1 ? 1 : wave == 2 ? 2 : 3)',
              'CardboardScraps += scrap', 'ShinyScraps += shiny',
              'StartExternalRegionReturnFlight()',
              'UseRouteConsole(int ownedCards, int nextBossRequired, string nextBossName)',
              'role = "mirror_sentinel";', 'hp = 480;',
              'role = "resonant_prime";', 'hp = 650;',
              'role = "mirror_wisp";', 'role = "glass_scarab";', 'role = "echo_slime";',
              'role = "ignis_echo";', 'role = "vita_husk";', 'role = "aether_mite";',
          ]: assert token in region, token

          entry=(root/'ModEntry.cs').read_text()
          assert version in entry
          assert 'REGION III / IV TERRAIN DEPTH PASS TEST' in entry
          assert 'RegionExpeditionProxyDrawPatch.Apply(harmony);' in entry

          airship=(root/'Services/AirshipFoundationService.cs').read_text()
          for token in ['Region3Fare = 500','Region4Fare = 1000','BeginExternalRegionFlight(int region, string targetLocationName, Point arrivalTile)','StartExternalRegionReturnFlight()']:
              assert token in airship, token

          boss=(root/'Services/MilestoneBossService.cs').read_text()
          for token in ['MilestoneBossKind.HollowCurator, 40','MilestoneBossKind.TricolorResonance, 60','MilestoneBossKind.Mimi, 80','BindExpeditionRouteHandler']:
              assert token in boss, token

          save=(root/'Services/SaveService.cs').read_text()
          assert 'CurrentSchemaVersion = 19' in save and 'CurrentSchemaVersion = 20' not in save
          cards=json.loads((root/'assets/cards.json').read_text())
          legacy={'endless_hunt','fate_weaver','immortal_echo','worldbreaker'}
          assert len(cards)==80 and len([c for c in cards if c.get('Id') not in legacy])==76

          # TMX structure: visual Back variation only, no Buildings/Front topology rewrite.
          for rel, depth in [
              ('assets/region3_mirrorwild.tmx','reflection-basin|paired-clearings|ground-clusters'),
              ('assets/region4_resonance_verge.tmx','resonance-core|ignis-vita-aether-triad|ground-clusters')
          ]:
              r=ET.parse(root/rel).getroot()
              props={x.attrib['name']:x.attrib.get('value','') for x in r.find('properties')}
              assert props['CardchaRegionVersion']=='0676'
              assert props['CardchaTerrainDepth']==depth
              assert 'authored-native-enemies' in props['CardchaAssetPolicy']
              assert 'authored-biome-decor' in props['CardchaAssetPolicy']
              assert 'authored-terrain-depth' in props['CardchaAssetPolicy']
              layers=r.findall('layer')
              assert [l.attrib['name'] for l in layers]==['Back','Buildings','Front']
              for layer in layers:
                  vals=[int(t.strip()) for t in (layer.find('data').text or '').split(',') if t.strip()]
                  assert len(vals)==40*28, (rel,layer.attrib['name'],len(vals))

          # 0676 must not mutate 0675 enemy/decor art, proxy suppression, save/progression or accepted legacy art.
          locked=[
              'src/Cardcha/Patches/RegionExpeditionProxyDrawPatch.cs',
              'src/Cardcha/assets/region3_mirrorwild_enemies.png',
              'src/Cardcha/assets/region4_resonance_enemies.png',
              'src/Cardcha/assets/region3_mirrorwild_decor.png',
              'src/Cardcha/assets/region4_resonance_decor.png',
              'src/Cardcha/Services/AirshipFoundationService.cs',
              'src/Cardcha/Services/MilestoneBossService.cs',
              'src/Cardcha/Services/SaveService.cs',
              'src/Cardcha/assets/cards.json',
              'src/Cardcha/assets/mimi_walk.png',
              'src/Cardcha/assets/airship_visual.png',
              'src/Cardcha/assets/airship_deck.tmx',
              'src/Cardcha/assets/sky_dock_interior.tmx',
              'src/Cardcha/assets/verdant_guardian_arena.tmx',
              'src/Cardcha/assets/boss2_hollow_curator_arena.tmx',
              'src/Cardcha/assets/boss3_tricolor_resonance_arena.tmx',
              'src/Cardcha/assets/boss4_mimi_resonance_arena.tmx',
          ]
          locked += [str(p) for p in sorted((root/'assets/bosses/milestone').glob('*.png'))]
          for p in locked:
              rc=subprocess.run(['git','diff','--quiet',base,'--',p]).returncode
              assert rc==0, f'0676 changed frozen path: {p}'

          checked=0
          for tmx in sorted((root/'assets').rglob('*.tmx')):
              r=ET.parse(tmx).getroot()
              for layer in r.findall('layer'):
                  data=layer.find('data')
                  if data is None or data.attrib.get('encoding')!='csv':
                      continue
                  vals=[]
                  for i,token in enumerate((data.text or '').split(',')):
                      st=token.strip()
                      assert st!='', f'{tmx}: empty CSV token {i}'
                      n=int(st)
                      assert 0<=n<=0xFFFFFFFF
                      vals.append(n)
                  assert len(vals)==int(layer.attrib['width'])*int(layer.attrib['height'])
                  checked+=1
          assert checked>=53, checked

          handoff=Path('handoff/ALPHA28_0676_REGION3_REGION4_TERRAIN_DEPTH_PASS.md').read_text()
          latest=Path('handoff/LATEST_CARDCHA_HANDOFF.md').read_text()
          assert version in handoff and version in latest
          assert 'cardcha-alpha28-0676-region3-region4-terrain-depth-pass' in latest
          print(f'0676 validator PASS; terrainAtlases=2 enemyScale=4x gameplay=FROZEN schema=19 cards=76/80 strictTMX={checked}')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.45 source assets handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.45 Region III IV terrain depth pass [skip ci]'
            git push origin HEAD:cardcha-alpha28-0676-region3-region4-terrain-depth-pass
          fi

      - name: Package .5.12.45 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.45_Region3Region4TerrainDepth_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 - <<'PY'
          import json, zipfile, struct
          z='Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.45_Region3Region4TerrainDepth_TEST.zip'
          with zipfile.ZipFile(z) as f:
              names=set(f.namelist())
              manifest=json.loads(f.read('Cardcha/manifest.json'))
              dll=f.read('Cardcha/Cardcha.dll')
              print(f"0676 package diagnostics: version={manifest['Version']} dllBytes={len(dll)} files={len(names)}")
              assert manifest['Version']=='0.3.0-alpha.28.0.4.14.4.5.12.45'
              assert len(dll)>50000 and dll[:2]==b'MZ'
              for p in [
                  'Cardcha/assets/region3_mirrorwild.tmx','Cardcha/assets/region4_resonance_verge.tmx',
                  'Cardcha/assets/region3_mirrorwild_enemies.png','Cardcha/assets/region4_resonance_enemies.png',
                  'Cardcha/assets/region3_mirrorwild_decor.png','Cardcha/assets/region4_resonance_decor.png',
                  'Cardcha/assets/region3_mirrorwild_terrain.png','Cardcha/assets/region4_resonance_terrain.png',
                  'Cardcha/assets/mimi_walk.png','Cardcha/i18n/default.json','Cardcha/i18n/vi.json'
              ]: assert p in names,p
              for p in ['Cardcha/assets/region3_mirrorwild_terrain.png','Cardcha/assets/region4_resonance_terrain.png']:
                  b=f.read(p)
                  assert b[:8]==b'\x89PNG\r\n\x1a\n'
                  assert struct.unpack('>II',b[16:24])==(512,64)
              assert len(f.read('Cardcha/assets/mimi_walk.png'))==65167
          print('0676 final package audit PASS')
          PY

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0676-region3-region4-terrain-depth-pass
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.45_Region3Region4TerrainDepth_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.45_Region3Region4TerrainDepth_TEST.zip.sha256
          if-no-files-found: error
