name: Cardcha 0696D3-K Collision Hook Runtime Fix TEST

on:
  workflow_dispatch:
  push:
    branches:
      - cardcha-alpha28-0696d2-window-environment-matrix
    paths:
      - src/Cardcha/Patches/AirshipGateDepthPatch.cs
      - src/Cardcha/ModEntry.cs
      - src/Cardcha/manifest.json
      - src/Cardcha/Cardcha.csproj
      - src/Cardcha/Directory.Build.targets
      - src/Cardcha/assets/sky_dock_interior.tmx
      - src/Cardcha/assets/airship_deck.tmx
      - src/Cardcha/assets/airship_props/set01_redux/airship_ambient_manifest.json
      - tools/materialize_0696d3i_console_asset.py
      - tools/alpha28_0696d3k_collision_hook.py
      - tools/alpha28_0696d3k_package_audit.py
      - .github/workflows/cardcha-alpha28-0696d3k-collision-hook-runtime-fix.yml

permissions:
  contents: write

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout D3-K branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup deterministic image tooling
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Materialize clean console asset
        run: python3 tools/materialize_0696d3i_console_asset.py

      - name: Run D3-K collision hook validator
        run: python3 tools/alpha28_0696d3k_collision_hook.py

      - name: Validate no legacy Window overlay reuse
        run: python3 tools/validate_0696d2_no_legacy_overlay_reuse.py

      - name: Validate render-depth contract
        run: python3 tools/validate_render_depth_contract.py

      - name: Prove validators did not mutate tracked production inputs
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD --             src/Cardcha/Patches/AirshipGateDepthPatch.cs             src/Cardcha/ModEntry.cs             src/Cardcha/manifest.json             src/Cardcha/Cardcha.csproj             src/Cardcha/Directory.Build.targets             src/Cardcha/assets/sky_dock_interior.tmx             src/Cardcha/assets/airship_deck.tmx             src/Cardcha/assets/airship_props/set01_redux/airship_ambient_manifest.json

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha Release
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Package D3-K .75 TEST
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION='0.3.0-alpha.28.0.4.14.4.5.12.75'
          ZIP="Cardcha_v${VERSION}_0696D3K_CollisionHookRuntimeFix_TEST.zip"
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name Cardcha.dll | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 "$GITHUB_WORKSPACE/tools/alpha28_0696d3k_package_audit.py"             "$ZIP" --report "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3K_PACKAGE_AUDIT.json"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Record D3-K CI evidence
        id: evidence
        shell: bash
        env:
          ZIP_NAME: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          TAG="cardcha-0696d3k-test-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root=Path(os.environ['GITHUB_WORKSPACE'])
          package=root/'package'/os.environ['ZIP_NAME']
          evidence={
              'phase':'0696D3-K-ci-evidence',
              'runId':int(os.environ['GITHUB_RUN_ID']),
              'runUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'sourceCommit':os.environ['GITHUB_SHA'],
              'releaseTag':f"cardcha-0696d3k-test-{os.environ['GITHUB_SHA'][:8]}",
              'package':package.name,
              'packageSha256':hashlib.sha256(package.read_bytes()).hexdigest(),
              'collisionHookValidator':'PASS',
              'renderDepth':'PASS',
              'compile':'PASS',
              'packageAudit':'PASS',
              'runtimeAcceptance':'PENDING-RON-IN-GAME',
          }
          (root/'handoff/AIRSHIP_0696D3K_CI_EVIDENCE.json').write_text(json.dumps(evidence,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(evidence,indent=2))
          PY

      - name: Publish D3-K TEST as GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ steps.package.outputs.zip }}
          TAG: ${{ steps.evidence.outputs.tag }}
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/package/$ZIP_NAME"
          NOTES=$(cat <<'EOF'
          0696D3-K TEST package responding directly to Ron's SMAPI runtime log.

          Fixes:
          - Replaces the stale exact 9-parameter GameLocation.isCollidingPosition lookup.
          - Scans compatible isCollidingPosition overloads dynamically and patches all bool-returning overloads whose first parameter is Microsoft.Xna.Framework.Rectangle.
          - Postfix extracts isFarmer and Character from the resolved method metadata instead of relying on one hard-coded signature.
          - Keeps D3-J map-owned collision footprints and never moves Farmer.Position.
          - Startup build banner now reads ModManifest.Version instead of the stale .69 / 0686 hard-coded text.
          - Version is .75 / 0696D3-K.

          Expected runtime lines:
          - 0696D3-K installed collision hooks on <N> GameLocation.isCollidingPosition overload(s).
          - Cardcha! 0.3.0-alpha.28.0.4.14.4.5.12.75 0696D3-K COLLISION HOOK RUNTIME FIX TEST

          CI/static/package PASS is not Runtime PASS.
          Ron must confirm the exact package in game.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving canonical assets and skipping publish."
            exit 0
          fi

          gh release create "$TAG"             "$ZIP_PATH" "$ZIP_PATH.sha256"             "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3K_COLLISION_HOOK_VALIDATION.json"             "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3K_PACKAGE_AUDIT.json"             "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3K_CI_EVIDENCE.json"             --target "$GITHUB_SHA" --prerelease             --title "Cardcha 0696D3-K Collision Hook Runtime Fix TEST"             --notes "$NOTES"
