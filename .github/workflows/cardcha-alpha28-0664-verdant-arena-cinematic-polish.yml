name: Cardcha alpha28.0.4.14.4.5.12.31 Verdant Arena Cinematic Polish

on:
  push:
    branches: [ cardcha-alpha28-0664-verdant-arena-cinematic-polish ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install generator deps
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Generate 0664 Verdant arena cinematic polish
        run: python3 tools/alpha28_0664_verdant_arena_cinematic_polish.py

      - name: Validate 0664 acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, xml.etree.ElementTree as ET

          root = Path('src/Cardcha')
          version = '0.3.0-alpha.28.0.4.14.4.5.12.31'
          manifest = json.loads((root/'manifest.json').read_text())
          assert manifest['Version'] == version
          assert version in (root/'Cardcha.csproj').read_text()
          assert version in (root/'Directory.Build.targets').read_text()

          polish = (root/'Services/VerdantGuardianArenaPolishService.cs').read_text()
          for token in [
              'VerdantGuardianArenaPolishService',
              'verdant_arena_seal.png',
              'verdant_arena_obelisk.png',
              'verdant_retreat_glyph.png',
              'DrawAmbientMotes',
              'DrawIntroPresentation',
              'DrawPhasePresentation',
              'TriggerShake(9, 280, "area-slam-impact")',
              'RestoreCameraOffset',
              'Game1.viewport.X += dx;',
              'Game1.viewport.X -= this.AppliedCameraOffset.X;',
              'PlayCue("leafrustle")',
              'PlayCue("discoverMineral")',
              'PlayCue("yoba")',
          ]:
              assert token in polish, token

          # Arena assets are Cardcha-owned and all non-empty.
          arena_dir = root/'assets/bosses/verdant_guardian/arena'
          specs = {
              'verdant_arena_seal.png': (128,128),
              'verdant_arena_obelisk.png': (32,64),
              'verdant_retreat_glyph.png': (64,64),
          }
          for name, dims in specs.items():
              p = arena_dir/name
              assert p.exists() and p.stat().st_size > 150, name
              with Image.open(p) as im:
                  assert im.size == dims, (name, im.size)
                  assert im.mode == 'RGBA'
                  assert im.getbbox() is not None

          mod = (root/'ModEntry.cs').read_text()
          for token in [
              'private VerdantGuardianArenaPolishService VerdantArenaPolish = null!;',
              'new VerdantGuardianArenaPolishService(helper, this.Monitor, this.VerdantGuardian)',
              'this.VerdantArenaPolish.OnUpdateTicked',
              'this.VerdantArenaPolish.OnRenderedHud',
              'this.VerdantArenaPolish.OnRenderedWorld',
              'this.VerdantArenaPolish.OnWarped',
              'this.VerdantArenaPolish.OnReturnedToTitle',
              'cardcha_boss1_polish_status',
              '0.3.0-alpha.28.0.4.14.4.5.12.31 VERDANT ARENA CINEMATIC POLISH TEST',
          ]:
              assert token in mod, token

          for lang in ['default.json', 'vi.json']:
              data = json.loads((root/'i18n'/lang).read_text())
              for key in [
                  'boss.verdant.cinematic.title',
                  'boss.verdant.cinematic.subtitle',
                  'boss.verdant.cinematic.phase',
              ]:
                  assert key in data, (lang,key)

          # 0664 is presentation-only: authoritative Boss I combat timings/balance remain locked.
          boss = (root/'Services/VerdantGuardianBossService.cs').read_text()
          for token in [
              'private const int BossMaxHealth = 1300;',
              'private const int IntroDurationMs = 1500;',
              'private const int DefeatSequenceDurationMs = 2200;',
              'private const int SwipeTelegraphMs = 700;',
              'private const int RootTelegraphMs = 900;',
              'private const int SummonTelegraphMs = 600;',
              'private const int ChargeTelegraphMs = 900;',
              'private const int ChargeDurationMs = 720;',
              'private const int VineTelegraphMs = 900;',
              'private const int VineActiveMs = 2500;',
              'private const int SlamTelegraphMs = 1100;',
              'private const int MaxActiveAdds = 4;',
              'DamagePlayer(10, boss)',
              'DamagePlayer(8, boss)',
              'DamagePlayer(14, boss)',
              'DamagePlayer(4, boss)',
              'DamagePlayer(16, boss)',
          ]:
              assert token in boss, token

          # 0663 custom summons stay intact.
          for token in [
              'public const string BriarlingId = "briarling";',
              'public const string LeafWispId = "leaf_wisp";',
              'BossAddTypeKey',
              'PrepareSummonPlan',
          ]:
              assert token in boss, token
          summons = (root/'Services/VerdantGuardianSummonVisualService.cs').read_text()
          assert 'briarling.png' in summons
          assert 'leaf_wisp.png' in summons
          assert 'summon_portal.png' in summons
          for name in ['briarling.png','leaf_wisp.png','summon_portal.png']:
              p = root/'assets/bosses/verdant_guardian/summons'/name
              assert p.exists() and p.stat().st_size > 150

          # Preserve 0660 Colossus, 0661 Boss Card, 0662 Guardian Rabbit.
          visual = (root/'Services/VerdantGuardianVisualService.cs').read_text()
          assert 'private const float DrawScale = 8f;' in visual
          assert 'boss1_verdant_guardian_defeat.png' in visual
          boss_card = (root/'Services/BossCardService.cs').read_text()
          assert 'public const string VerdantCoreId = "verdant_core";' in boss_card
          assert 'public const double VerdantDamageReduction = 0.35d;' in boss_card
          assert 'public const int VerdantActiveDurationMs = 6000;' in boss_card
          form = (root/'Services/ChaChaBossFormService.cs').read_text()
          assert 'public const string GuardianRabbitFormId = "guardian_rabbit";' in form
          assert 'public const int BossFormDurationMs = 10000;' in form
          energy = (root/'Services/BossEnergyService.cs').read_text()
          assert 'public const double EnergyGainScale = 1d / 3d;' in energy

          # Save/card canon remains unchanged.
          save = (root/'Models/SaveData.cs').read_text()
          assert 'SchemaVersion { get; set; } = 19;' in save
          cards = json.loads((root/'assets/cards.json').read_text())
          legacy_mythic = {'endless_hunt', 'fate_weaver', 'immortal_echo', 'worldbreaker'}
          assert len(cards) == 80
          assert len([c for c in cards if c.get('Id') not in legacy_mythic]) == 76

          # Preserve MiMi/stair/profile work.
          home = (root/'Services/MimiHomeService.cs').read_text()
          assert 'ResolvePreferredWizardStairTile' in home
          assert 'bool rightIsBoundary' in home
          profile = (root/'Patches/MimiProfileMenuPatch.cs').read_text()
          assert 'DrawScale=vanilla-4x' in profile
          vi = json.loads((root/'i18n/vi.json').read_text())
          assert 'trú mưa' in vi['mimi.social.community-center']

          # Strict TMX runtime contract and 28x20 arena geometry preserved.
          arena_tmx = ET.parse(root/'assets/verdant_guardian_arena.tmx').getroot()
          assert arena_tmx.attrib['width'] == '28' and arena_tmx.attrib['height'] == '20'
          props = {p.attrib.get('name'):p.attrib.get('value') for p in arena_tmx.find('properties')}
          assert props['CardchaRegionVersion'] == version

          checked_layers = 0
          for tmx in sorted((root/'assets').rglob('*.tmx')):
              map_root = ET.parse(tmx).getroot()
              for layer in map_root.findall('layer'):
                  data = layer.find('data')
                  if data is None or data.attrib.get('encoding') != 'csv':
                      continue
                  tokens = (data.text or '').split(',')
                  vals = []
                  for i, token in enumerate(tokens):
                      s = token.strip()
                      assert s != '', f'{tmx}: empty CSV token layer={layer.attrib.get("name")} index={i}'
                      n = int(s)
                      assert 0 <= n <= 0xFFFFFFFF
                      vals.append(n)
                  assert len(vals) == int(layer.attrib['width']) * int(layer.attrib['height'])
                  checked_layers += 1
          assert checked_layers >= 21
          print(f'0664 validator PASS; presentationOnly=True, baseCards=80 active=76 strictTMXLayers={checked_layers}')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.31 source + handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.31 Verdant arena cinematic polish [skip ci]'
            git push origin HEAD:cardcha-alpha28-0664-verdant-arena-cinematic-polish
          fi

      - name: Package .5.12.31 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.31_VerdantArenaCinematicPolish_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"

          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile, xml.etree.ElementTree as ET
          z = Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.31_VerdantArenaCinematicPolish_TEST.zip')
          with zipfile.ZipFile(z) as f:
              assert json.loads(f.read('Cardcha/manifest.json'))['Version'] == '0.3.0-alpha.28.0.4.14.4.5.12.31'
              assert len(f.read('Cardcha/Cardcha.dll')) > 100000
              for name in [
                  'Cardcha/assets/bosses/verdant_guardian/arena/verdant_arena_seal.png',
                  'Cardcha/assets/bosses/verdant_guardian/arena/verdant_arena_obelisk.png',
                  'Cardcha/assets/bosses/verdant_guardian/arena/verdant_retreat_glyph.png',
              ]:
                  assert len(f.read(name)) > 150, name
              vi = json.loads(f.read('Cardcha/i18n/vi.json'))
              assert vi['boss.verdant.cinematic.title'] == 'VERDANT GUARDIAN'
              for name in [n for n in f.namelist() if n.endswith('.tmx')]:
                  map_root = ET.fromstring(f.read(name))
                  for layer in map_root.findall('layer'):
                      data = layer.find('data')
                      if data is None or data.attrib.get('encoding') != 'csv':
                          continue
                      tokens = (data.text or '').split(',')
                      vals = [int(t.strip()) for t in tokens if t.strip()]
                      assert len(vals) == len(tokens), f'{name}: packaged empty CSV token'
                      assert len(vals) == int(layer.attrib['width']) * int(layer.attrib['height'])
          print('Final .5.12.31 package audit PASS')
          PY

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0664-verdant-arena-cinematic-polish
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.31_VerdantArenaCinematicPolish_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.31_VerdantArenaCinematicPolish_TEST.zip.sha256
          if-no-files-found: error
