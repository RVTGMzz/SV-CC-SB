name: Cardcha alpha27.0.7.8.4 corrected controller actions + rug final

on:
  push:
    branches: [ cardcha-alpha27-mimi-real-npc ]
    paths:
      - '.github/workflows/cardcha-alpha27-0784-controller-action-target-fixed.yml'
      - 'build_assets/apply_0784_fixed.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrected 0.7.8.4 candidate
        run: python3 build_assets/apply_0784_fixed.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          r = Path('src/Cardcha')
          target = '0.3.0-alpha.27.0.7.8.4'
          assert json.loads((r/'manifest.json').read_text())['Version'] == target
          assert target in (r/'Cardcha.csproj').read_text()
          assert target in (r/'Directory.Build.targets').read_text()
          assert target in (r/'ModEntry.cs').read_text()

          binder = (r/'UI/CardchaBinderMenu.cs').read_text()
          assert 'private CardDefinition? ControllerActionTarget;' in binder
          assert 'this.CaptureControllerActionTarget(focusedId);' in binder
          assert 'private void PrepareControllerActionTargetForMousePath()' in binder
          assert 'fromController && this.LastInputWasController && IsDetailActionId(id)' in binder
          assert 'this.receiveLeftClick(action.Center.X, action.Center.Y, playSound: true);' in binder
          assert 'bool actionOwned = actionTarget is not null' in binder
          assert 'ActivateFavoriteThroughMouseHandler' not in binder

          visual = (r/'Services/MimiAtticVisualService.cs').read_text()
          assert '"(F)1456", 16, 9, pixelOffsetX: -32' in visual
          assert '"(F)1466", 4, 7, pixelOffsetX: -32' in visual
          assert 'alpha.27.0.7.8.4' in visual

          assert hashlib.sha256((r/'assets/mimi_walk.png').read_bytes()).hexdigest() == '04ff1cbf031c2be0a21f114b8f8eb6f8850bb800eeabd4c27df036d7b23d4fb7'
          assert hashlib.sha256((r/'assets/mimi_broom.png').read_bytes()).hexdigest() == '875c305258151512e46a66d42574a271590f4d184269c03be7b1c1f4f6a161e8'
          assert hashlib.sha256((r/'assets/mimi_social_mugshot.png').read_bytes()).hexdigest() == '7db5cd2f6c8815148d68e534bda26036c55f200402f09713d742d1ab1bfebd11'
          print('0.7.8.4 corrected static validation PASS')
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Package TEST
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha artifact/canonical-src/UI artifact/canonical-src/Services artifact/canonical-src/assets
          cp "$(find src/Cardcha/bin -name Cardcha.dll -print -quit)" stage/Cardcha/
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/
          test -s stage/Cardcha/Cardcha.dll
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.27.0.7.8.4_ControllerActionsRugFinal_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

          cp src/Cardcha/UI/CardchaBinderMenu.cs artifact/canonical-src/UI/
          cp src/Cardcha/Services/MimiAtticVisualService.cs artifact/canonical-src/Services/
          cp src/Cardcha/assets/mimi_attic.tmx artifact/canonical-src/assets/
          cp src/Cardcha/Cardcha.csproj src/Cardcha/Directory.Build.targets src/Cardcha/manifest.json src/Cardcha/ModEntry.cs artifact/canonical-src/

      - name: Canonicalize 0.7.8.4 source if needed
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/Cardcha/UI/CardchaBinderMenu.cs \
            src/Cardcha/Services/MimiAtticVisualService.cs \
            src/Cardcha/assets/mimi_attic.tmx \
            src/Cardcha/Cardcha.csproj \
            src/Cardcha/Directory.Build.targets \
            src/Cardcha/manifest.json \
            src/Cardcha/ModEntry.cs

          if git diff --cached --quiet; then
            echo 'Canonical source already matches 0.7.8.4.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'alpha27.0.7.8.4: unify controller detail actions and finish prototype rug alignment'
            git push origin HEAD:cardcha-alpha27-mimi-real-npc
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha27-0784-controller-actions-rug-final
          path: artifact
          if-no-files-found: error
