name: Cardcha alpha27.0.7.8.8 controller synthetic click suppression

on:
  push:
    branches: [ cardcha-alpha27-mimi-real-npc ]
    paths:
      - '.github/workflows/cardcha-alpha27-0788-controller-synthetic-click.yml'
      - 'build_assets/apply_0788.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.7.8.8 candidate
        run: python3 build_assets/apply_0788.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=Path('src/Cardcha')
          target='0.3.0-alpha.27.0.7.8.8'
          assert json.loads((r/'manifest.json').read_text())['Version']==target
          for f in ['Cardcha.csproj','Directory.Build.targets','ModEntry.cs']:
              assert target in (r/f).read_text()
          t=(r/'UI/CardchaBinderMenu.cs').read_text()
          assert 'TryConsumeSyntheticDetailClick(x, y)' in t
          assert 'ArmSyntheticDetailClickSuppression(id)' in t
          assert 'SuppressSyntheticDetailClickUntilMs' in t
          assert 'FavoriteActionId' in t and 'EquipActionId' in t
          print('0.7.8.8 static validation PASS')
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Package TEST
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha artifact/canonical-src/UI
          cp "$(find src/Cardcha/bin -name Cardcha.dll -print -quit)" stage/Cardcha/
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/
          test -s stage/Cardcha/Cardcha.dll
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.27.0.7.8.8_ControllerSyntheticClickFix_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt
          cp src/Cardcha/UI/CardchaBinderMenu.cs artifact/canonical-src/UI/
          cp src/Cardcha/Cardcha.csproj src/Cardcha/Directory.Build.targets src/Cardcha/manifest.json src/Cardcha/ModEntry.cs artifact/canonical-src/

      - name: Canonicalize 0.7.8.8 source if needed
        shell: bash
        run: |
          set -euo pipefail
          git add src/Cardcha/UI/CardchaBinderMenu.cs src/Cardcha/Cardcha.csproj src/Cardcha/Directory.Build.targets src/Cardcha/manifest.json src/Cardcha/ModEntry.cs
          if git diff --cached --quiet; then
            echo 'Canonical source already matches 0.7.8.8.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'alpha27.0.7.8.8: suppress controller synthetic click double toggles'
            git push origin HEAD:cardcha-alpha27-mimi-real-npc
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha27-0788-controller-synthetic-click
          path: artifact
          if-no-files-found: error
