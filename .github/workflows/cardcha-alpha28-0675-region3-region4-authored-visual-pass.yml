name: Cardcha alpha28.0.4.14.4.5.12.44 Region III IV Authored Visual Pass

on:
  push:
    branches: [ cardcha-alpha28-0675-region3-region4-authored-visual-pass ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 0675 authored Region III IV visual pass
        run: python3 tools/alpha28_0675_region3_region4_authored_visual_pass.py

      - name: Validate 0675 authored visual contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, struct, subprocess, xml.etree.ElementTree as ET

          root=Path('src/Cardcha')
          version='0.3.0-alpha.28.0.4.14.4.5.12.44'
          previous='0.3.0-alpha.28.0.4.14.4.5.12.43'
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['Version']==version
          assert version in (root/'Cardcha.csproj').read_text()
          targets=(root/'Directory.Build.targets').read_text()
          assert targets.count(version)>=2
          assert previous not in targets

          def png_size(path):
              b=Path(path).read_bytes()
              assert b[:8]==b'\x89PNG\r\n\x1a\n', path
              return struct.unpack('>II',b[16:24])
          for rel in [
              'assets/region3_mirrorwild_enemies.png',
              'assets/region4_resonance_enemies.png',
              'assets/region3_mirrorwild_decor.png',
              'assets/region4_resonance_decor.png',
          ]:
              assert png_size(root/rel)==(256,32), (rel,png_size(root/rel))
              assert (root/rel).stat().st_size>250, rel

          region=(root/'Services/RegionExpeditionService.cs').read_text()
          for token in [
              '0675 authored visual pass',
              'Region3EnemyAtlasPath = "assets/region3_mirrorwild_enemies.png"',
              'Region4EnemyAtlasPath = "assets/region4_resonance_enemies.png"',
              'Region3DecorAtlasPath = "assets/region3_mirrorwild_decor.png"',
              'Region4DecorAtlasPath = "assets/region4_resonance_decor.png"',
              'public const string EnemyMarkerKey',
              'private const float AuthoredWorldScale = 4f;',
              'RoleIndex(ExpeditionRegion region, string role)',
              'Rectangle src = new((roleIndex * 2 + frame) * 32, 0, 32, 32)',
              'this.GetEnemyAtlas(region)', 'this.GetDecorAtlas(region)',
              'mirror_wisp','glass_scarab','echo_slime','mirror_sentinel',
              'ignis_echo','vita_husk','aether_mite','resonant_prime',
          ]: assert token in region, token

          # 0674 gameplay values are frozen in this visual-only pass.
          for token in [
              'WaveCount = 3',
              'wave switch { 1 => 10, 2 => 15, _ => 22 }',
              'wave switch { 1 => 15, 2 => 22, _ => 32 }',
              '(wave == 3 ? 2 : wave == 2 ? 1 : 0)',
              '(wave == 1 ? 1 : wave == 2 ? 2 : 3)',
              'CardboardScraps += scrap', 'ShinyScraps += shiny',
              'StartExternalRegionReturnFlight()',
              'UseRouteConsole(int ownedCards, int nextBossRequired, string nextBossName)',
          ]: assert token in region, token

          patch=(root/'Patches/RegionExpeditionProxyDrawPatch.cs').read_text()
          for token in ['typeof(GreenSlime)','typeof(Bat)','typeof(Bug)','RegionExpeditionService.EnemyMarkerKey','HarmonyMethod']:
              assert token in patch, token
          assert 'isInvisible' not in patch

          entry=(root/'ModEntry.cs').read_text()
          assert 'RegionExpeditionProxyDrawPatch.Apply(harmony);' in entry
          assert version in entry
          assert 'REGION III / IV AUTHORED VISUAL PASS TEST' in entry

          airship=(root/'Services/AirshipFoundationService.cs').read_text()
          for token in ['Region3Fare = 500','Region4Fare = 1000','BeginExternalRegionFlight(int region, string targetLocationName, Point arrivalTile)','StartExternalRegionReturnFlight()']:
              assert token in airship, token

          boss=(root/'Services/MilestoneBossService.cs').read_text()
          for token in ['MilestoneBossKind.HollowCurator, 40','MilestoneBossKind.TricolorResonance, 60','MilestoneBossKind.Mimi, 80','BindExpeditionRouteHandler']:
              assert token in boss, token

          save=(root/'Services/SaveService.cs').read_text()
          assert 'CurrentSchemaVersion = 19' in save and 'CurrentSchemaVersion = 20' not in save
          cards=json.loads((root/'assets/cards.json').read_text())
          legacy={'endless_hunt','fate_weaver','immortal_echo','worldbreaker'}
          assert len(cards)==80 and len([c for c in cards if c.get('Id') not in legacy])==76

          for rel in ['assets/region3_mirrorwild.tmx','assets/region4_resonance_verge.tmx']:
              r=ET.parse(root/rel).getroot()
              props={x.attrib['name']:x.attrib.get('value','') for x in r.find('properties')}
              assert props['CardchaRegionVersion']=='0675'
              assert 'authored-native-enemies' in props['CardchaAssetPolicy']
              assert 'authored-biome-decor' in props['CardchaAssetPolicy']
              assert [l.attrib['name'] for l in r.findall('layer')]==['Back','Buildings','Front']

          locked=[
              'src/Cardcha/assets/mimi_walk.png',
              'src/Cardcha/assets/airship_visual.png',
              'src/Cardcha/assets/airship_deck.tmx',
              'src/Cardcha/assets/sky_dock_interior.tmx',
              'src/Cardcha/assets/verdant_guardian_arena.tmx',
              'src/Cardcha/assets/boss2_hollow_curator_arena.tmx',
              'src/Cardcha/assets/boss3_tricolor_resonance_arena.tmx',
              'src/Cardcha/assets/boss4_mimi_resonance_arena.tmx',
          ]
          locked += [str(p) for p in sorted((root/'assets/bosses/milestone').glob('*.png'))]
          for p in locked:
              assert subprocess.run(['git','diff','--quiet','origin/cardcha-alpha28-0674-region3-region4-gameplay-foundation','--',p]).returncode==0, p

          checked=0
          for tmx in sorted((root/'assets').rglob('*.tmx')):
              r=ET.parse(tmx).getroot()
              for layer in r.findall('layer'):
                  data=layer.find('data')
                  if data is None or data.attrib.get('encoding')!='csv': continue
                  vals=[]
                  for i,token in enumerate((data.text or '').split(',')):
                      st=token.strip(); assert st!='', f'{tmx}: empty CSV token {i}'
                      n=int(st); assert 0<=n<=0xFFFFFFFF; vals.append(n)
                  assert len(vals)==int(layer.attrib['width'])*int(layer.attrib['height'])
                  checked+=1
          assert checked>=53

          handoff=Path('handoff/ALPHA28_0675_REGION3_REGION4_AUTHORED_VISUAL_PASS.md').read_text()
          latest=Path('handoff/LATEST_CARDCHA_HANDOFF.md').read_text()
          assert version in handoff and version in latest
          assert 'cardcha-alpha28-0675-region3-region4-authored-visual-pass' in latest
          print(f'0675 validator PASS; authoredEnemies=8 atlases=4 schema=19 cards=76/80 strictTMX={checked}')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.44 source assets handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.44 Region III IV authored visual pass [skip ci]'
            git push origin HEAD:cardcha-alpha28-0675-region3-region4-authored-visual-pass
          fi

      - name: Package .5.12.44 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.44_Region3Region4AuthoredVisualPass_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 - <<'PY'
          import json, zipfile
          z='Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.44_Region3Region4AuthoredVisualPass_TEST.zip'
          with zipfile.ZipFile(z) as f:
              names=set(f.namelist())
              manifest=json.loads(f.read('Cardcha/manifest.json'))
              dll=f.read('Cardcha/Cardcha.dll')
              assert manifest['Version']=='0.3.0-alpha.28.0.4.14.4.5.12.44'
              assert len(dll)>50000 and dll[:2]==b'MZ'
              for p in [
                  'Cardcha/assets/region3_mirrorwild.tmx','Cardcha/assets/region4_resonance_verge.tmx',
                  'Cardcha/assets/region3_mirrorwild_enemies.png','Cardcha/assets/region4_resonance_enemies.png',
                  'Cardcha/assets/region3_mirrorwild_decor.png','Cardcha/assets/region4_resonance_decor.png',
                  'Cardcha/assets/mimi_walk.png','Cardcha/i18n/default.json','Cardcha/i18n/vi.json'
              ]: assert p in names,p
              assert len(f.read('Cardcha/assets/mimi_walk.png'))==65167
          print('0675 final package audit PASS')
          PY

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0675-region3-region4-authored-visual-pass
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.44_Region3Region4AuthoredVisualPass_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.44_Region3Region4AuthoredVisualPass_TEST.zip.sha256
          if-no-files-found: error
