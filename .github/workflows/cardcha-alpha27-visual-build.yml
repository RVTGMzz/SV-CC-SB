name: Cardcha alpha27.0.7.3 MiMi attic map-load lag hotfix
on:
  push:
    branches: [ cardcha-alpha27-mimi-real-npc ]
    paths: [ '.github/workflows/cardcha-alpha27-visual-build.yml' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Prepare alpha27.0.7.3 attic hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 build_assets/make_mimi_attic_true_stardew_map.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          r = Path('src/Cardcha')

          # Fix the actual TMX failure path first. For unchanged vanilla tilesheets SMAPI's
          # documented convention is a dot-prefixed local reference, which falls back to
          # Content/Maps without treating "Maps/" as a relative subfolder of assets.
          tmx = r / 'assets/mimi_attic.tmx'
          root = ET.parse(tmx).getroot()
          image = root.find('./tileset/image')
          assert image is not None
          assert image.attrib.get('source') == '.townInterior.png', image.attrib
          assert root.attrib.get('width') == '22' and root.attrib.get('height') == '14'
          props = {p.attrib.get('name'): p.attrib.get('value') for p in root.findall('./properties/property')}
          assert props.get('CardchaAtticVersion') == 'alpha.27.0.7.3'

          # Critical lag guard: if attic creation throws, do NOT retry and dump a full exception
          # every game tick. Retry only after a save/day/title reset. This turns a broken attic
          # into one clean error instead of a 60-Hz exception storm.
          p = r / 'Services/MimiHomeService.cs'
          s = p.read_text()

          field_anchor = '''    private Point? CachedWizardStairTile;\n    private Point? CachedAtticStairTile;\n    private bool LoggedAtticCreation;\n'''
          field_new = '''    private Point? CachedWizardStairTile;\n    private Point? CachedAtticStairTile;\n    private bool LoggedAtticCreation;\n    private bool AtticCreationFailed;\n    private bool LoggedAtticFailure;\n'''
          if 'private bool AtticCreationFailed;' not in s:
              assert field_anchor in s
              s = s.replace(field_anchor, field_new, 1)

          save_anchor = '''    public void OnSaveLoaded()\n    {\n        this.CachedWizardStairTile = null;\n        this.CachedAtticStairTile = null;\n        this.EnsureAtticLocation();\n'''
          save_new = '''    public void OnSaveLoaded()\n    {\n        this.CachedWizardStairTile = null;\n        this.CachedAtticStairTile = null;\n        this.AtticCreationFailed = false;\n        this.LoggedAtticFailure = false;\n        this.EnsureAtticLocation();\n'''
          if save_new not in s:
              assert save_anchor in s
              s = s.replace(save_anchor, save_new, 1)

          day_anchor = '''    public void OnDayStarted()\n    {\n        this.CachedWizardStairTile = null;\n        this.CachedAtticStairTile = null;\n        this.EnsureAtticLocation();\n'''
          day_new = '''    public void OnDayStarted()\n    {\n        this.CachedWizardStairTile = null;\n        this.CachedAtticStairTile = null;\n        this.AtticCreationFailed = false;\n        this.LoggedAtticFailure = false;\n        this.EnsureAtticLocation();\n'''
          if day_new not in s:
              assert day_anchor in s
              s = s.replace(day_anchor, day_new, 1)

          title_anchor = '''        this.CachedWizardStairTile = null;\n        this.CachedAtticStairTile = null;\n        this.LoggedAtticCreation = false;\n'''
          title_new = '''        this.CachedWizardStairTile = null;\n        this.CachedAtticStairTile = null;\n        this.LoggedAtticCreation = false;\n        this.AtticCreationFailed = false;\n        this.LoggedAtticFailure = false;\n'''
          if title_new not in s:
              assert title_anchor in s
              s = s.replace(title_anchor, title_new, 1)

          ensure_anchor = '''        if (!Context.IsWorldReady)\n            return null;\n\n        GameLocation? existing = Game1.getLocationFromName(AtticLocationName);\n'''
          ensure_new = '''        if (!Context.IsWorldReady)\n            return null;\n\n        if (this.AtticCreationFailed)\n            return null;\n\n        GameLocation? existing = Game1.getLocationFromName(AtticLocationName);\n'''
          if ensure_new not in s:
              assert ensure_anchor in s
              s = s.replace(ensure_anchor, ensure_new, 1)

          catch_anchor = '''        catch (Exception ex)\n        {\n            this.Monitor.Log($"Couldn't create MiMi attic location: {ex}", LogLevel.Error);\n            return null;\n        }\n'''
          catch_new = '''        catch (Exception ex)\n        {\n            this.AtticCreationFailed = true;\n            if (!this.LoggedAtticFailure)\n            {\n                this.LoggedAtticFailure = true;\n                this.Monitor.Log(\n                    $"Couldn't create MiMi attic location. Further retries are suppressed until the next save/day reload to prevent an exception loop. {ex.GetType().Name}: {ex.Message}",\n                    LogLevel.Error\n                );\n            }\n            return null;\n        }\n'''
          if catch_new not in s:
              assert catch_anchor in s
              s = s.replace(catch_anchor, catch_new, 1)

          s = s.replace('alpha.27.0.7.1 true Stardew map with runtime-only TEST access', 'alpha.27.0.7.3 true Stardew map hotfix with guarded runtime access')
          p.write_text(s)
          assert 'Further retries are suppressed until the next save/day reload' in s
          assert 'if (this.AtticCreationFailed)' in s

          # Refresh runtime decor marker so an already-created test attic doesn't keep stale decor.
          p = r / 'Services/MimiAtticVisualService.cs'
          s = p.read_text().replace('private const string DecorVersion = "alpha.27.0.7";', 'private const string DecorVersion = "alpha.27.0.7.3";')
          p.write_text(s)

          # Version/log bump.
          p = r / 'ModEntry.cs'
          s = p.read_text()
          s = s.replace('v0.3.0-alpha.27.0.7.2 ASSET RESTORE + REVEAL CONTROLLER FIX TEST', 'v0.3.0-alpha.27.0.7.3 MIMI ATTIC MAP-LOAD LAG HOTFIX TEST')
          s = s.replace('v0.3.0-alpha.27.0.7.1 MIMI ATTIC TEST ACCESS', 'v0.3.0-alpha.27.0.7.3 MIMI ATTIC MAP-LOAD LAG HOTFIX TEST')
          p.write_text(s)

          p = r / 'Cardcha.csproj'
          s = p.read_text().replace('0.3.0-alpha.27.0.7.2', '0.3.0-alpha.27.0.7.3').replace('0.3.0-alpha.27.0.7.1', '0.3.0-alpha.27.0.7.3')
          p.write_text(s)

          p = r / 'Directory.Build.targets'
          s = p.read_text().replace('0.3.0-alpha.27.0.7.2', '0.3.0-alpha.27.0.7.3').replace('0.3.0-alpha.27.0.7.1', '0.3.0-alpha.27.0.7.3')
          s = s.replace('CardchaAlpha27072Manifest', 'CardchaAlpha27073Manifest').replace('CardchaAlpha27071Manifest', 'CardchaAlpha27073Manifest')
          p.write_text(s)

          p = r / 'manifest.json'
          d = json.loads(p.read_text(encoding='utf-8-sig'))
          d['Version'] = '0.3.0-alpha.27.0.7.3'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')

          # Preserve prior controller hotfix.
          reveal = (r / 'UI/CardchaRevealMenu.cs').read_text()
          assert reveal.count('this.IgnoreResultMouseUntilMs = Environment.TickCount64 + 220d;') >= 2
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Validate and package hotfix TEST
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha
          cp "$(find src/Cardcha/bin -name Cardcha.dll -print -quit)" stage/Cardcha/
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/

          test -s stage/Cardcha/Cardcha.dll
          test -f stage/Cardcha/assets/mimi_attic.tmx
          test ! -f stage/Cardcha/assets/mimi_attic_tiles.png
          grep -q 'source=".townInterior.png"' stage/Cardcha/assets/mimi_attic.tmx
          ! grep -q 'source="Maps/townInterior"' stage/Cardcha/assets/mimi_attic.tmx
          grep -q 'alpha.27.0.7.3' stage/Cardcha/assets/mimi_attic.tmx
          grep -q '0.3.0-alpha.27.0.7.3' stage/Cardcha/manifest.json

          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.27.0.7.3_MiMiAttic_MapLoadLagHotfix_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

      - name: Commit compiled milestone source
        shell: bash
        run: |
          set -euo pipefail
          git add src/Cardcha
          git config user.name ronvotri
          git config user.email lengochung28191@gmail.com
          git diff --cached --quiet || (git commit -m 'alpha27.0.7.3: fix MiMi attic map load and suppress retry storm' && git push origin cardcha-alpha27-mimi-real-npc)

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha27-mimi-attic-mapload-hotfix
          path: artifact
          if-no-files-found: error
