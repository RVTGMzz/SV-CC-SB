name: Cardcha alpha27.0.7.4 MiMi attic strict-TMX hotfix
on:
  push:
    branches: [ cardcha-alpha27-mimi-real-npc ]
    paths: [ '.github/workflows/cardcha-alpha27-visual-build.yml' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Prepare and validate alpha27.0.7.4 strict TMX
        shell: bash
        run: |
          set -euo pipefail
          python3 build_assets/make_mimi_attic_true_stardew_map.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          r = Path('src/Cardcha')
          tmx = r / 'assets/mimi_attic.tmx'
          root = ET.parse(tmx).getroot()

          width = int(root.attrib['width'])
          height = int(root.attrib['height'])
          assert (width, height) == (22, 14)

          image = root.find('./tileset/image')
          assert image is not None
          assert image.attrib.get('source') == '.townInterior.png', image.attrib

          props = {p.attrib.get('name'): p.attrib.get('value') for p in root.findall('./properties/property')}
          assert props.get('CardchaAtticVersion') == 'alpha.27.0.7.4'
          assert 'strict-csv' in props.get('CardchaVisualDirection', '')

          # Mirror TMXTile's strict comma splitting closely enough to catch the exact
          # FormatException seen in-game: every comma-delimited token must contain an integer.
          layers = root.findall('./layer')
          assert [layer.attrib.get('name') for layer in layers] == ['Back', 'Buildings', 'Front']
          expected = width * height
          for layer in layers:
              data = layer.find('data')
              assert data is not None and data.attrib.get('encoding') == 'csv'
              body = data.text or ''
              raw_tokens = body.split(',')
              tokens = [token.strip() for token in raw_tokens]
              assert all(token != '' for token in tokens), f"empty CSV token in {layer.attrib['name']}"
              values = [int(token, 10) for token in tokens]
              assert len(values) == expected, f"{layer.attrib['name']}: {len(values)} != {expected}"
              assert all(0 <= value <= 0xFFFFFFFF for value in values)
              print(f"TMX CSV PASS {layer.attrib['name']}: {len(values)} integer tiles")

          # Keep the anti-lag guard from 0.7.3.
          home = (r / 'Services/MimiHomeService.cs').read_text()
          assert 'private bool AtticCreationFailed;' in home
          assert 'if (this.AtticCreationFailed)' in home
          assert 'Further retries are suppressed until the next save/day reload' in home
          home = home.replace(
              'alpha.27.0.7.3 true Stardew map hotfix with guarded runtime access',
              'alpha.27.0.7.4 strict-TMX map hotfix with guarded runtime access'
          )
          (r / 'Services/MimiHomeService.cs').write_text(home)

          # Refresh runtime decor marker.
          p = r / 'Services/MimiAtticVisualService.cs'
          s = p.read_text().replace(
              'private const string DecorVersion = "alpha.27.0.7.3";',
              'private const string DecorVersion = "alpha.27.0.7.4";'
          )
          p.write_text(s)

          # Version/log bump.
          p = r / 'ModEntry.cs'
          s = p.read_text().replace(
              'v0.3.0-alpha.27.0.7.3 MIMI ATTIC MAP-LOAD LAG HOTFIX TEST',
              'v0.3.0-alpha.27.0.7.4 MIMI ATTIC STRICT-TMX HOTFIX TEST'
          )
          p.write_text(s)

          p = r / 'Cardcha.csproj'
          p.write_text(p.read_text().replace('0.3.0-alpha.27.0.7.3', '0.3.0-alpha.27.0.7.4'))

          p = r / 'Directory.Build.targets'
          s = p.read_text().replace('0.3.0-alpha.27.0.7.3', '0.3.0-alpha.27.0.7.4')
          s = s.replace('CardchaAlpha27073Manifest', 'CardchaAlpha27074Manifest')
          p.write_text(s)

          p = r / 'manifest.json'
          d = json.loads(p.read_text(encoding='utf-8-sig'))
          d['Version'] = '0.3.0-alpha.27.0.7.4'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')

          # Preserve controller duplicate-click fix from 0.7.2.
          reveal = (r / 'UI/CardchaRevealMenu.cs').read_text()
          assert reveal.count('this.IgnoreResultMouseUntilMs = Environment.TickCount64 + 220d;') >= 2
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Validate packaged TMX and build TEST ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha
          cp "$(find src/Cardcha/bin -name Cardcha.dll -print -quit)" stage/Cardcha/
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/

          test -s stage/Cardcha/Cardcha.dll
          test -f stage/Cardcha/assets/mimi_attic.tmx
          test ! -f stage/Cardcha/assets/mimi_attic_tiles.png
          grep -q 'source=".townInterior.png"' stage/Cardcha/assets/mimi_attic.tmx
          grep -q 'alpha.27.0.7.4' stage/Cardcha/assets/mimi_attic.tmx
          grep -q '0.3.0-alpha.27.0.7.4' stage/Cardcha/manifest.json

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p = 'stage/Cardcha/assets/mimi_attic.tmx'
          root = ET.parse(p).getroot()
          expected = int(root.attrib['width']) * int(root.attrib['height'])
          for layer in root.findall('./layer'):
              body = (layer.find('data').text or '')
              tokens = [x.strip() for x in body.split(',')]
              assert all(tokens)
              assert len(tokens) == expected
              [int(x, 10) for x in tokens]
          print('Packaged TMX strict CSV validation PASS')
          PY

          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.27.0.7.4_MiMiAttic_StrictTMXHotfix_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

      - name: Commit compiled milestone source
        shell: bash
        run: |
          set -euo pipefail
          git add src/Cardcha
          git config user.name ronvotri
          git config user.email lengochung28191@gmail.com
          git diff --cached --quiet || (git commit -m 'alpha27.0.7.4: fix strict TMX CSV parsing' && git push origin cardcha-alpha27-mimi-real-npc)

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha27-mimi-attic-strict-tmx-hotfix
          path: artifact
          if-no-files-found: error
