name: Cardcha alpha27.0.7.2 asset regression and reveal controller fix
on:
  push:
    branches: [ cardcha-alpha27-mimi-real-npc ]
    paths: [ '.github/workflows/cardcha-alpha27-visual-build.yml' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Prepare alpha27.0.7.2 controller fix
        shell: bash
        run: |
          set -euo pipefail
          python3 build_assets/make_mimi_attic_true_stardew_map.py
          python3 - <<'PY'
          from pathlib import Path
          import json

          r = Path('src/Cardcha')

          # Keep the 0.7.1 attic test bypass and true-Stardew map intact.
          home = (r / 'Services/MimiHomeService.cs').read_text()
          visual = (r / 'Services/MimiAtticVisualService.cs').read_text()
          entry = (r / 'ModEntry.cs').read_text()
          assert 'DebugToggleAtticAccess' in home
          assert 'TestAccessActive' in visual
          assert 'cardcha_test_attic' in entry

          # Controller regression: some runtimes synthesize a mouse click after a gamepad
          # confirm. Mouse activation works, but that duplicate click immediately closes the
          # detail overlay the controller just opened. Suppress the duplicate after activating
          # a result, using the same guard already used when closing detail with a controller.
          p = r / 'UI/CardchaRevealMenu.cs'
          s = p.read_text()
          old = '''                this.RevealResult(resultIndex);\n                this.currentlySnappedComponent = this.ResultButtons[resultIndex];\n'''
          new = '''                this.RevealResult(resultIndex);\n                this.IgnoreResultMouseUntilMs = Environment.TickCount64 + 220d;\n                this.currentlySnappedComponent = this.ResultButtons[resultIndex];\n'''
          if new not in s:
              assert old in s, 'RevealResult controller anchor changed unexpectedly'
              s = s.replace(old, new, 1)
          p.write_text(s)
          assert 'this.IgnoreResultMouseUntilMs = Environment.TickCount64 + 220d;' in s
          assert s.count('this.IgnoreResultMouseUntilMs = Environment.TickCount64 + 220d;') >= 2

          # Version/log bump only; canonical user-supplied PNGs are injected into the final
          # TEST artifact after CI compile and verified byte-for-byte before handoff.
          p = r / 'ModEntry.cs'
          s = p.read_text().replace(
              'v0.3.0-alpha.27.0.7.1 MIMI ATTIC TEST ACCESS',
              'v0.3.0-alpha.27.0.7.2 ASSET RESTORE + REVEAL CONTROLLER FIX TEST'
          )
          p.write_text(s)

          p = r / 'Cardcha.csproj'
          s = p.read_text().replace('0.3.0-alpha.27.0.7.1', '0.3.0-alpha.27.0.7.2')
          p.write_text(s)

          p = r / 'Directory.Build.targets'
          s = p.read_text().replace('0.3.0-alpha.27.0.7.1', '0.3.0-alpha.27.0.7.2').replace('CardchaAlpha27071Manifest', 'CardchaAlpha27072Manifest')
          p.write_text(s)

          p = r / 'manifest.json'
          d = json.loads(p.read_text(encoding='utf-8-sig'))
          d['Version'] = '0.3.0-alpha.27.0.7.2'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Package controller-fixed TEST base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha
          cp "$(find src/Cardcha/bin -name Cardcha.dll -print -quit)" stage/Cardcha/
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/
          test -f stage/Cardcha/assets/mimi_attic.tmx
          test ! -f stage/Cardcha/assets/mimi_attic_tiles.png
          grep -q 'Maps/townInterior' stage/Cardcha/assets/mimi_attic.tmx
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.27.0.7.2_ControllerFixed_BASE.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

      - name: Commit compiled milestone source
        shell: bash
        run: |
          set -euo pipefail
          git add src/Cardcha
          git config user.name ronvotri
          git config user.email lengochung28191@gmail.com
          git diff --cached --quiet || (git commit -m 'alpha27.0.7.2: fix reveal controller duplicate click' && git push origin cardcha-alpha27-mimi-real-npc)

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha27-controller-fixed-base
          path: artifact
          if-no-files-found: error
