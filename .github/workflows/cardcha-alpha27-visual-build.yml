name: Cardcha alpha27.0.5 attic custom interior
on:
  push:
    branches: [ cardcha-alpha27-mimi-real-npc ]
    paths: [ '.github/workflows/cardcha-alpha27-visual-build.yml' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Prepare alpha27.0.5 custom attic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, struct, xml.etree.ElementTree as ET

          r = Path('src/Cardcha')
          png = r / 'assets/mimi_attic_tiles.png'
          tmx = r / 'assets/mimi_attic.tmx'
          assert png.exists() and tmx.exists(), 'custom attic assets missing'
          raw = png.read_bytes()
          assert raw.startswith(b'\x89PNG\r\n\x1a\n'), 'attic tiles is not PNG'
          width, height = struct.unpack('>II', raw[16:24])
          assert (width, height) == (352, 224), (width, height)

          root = ET.parse(tmx).getroot()
          assert root.attrib.get('width') == '22' and root.attrib.get('height') == '14'
          assert [x.attrib.get('name') for x in root.findall('layer')] == ['Back', 'Buildings', 'Front']

          p = r / 'Services/MimiHomeService.cs'
          s = p.read_text()
          s = s.replace('private const string AtticMapPath = "Maps/Shed";', 'private const string AtticMapPath = "Maps/Cardcha_MiMiAttic";')
          s = s.replace('using the alpha.27 safe interior map foundation.', 'using the alpha.27.0.5 custom interior map.')
          p.write_text(s)
          assert 'private const string AtticMapPath = "Maps/Cardcha_MiMiAttic";' in s

          p = r / 'ModEntry.cs'
          s = p.read_text()
          anchor = '        helper.Events.Content.AssetRequested += this.Social.OnAssetRequested;\n'
          hook = '        helper.Events.Content.AssetRequested += this.AtticVisual.OnAssetRequested;\n'
          if hook not in s:
              s = s.replace(anchor, anchor + hook, 1)
          s = s.replace('v0.3.0-alpha.27.0.4 MIMI ATTIC VISUAL FOUNDATION TEST', 'v0.3.0-alpha.27.0.5 MIMI ATTIC CUSTOM INTERIOR TEST')
          p.write_text(s)
          assert hook in s

          p = r / 'Cardcha.csproj'
          s = p.read_text().replace('0.3.0-alpha.27.0.4', '0.3.0-alpha.27.0.5')
          p.write_text(s)

          p = r / 'Directory.Build.targets'
          s = p.read_text().replace('0.3.0-alpha.27.0.4', '0.3.0-alpha.27.0.5').replace('CardchaAlpha2704Manifest', 'CardchaAlpha2705Manifest')
          p.write_text(s)

          p = r / 'manifest.json'
          d = json.loads(p.read_text(encoding='utf-8-sig'))
          d['Version'] = '0.3.0-alpha.27.0.5'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')

          visual = (r / 'Services/MimiAtticVisualService.cs').read_text()
          assert 'AtticMapAssetName = "Maps/Cardcha_MiMiAttic"' in visual
          assert 'LoadFromModFile<xTile.Map>' in visual
          assert 'IsSecretTvRoutineEligible' in visual
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Package TEST
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha
          cp "$(find src/Cardcha/bin -name Cardcha.dll -print -quit)" stage/Cardcha/
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/
          test -f stage/Cardcha/assets/mimi_attic.tmx
          test -f stage/Cardcha/assets/mimi_attic_tiles.png
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.27.0.5_MiMiAttic_CustomInterior_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

      - name: Commit compiled milestone source
        shell: bash
        run: |
          set -euo pipefail
          git add src/Cardcha
          git config user.name ronvotri
          git config user.email lengochung28191@gmail.com
          git diff --cached --quiet || (git commit -m 'alpha27.0.5: build MiMi attic custom interior' && git push origin cardcha-alpha27-mimi-real-npc)

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha27-attic-custom-interior
          path: artifact
          if-no-files-found: error
