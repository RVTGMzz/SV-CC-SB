name: Cardcha alpha27.0.7 true Stardew attic map
on:
  push:
    branches: [ cardcha-alpha27-mimi-real-npc ]
    paths: [ '.github/workflows/cardcha-alpha27-visual-build.yml' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Prepare alpha27.0.7 true Stardew attic
        shell: bash
        run: |
          set -euo pipefail
          python3 build_assets/make_mimi_attic_true_stardew_map.py
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET

          r = Path('src/Cardcha')
          tmx = r / 'assets/mimi_attic.tmx'
          old_png = r / 'assets/mimi_attic_tiles.png'
          assert tmx.exists(), 'true Stardew attic TMX missing'
          assert not old_png.exists(), '0.6 room-sized PNG must not ship in 0.7'

          root = ET.parse(tmx).getroot()
          assert root.attrib.get('width') == '22' and root.attrib.get('height') == '14'
          assert [x.attrib.get('name') for x in root.findall('layer')] == ['Back', 'Buildings', 'Front']
          props = {p.attrib.get('name'): p.attrib.get('value') for p in root.find('properties').findall('property')}
          assert props.get('CardchaAtticVersion') == 'alpha.27.0.7'
          assert props.get('CardchaVisualDirection') == 'true-stardew-map|vanilla-townInterior|vanilla-furniture-runtime'
          image = root.find('tileset/image')
          assert image is not None and image.attrib.get('source') == 'Maps/townInterior'

          p = r / 'Services/MimiAtticVisualService.cs'
          s = p.read_text()
          assert 'EnsureVanillaFurniture' in s
          assert 'ItemRegistry.Create<Furniture>' in s
          assert 'DecorVersion = "alpha.27.0.7"' in s
          assert '(F)2058' in s and '(F)1466' in s and '(F)432' in s

          p = r / 'Services/MimiHomeService.cs'
          s = p.read_text()
          s = s.replace('using the alpha.27.0.6 vanilla-style custom interior map.', 'using the alpha.27.0.7 true Stardew tile/furniture map.')
          p.write_text(s)
          assert 'private const string AtticMapPath = "Maps/Cardcha_MiMiAttic";' in s

          p = r / 'ModEntry.cs'
          s = p.read_text()
          s = s.replace(
              'v0.3.0-alpha.27.0.6 MIMI ATTIC VANILLA STYLE REWORK TEST',
              'v0.3.0-alpha.27.0.7 MIMI ATTIC TRUE STARDEW MAP TEST'
          )
          p.write_text(s)

          p = r / 'Cardcha.csproj'
          s = p.read_text().replace('0.3.0-alpha.27.0.6', '0.3.0-alpha.27.0.7')
          p.write_text(s)

          p = r / 'Directory.Build.targets'
          s = p.read_text().replace('0.3.0-alpha.27.0.6', '0.3.0-alpha.27.0.7').replace('CardchaAlpha2706Manifest', 'CardchaAlpha2707Manifest')
          p.write_text(s)

          p = r / 'manifest.json'
          d = json.loads(p.read_text(encoding='utf-8-sig'))
          d['Version'] = '0.3.0-alpha.27.0.7'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Package TEST
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha
          cp "$(find src/Cardcha/bin -name Cardcha.dll -print -quit)" stage/Cardcha/
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/
          test -f stage/Cardcha/assets/mimi_attic.tmx
          test ! -f stage/Cardcha/assets/mimi_attic_tiles.png
          grep -q 'Maps/townInterior' stage/Cardcha/assets/mimi_attic.tmx
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.27.0.7_MiMiAttic_TrueStardewMap_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

      - name: Commit compiled milestone source
        shell: bash
        run: |
          set -euo pipefail
          git add src/Cardcha
          git config user.name ronvotri
          git config user.email lengochung28191@gmail.com
          git diff --cached --quiet || (git commit -m 'alpha27.0.7: build true Stardew MiMi attic map' && git push origin cardcha-alpha27-mimi-real-npc)

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha27-attic-true-stardew-map
          path: artifact
          if-no-files-found: error
