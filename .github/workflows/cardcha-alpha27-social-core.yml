name: Cardcha alpha27 MiMi social core

on:
  push:
    branches: [ cardcha-alpha27-mimi-real-npc ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'alpha27: wire MiMi real NPC social core') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alpha27 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire alpha27 social core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('src/Cardcha')
          p = root / 'ModEntry.cs'
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing patch anchor: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              '    private MimiMysteryTownService Mystery = null!;\n    private WorldActorService WorldActors = null!;',
              '    private MimiMysteryTownService Mystery = null!;\n    private MimiSocialService Social = null!;\n    private WorldActorService WorldActors = null!;',
              'field'
          )

          replace_once(
              '''        this.Mystery = new MimiMysteryTownService(\n            helper,\n            this.Monitor,\n            this.Save,\n            this.OpenMimiShop,\n            this.WorldActors,\n            () => this.Story.OwnsMimiWorldActor\n        );\n''',
              '''        this.Mystery = new MimiMysteryTownService(\n            helper,\n            this.Monitor,\n            this.Save,\n            this.OpenMimiShop,\n            this.WorldActors,\n            () => this.Story.OwnsMimiWorldActor\n        );\n        this.Social = new MimiSocialService(\n            helper,\n            this.Monitor,\n            this.Save,\n            this.WorldActors,\n            this.OpenMimiShop\n        );\n''',
              'construction'
          )

          replace_once(
              '        helper.Events.Content.AssetRequested += this.Mystery.OnAssetRequested;\n',
              '        helper.Events.Content.AssetRequested += this.Mystery.OnAssetRequested;\n        helper.Events.Content.AssetRequested += this.Social.OnAssetRequested;\n',
              'asset event'
          )

          replace_once(
              '        helper.Events.Input.ButtonPressed += this.BookTab.OnButtonPressed;\n        helper.Events.Input.ButtonPressed += this.Mystery.OnButtonPressed;\n',
              '        helper.Events.Input.ButtonPressed += this.BookTab.OnButtonPressed;\n        helper.Events.Input.ButtonPressed += this.Social.OnButtonPressed;\n        helper.Events.Input.ButtonPressed += this.Mystery.OnButtonPressed;\n',
              'button event'
          )

          replace_once(
              '        this.Story.OnSaveLoaded();\n        this.Mystery.OnSaveLoaded();\n',
              '        this.Story.OnSaveLoaded();\n        this.Mystery.OnSaveLoaded();\n        this.Social.OnSaveLoaded();\n',
              'save loaded'
          )

          replace_once(
              '        this.Story.OnDayStarted();\n        this.Mystery.OnDayStarted();\n',
              '        this.Story.OnDayStarted();\n        this.Mystery.OnDayStarted();\n        this.Social.OnDayStarted();\n',
              'day started'
          )

          replace_once(
              '        this.Story.OnUpdateTicked(sender, e);\n        this.Mystery.OnUpdateTicked();\n',
              '        this.Story.OnUpdateTicked(sender, e);\n        this.Mystery.OnUpdateTicked();\n        this.Social.OnUpdateTicked(e);\n',
              'update ticked'
          )

          replace_once(
              '        this.Story.OnReturnedToTitle();\n        this.Mystery.OnReturnedToTitle();\n',
              '        this.Story.OnReturnedToTitle();\n        this.Mystery.OnReturnedToTitle();\n        this.Social.OnReturnedToTitle();\n',
              'returned title'
          )

          replace_once(
              '            this.Story.Describe() + "\\n" +\n            this.Mystery.Describe() + "\\n" +\n            this.PortableMachine.Describe(),',
              '            this.Story.Describe() + "\\n" +\n            this.Mystery.Describe() + "\\n" +\n            this.Social.Describe() + "\\n" +\n            this.PortableMachine.Describe(),',
              'story status'
          )

          s = s.replace(
              'Cardcha! v0.3.0-alpha.26.5 CORE COMPLETION HOTFIX with',
              'Cardcha! v0.3.0-alpha.27.0.1 MIMI REAL NPC SOCIAL CORE with'
          )
          s = s.replace(
              'Cardcha! v0.3.0-alpha.26.5 CORE COMPLETION HOTFIX',
              'Cardcha! v0.3.0-alpha.27.0.1 MIMI REAL NPC SOCIAL CORE'
          )
          p.write_text(s, encoding='utf-8')

          # Version pinning.
          for rel in ['Cardcha.csproj', 'Directory.Build.targets']:
              q = root / rel
              text = q.read_text(encoding='utf-8')
              text = text.replace('0.3.0-alpha.26.5.3', '0.3.0-alpha.27.0.1')
              text = text.replace('CardchaAlpha2652Manifest', 'CardchaAlpha2701Manifest')
              q.write_text(text, encoding='utf-8')

          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
          manifest['Version'] = '0.3.0-alpha.27.0.1'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          en = {
            'mimi.social.introduction': "So we're officially acquainted now. Try not to make it sound too respectable.",
            'mimi.social.mon': "I had three plans for today. ChaCha ate one of them. Don't ask how.",
            'mimi.social.tue': "People keep calling this a job. I prefer 'profitable wandering'.",
            'mimi.social.wed': "If I look busy, I'm probably avoiding something even busier.",
            'mimi.social.thu': "You know, cardboard has remarkable emotional range. Mostly disappointment.",
            'mimi.social.fri': "Friday already? Good. I was running out of convincing excuses.",
            'mimi.social.sat': "No shop today. Even mysterious merchants need to disappear professionally.",
            'mimi.social.sun': "Wizard says I should rest. I am resting very aggressively.",
            'mimi.social.rain': "Rain is excellent for staying indoors and pretending that was the plan all along.",
            'mimi.social.birthday': "You remembered Spring 17? ...I was absolutely going to remember yours too. Probably.$h",
            'mimi.gift.love': "Oh... that's actually perfect. Don't look so pleased with yourself.$h",
            'mimi.gift.like': "Useful, strange, or shiny. You are learning my highly scientific standards.$h",
            'mimi.gift.neutral': "Thanks. I'll put it somewhere ChaCha can't immediately investigate.",
            'mimi.gift.dislike': "Ah. A gift. Definitely a gift. I can confirm that much.$s",
            'mimi.gift.hate': "I have questions. Most of them begin with 'why'. $a"
          }
          vi = {
            'mimi.social.introduction': "Vậy là giờ tụi mình chính thức quen nhau rồi. Đừng làm chuyện này nghe đứng đắn quá nha.",
            'mimi.social.mon': "Hôm nay tui có ba kế hoạch. ChaCha ăn mất một cái rồi. Đừng hỏi bằng cách nào.",
            'mimi.social.tue': "Mọi người cứ gọi đây là công việc. Tui thích gọi là 'đi lang thang có lợi nhuận' hơn.",
            'mimi.social.wed': "Nếu thấy tui có vẻ bận, khả năng cao là tui đang né một chuyện còn bận hơn.",
            'mimi.social.thu': "Bạn biết không, bìa cứng có đời sống cảm xúc phong phú lắm. Chủ yếu là thất vọng.",
            'mimi.social.fri': "Thứ Sáu rồi hả? Tốt. Tui sắp hết lý do nghe cho có vẻ thuyết phục rồi.",
            'mimi.social.sat': "Hôm nay nghỉ bán. Thương nhân bí ẩn cũng phải biến mất cho chuyên nghiệp chứ.",
            'mimi.social.sun': "Pháp Sư bảo tui nên nghỉ ngơi. Tui đang nghỉ ngơi cực kỳ quyết liệt đây.",
            'mimi.social.rain': "Mưa rất hợp để ở trong nhà rồi giả vờ như ngay từ đầu mình đã tính vậy.",
            'mimi.social.birthday': "Bạn nhớ Xuân 17 luôn hả? ...Tui cũng chắc chắn sẽ nhớ sinh nhật bạn. Chắc vậy.$h",
            'mimi.gift.love': "Ồ... cái này thật sự đúng ý tui. Đừng có nhìn đắc ý vậy chứ.$h",
            'mimi.gift.like': "Hữu dụng, kỳ quặc hoặc lấp lánh. Bạn đang hiểu tiêu chuẩn cực kỳ khoa học của tui rồi đó.$h",
            'mimi.gift.neutral': "Cảm ơn nha. Tui sẽ cất ở đâu đó ChaCha chưa kịp điều tra ngay.",
            'mimi.gift.dislike': "À. Quà. Chắc chắn là quà. Ít nhất chuyện đó thì tui xác nhận được.$s",
            'mimi.gift.hate': "Tui có vài câu hỏi. Hầu hết đều bắt đầu bằng 'tại sao'. $a"
          }

          for rel, additions in [('i18n/default.json', en), ('i18n/vi.json', vi)]:
              q = root / rel
              data = json.loads(q.read_text(encoding='utf-8-sig'))
              data.update(additions)
              q.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Static contract checks before compilation.
          assert (root/'Services'/'MimiSocialService.cs').exists()
          mod = (root/'ModEntry.cs').read_text(encoding='utf-8')
          for needle in ['MimiSocialService Social', 'this.Social.OnButtonPressed', 'this.Social.OnUpdateTicked(e)', 'this.Social.Describe()']:
              assert needle in mod, needle
          social = (root/'Services'/'MimiSocialService.cs').read_text(encoding='utf-8')
          for needle in ['BirthDay", 17', 'Data/NPCGiftTastes', 'TalkedToToday', 'new Friendship()', 'MimiMeetupCompleted']:
              assert needle in social, needle
          print('alpha27 social core patch PASS')
          PY

      - name: Add SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build alpha27
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/Cardcha/Cardcha.csproj --configuration Release -p:EnableModDeploy=false -p:EnableModZip=false
          DLL="$(find src/Cardcha/bin -name Cardcha.dll -print -quit)"
          test -n "$DLL"
          echo "Compiled $DLL"

      - name: Package TEST build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha
          cp "$(find src/Cardcha/bin -name Cardcha.dll -print -quit)" stage/Cardcha/Cardcha.dll
          PDB="$(find src/Cardcha/bin -name Cardcha.pdb -print -quit || true)"
          if [ -n "$PDB" ]; then cp "$PDB" stage/Cardcha/Cardcha.pdb; fi
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.27.0.1_MiMiRealNPC_SocialCore_TEST.zip Cardcha)
          tar -cJf artifact/Cardcha_v0.3.0-alpha.27.0.1_SOURCE.tar.xz \
            --exclude='src/Cardcha/bin' --exclude='src/Cardcha/obj' src/Cardcha
          sha256sum artifact/Cardcha_v0.3.0-alpha.27.0.1_MiMiRealNPC_SocialCore_TEST.zip | tee artifact/SHA256.txt

      - name: Commit alpha27 source
        shell: bash
        run: |
          set -euo pipefail
          git add src/Cardcha
          git config user.name 'ronvotri'
          git config user.email 'lengochung28191@gmail.com'
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'alpha27: wire MiMi real NPC social core'
            git push origin cardcha-alpha27-mimi-real-npc
          fi

      - name: Upload alpha27 TEST
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha27-social-core
          path: artifact
          if-no-files-found: error
