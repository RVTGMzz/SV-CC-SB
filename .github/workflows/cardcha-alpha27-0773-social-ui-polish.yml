name: Cardcha alpha27.0.7.7.3 social + inventory UI polish

on:
  push:
    branches: [ cardcha-alpha27-mimi-real-npc ]
    paths:
      - '.github/workflows/cardcha-alpha27-0773-social-ui-polish.yml'
      - 'build_assets/apply_0773.py'
      - 'src/Cardcha/UI/CardchaBinderMenu.cs'
      - 'src/Cardcha/UI/CardchaBookTabService.cs'
      - 'src/Cardcha/Services/WorldActorService.cs'
      - 'src/Cardcha/Patches/MimiProfileMenuPatch.cs'
      - 'src/Cardcha/assets/mimi_broom.png'
      - 'src/Cardcha/assets/mimi_walk_runtime.png'
      - 'src/Cardcha/assets/mimi_social_mugshot.png'
      - 'src/Cardcha/assets/mimi_profile.png'
      - 'src/Cardcha/Cardcha.csproj'
      - 'src/Cardcha/Directory.Build.targets'
      - 'src/Cardcha/manifest.json'
      - 'src/Cardcha/ModEntry.cs'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Apply 0.7.7.3 candidate
        run: python3 build_assets/apply_0773.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json

          r = Path('src/Cardcha')
          target = '0.3.0-alpha.27.0.7.7.3'
          walk_hash = '04ff1cbf031c2be0a21f114b8f8eb6f8850bb800eeabd4c27df036d7b23d4fb7'

          assert json.loads((r/'manifest.json').read_text())['Version'] == target
          assert target in (r/'Cardcha.csproj').read_text()
          assert target in (r/'Directory.Build.targets').read_text()
          assert target in (r/'ModEntry.cs').read_text()

          assert 'binder.status.preview' not in (r/'UI/CardchaBinderMenu.cs').read_text()
          book = (r/'UI/CardchaBookTabService.cs').read_text()
          assert 'return GetGraphOwner(gameMenu) is InventoryPage;' in book

          actor = (r/'Services/WorldActorService.cs').read_text()
          assert 'int spriteWidth = broom ? 48 : 32;' in actor
          assert 'MimiProfileCharacterAsset' in actor
          assert 'MimiProfileSheetPath' in actor
          assert 'MimiProfileMenuPatch.Apply(harmony);' in (r/'ModEntry.cs').read_text()

          assert Image.open(r/'assets/mimi_broom.png').size == (192, 192)
          assert Image.open(r/'assets/mimi_walk.png').size == (128, 192)
          assert Image.open(r/'assets/mimi_walk_runtime.png').size == (128, 216)
          assert Image.open(r/'assets/mimi_social_mugshot.png').size == (16, 24)
          assert Image.open(r/'assets/mimi_profile.png').size == (128, 192)

          walk = Image.open(r/'assets/mimi_walk.png').convert('RGBA')
          runtime = Image.open(r/'assets/mimi_walk_runtime.png').convert('RGBA')
          mug = Image.open(r/'assets/mimi_social_mugshot.png').convert('RGBA')
          assert runtime.crop((0, 0, 128, 192)).tobytes() == walk.tobytes()
          assert runtime.crop((0, 192, 16, 216)).tobytes() == mug.tobytes()
          assert hashlib.sha256((r/'assets/mimi_walk.png').read_bytes()).hexdigest() == walk_hash
          print('0.7.7.3 static validation PASS')
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Post-build version validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          r = Path('src/Cardcha')
          target = '0.3.0-alpha.27.0.7.7.3'
          assert json.loads((r/'manifest.json').read_text())['Version'] == target
          print('post-build manifest version PASS:', target)
          PY

      - name: Package TEST and canonical source payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact/canonical-src/UI artifact/canonical-src/Services artifact/canonical-src/Patches artifact/canonical-src/assets stage/Cardcha

          cp "$(find src/Cardcha/bin -name Cardcha.dll -print -quit)" stage/Cardcha/
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/

          cp src/Cardcha/UI/CardchaBinderMenu.cs artifact/canonical-src/UI/
          cp src/Cardcha/UI/CardchaBookTabService.cs artifact/canonical-src/UI/
          cp src/Cardcha/Services/WorldActorService.cs artifact/canonical-src/Services/
          cp src/Cardcha/Patches/MimiProfileMenuPatch.cs artifact/canonical-src/Patches/
          cp src/Cardcha/assets/mimi_broom.png artifact/canonical-src/assets/
          cp src/Cardcha/assets/mimi_walk_runtime.png artifact/canonical-src/assets/
          cp src/Cardcha/assets/mimi_social_mugshot.png artifact/canonical-src/assets/
          cp src/Cardcha/assets/mimi_profile.png artifact/canonical-src/assets/
          cp src/Cardcha/Cardcha.csproj src/Cardcha/Directory.Build.targets src/Cardcha/manifest.json src/Cardcha/ModEntry.cs artifact/canonical-src/

          test -s stage/Cardcha/Cardcha.dll
          test -f stage/Cardcha/assets/mimi_attic.tmx
          test -f stage/Cardcha/assets/mimi_walk.png
          test -f stage/Cardcha/assets/mimi_profile.png

          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.27.0.7.7.3_SocialInventoryUiPolish_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha27-0773-social-inventory-ui-polish
          path: artifact
          if-no-files-found: error
