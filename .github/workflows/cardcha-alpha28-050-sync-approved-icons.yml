name: Cardcha alpha28.0.4.10 approved icon sync

on:
  push:
    branches: [ cardcha-alpha28-050-magic-dust-ui-airship-fix ]

permissions:
  contents: write

jobs:
  inspect-source-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export candidate atlas without modifying it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          git fetch origin cardcha-alpha28-050-magical-girl-icons:refs/remotes/origin/cardcha-alpha28-050-magical-girl-icons
          git show origin/cardcha-alpha28-050-magical-girl-icons:src/Cardcha/assets/card_icons.png > artifact/card_icons_candidate.png
          sha256sum artifact/card_icons_candidate.png | tee artifact/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-050-candidate-icon-atlas
          path: artifact
          if-no-files-found: error
