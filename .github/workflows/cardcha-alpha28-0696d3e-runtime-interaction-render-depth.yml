name: Cardcha 0696D3-E Runtime Interaction Render Depth TEST

on:
  workflow_dispatch:
  push:
    branches:
      - cardcha-alpha28-0696d2-window-environment-matrix
    paths:
      - src/Cardcha/Patches/AirshipGateDepthPatch.cs
      - src/Cardcha/Patches/WorldPhysicalOverlaySafetyPatch.cs
      - src/Cardcha/Services/AirshipAmbientAnimationService.cs
      - src/Cardcha/Services/AirshipFoundationService.cs
      - src/Cardcha/ModEntry.cs
      - tools/alpha28_0696d3e_runtime_interaction_render_depth.py
      - tools/alpha28_0696d3e_package_audit.py
      - .github/workflows/cardcha-alpha28-0696d3e-runtime-interaction-render-depth.yml

permissions:
  contents: read

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout D3-E branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup deterministic image tooling
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Run historical D3-D regression baseline
        run: python3 tools/alpha28_0696d3d_regression.py

      - name: Run D3-E runtime interaction and render-depth validator
        run: python3 tools/alpha28_0696d3e_runtime_interaction_render_depth.py

      - name: Validate no legacy Window overlay reuse
        run: python3 tools/validate_0696d2_no_legacy_overlay_reuse.py

      - name: Validate render-depth contract
        run: python3 tools/validate_render_depth_contract.py

      - name: Prove validators did not mutate production inputs
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- \
            src/Cardcha/assets/airship_deck.tmx \
            src/Cardcha/assets/sky_dock_interior.tmx \
            src/Cardcha/Services/AirshipFoundationService.cs \
            src/Cardcha/Services/AirshipAmbientAnimationService.cs \
            src/Cardcha/Patches/AirshipGateDepthPatch.cs \
            src/Cardcha/Patches/WorldPhysicalOverlaySafetyPatch.cs

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha Release
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Package D3-E .70 TEST
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION='0.3.0-alpha.28.0.4.14.4.5.12.70'
          ZIP="Cardcha_v${VERSION}_0696D3E_RuntimeInteractionRenderDepthFix_TEST.zip"
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name Cardcha.dll | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 "$GITHUB_WORKSPACE/tools/alpha28_0696d3e_package_audit.py" \
            "$ZIP" \
            --report "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3E_PACKAGE_AUDIT.json"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload D3-E .70 TEST and validation evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0696D3E-runtime-interaction-render-depth-test
          if-no-files-found: error
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.70_0696D3E_RuntimeInteractionRenderDepthFix_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.70_0696D3E_RuntimeInteractionRenderDepthFix_TEST.zip.sha256
            handoff/AIRSHIP_0696D3D_REGRESSION_VALIDATION.json
            handoff/AIRSHIP_0696D3E_RUNTIME_INTERACTION_RENDER_DEPTH_VALIDATION.json
            handoff/AIRSHIP_0696D3E_PACKAGE_AUDIT.json

      - name: Record D3-E CI identity evidence
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ZIP_NAME: ${{ steps.package.outputs.zip }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path(os.environ['GITHUB_WORKSPACE'])
          package = root / 'package' / os.environ['ZIP_NAME']
          evidence = {
              'phase': '0696D3-E-ci-evidence',
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'sourceCommit': os.environ['GITHUB_SHA'],
              'artifactId': os.environ['ARTIFACT_ID'],
              'artifactDigest': os.environ['ARTIFACT_DIGEST'],
              'artifactUrl': os.environ['ARTIFACT_URL'],
              'package': package.name,
              'packageSha256': hashlib.sha256(package.read_bytes()).hexdigest(),
              'd3dRegression': 'PASS',
              'd3eStaticValidation': 'PASS',
              'compile': 'PASS',
              'packageAudit': 'PASS',
              'runtimeAcceptance': 'PENDING-RON-IN-GAME',
          }
          out = root / 'handoff/AIRSHIP_0696D3E_CI_EVIDENCE.json'
          out.write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, indent=2))
          PY

      - name: Upload D3-E CI identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0696D3E-ci-evidence
          if-no-files-found: error
          path: handoff/AIRSHIP_0696D3E_CI_EVIDENCE.json
