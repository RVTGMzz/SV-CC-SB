name: Cardcha alpha28.0.3.0 Sky Dock interior flight fix

on:
  push:
    branches: [ cardcha-alpha28-airship-foundation ]
    paths:
      - '.github/workflows/cardcha-alpha28-0301-sky-dock-interior-flight-fix.yml'
      - 'build_assets/apply_alpha28_sky_dock_interior_flight_fix1.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply alpha28 Sky Dock interior candidate + compile fixes
        run: python3 build_assets/apply_alpha28_sky_dock_interior_flight_fix1.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, xml.etree.ElementTree as ET

          r = Path('src/Cardcha')
          target = '0.3.0-alpha.28.0.3.0'
          assert json.loads((r/'manifest.json').read_text())['Version'] == target
          service = (r/'Services/AirshipFoundationService.cs').read_text()
          for marker in [
              'private static Point ResolveSkyDockInteriorArrivalTile',
              'private static Point ResolveSkyDockInteriorExitTile',
              'private static Point ResolveSkyDockInteriorRouteTile',
              'private static Point ResolveSkyDockInteriorBayTile',
              'Point interiorAction = GetActionTile();',
              'Point interiorExit = ResolveSkyDockInteriorExitTile(location);',
              'Region1Fare = 100',
              'AirshipFlightsTaken <= 0',
              'StartFlightCutscene(returning: false)',
              'StartFlightCutscene(returning: true)',
              'Game1.player.Money -= fare',
              'ReturnToSkyDockExterior'
          ]:
              assert marker in service, marker

          save = (r/'Models/SaveData.cs').read_text()
          save_service = (r/'Services/SaveService.cs').read_text()
          assert 'SchemaVersion { get; set; } = 16' in save
          assert 'CurrentSchemaVersion = 16' in save_service
          assert save_service.count('// v15: Airship foundation.') == 1

          root = ET.fromstring((r/'assets/sky_dock_interior.tmx').read_text())
          assert root.attrib['width'] == '30' and root.attrib['height'] == '18'
          for layer in root.findall('layer'):
              vals = [v.strip() for v in layer.find('data').text.replace('\n','').split(',') if v.strip()]
              assert len(vals) == 540

          # Frozen visuals and regressions.
          assert hashlib.sha256((r/'assets/mimi_walk.png').read_bytes()).hexdigest() == '04ff1cbf031c2be0a21f114b8f8eb6f8850bb800eeabd4c27df036d7b23d4fb7'
          assert hashlib.sha256((r/'assets/mimi_broom.png').read_bytes()).hexdigest() == '875c305258151512e46a66d42574a271590f4d184269c03be7b1c1f4f6a161e8'
          assert hashlib.sha256((r/'assets/mimi_social_mugshot.png').read_bytes()).hexdigest() == '7db5cd2f6c8815148d68e534bda26036c55f200402f09713d742d1ab1bfebd11'
          binder = (r/'UI/CardchaBinderMenu.cs').read_text()
          assert 'TryConsumeSyntheticDetailClick(x, y)' in binder
          assert 'LockedCard' in binder and 'PreviewCard' in binder
          print('alpha28.0.3.0 fix1 static validation PASS')
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile fixed candidate
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Package TEST
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha artifact/canonical-src/Services artifact/canonical-src/Models artifact/canonical-src/assets artifact/canonical-src/i18n
          cp "$(find src/Cardcha/bin -name Cardcha.dll -print -quit)" stage/Cardcha/
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/
          test -s stage/Cardcha/Cardcha.dll
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.28.0.3.0_SkyDockInteriorFlight_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt
          cp src/Cardcha/Services/AirshipFoundationService.cs src/Cardcha/Services/SaveService.cs artifact/canonical-src/Services/
          cp src/Cardcha/Models/SaveData.cs artifact/canonical-src/Models/
          cp src/Cardcha/assets/sky_dock_interior.tmx artifact/canonical-src/assets/
          cp src/Cardcha/i18n/default.json src/Cardcha/i18n/vi.json artifact/canonical-src/i18n/
          cp src/Cardcha/Cardcha.csproj src/Cardcha/Directory.Build.targets src/Cardcha/manifest.json src/Cardcha/ModEntry.cs artifact/canonical-src/

      - name: Canonicalize fixed alpha28.0.3.0 source if needed
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/Cardcha/Services/AirshipFoundationService.cs \
            src/Cardcha/Services/SaveService.cs \
            src/Cardcha/Models/SaveData.cs \
            src/Cardcha/assets/sky_dock_interior.tmx \
            src/Cardcha/i18n/default.json \
            src/Cardcha/i18n/vi.json \
            src/Cardcha/Cardcha.csproj \
            src/Cardcha/Directory.Build.targets \
            src/Cardcha/manifest.json \
            src/Cardcha/ModEntry.cs
          if git diff --cached --quiet; then
            echo 'Canonical source already matches fixed alpha28.0.3.0.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'alpha28.0.3.0: canonicalize Sky Dock interior flight fix'
            git push origin HEAD:cardcha-alpha28-airship-foundation
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-030-sky-dock-interior-flight
          path: artifact
          if-no-files-found: error
