name: Cardcha alpha27.0.7.7.5 visual + localization polish

on:
  push:
    branches: [ cardcha-alpha27-mimi-real-npc ]
    paths:
      - '.github/workflows/cardcha-alpha27-0775-visual-localization-polish.yml'
      - 'build_assets/apply_0775.py'
      - 'src/Cardcha/UI/CardchaRevealMenu.cs'
      - 'src/Cardcha/UI/CardchaBinderMenu.cs'
      - 'src/Cardcha/Patches/MachineInteractionPatch.cs'
      - 'src/Cardcha/Services/ItemAssetService.cs'
      - 'src/Cardcha/Services/WorldActorService.cs'
      - 'src/Cardcha/Services/MimiAtticVisualService.cs'
      - 'src/Cardcha/Services/MimiHomeService.cs'
      - 'src/Cardcha/assets/mimi_broom.png'
      - 'src/Cardcha/assets/mimi_walk_runtime.png'
      - 'src/Cardcha/assets/mimi_social_mugshot.png'
      - 'src/Cardcha/assets/mimi_attic_stairs.png'
      - 'src/Cardcha/assets/mimi_attic_room_frame.png'
      - 'src/Cardcha/assets/mimi_attic.tmx'
      - 'src/Cardcha/Cardcha.csproj'
      - 'src/Cardcha/Directory.Build.targets'
      - 'src/Cardcha/manifest.json'
      - 'src/Cardcha/ModEntry.cs'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Apply 0.7.7.5 candidate
        run: python3 build_assets/apply_0775.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json

          r = Path('src/Cardcha')
          target = '0.3.0-alpha.27.0.7.7.5'
          locked_walk = '04ff1cbf031c2be0a21f114b8f8eb6f8850bb800eeabd4c27df036d7b23d4fb7'
          approved_broom = '875c305258151512e46a66d42574a271590f4d184269c03be7b1c1f4f6a161e8'

          assert json.loads((r/'manifest.json').read_text())['Version'] == target
          assert target in (r/'Cardcha.csproj').read_text()
          assert target in (r/'Directory.Build.targets').read_text()
          assert target in (r/'ModEntry.cs').read_text()

          reveal = (r/'UI/CardchaRevealMenu.cs').read_text()
          assert 'RarityLabel(result.Card.Rarity)' in reveal
          assert 'result.Card.Rarity.ToString()' not in reveal
          vi = json.loads((r/'i18n/vi.json').read_text())
          for key in ['rarity.common','rarity.rare','rarity.epic','rarity.legendary','rarity.mythic']:
              assert vi.get(key)

          binder = (r/'UI/CardchaBinderMenu.cs').read_text()
          assert 'binder.status.pick' not in binder
          assert 'binder.status.preview' not in binder

          actor = (r/'Services/WorldActorService.cs').read_text()
          assert 'private const float MimiBroomNativeScale = MimiNativeScale * 1.10f;' in actor
          assert 'int spriteWidth = broom ? 48 : 32;' in actor

          item = (r/'Services/ItemAssetService.cs').read_text()
          cardcha = item[item.index('data[CardchaMachineId]'):item.index('data[PortableMachineId]')]
          assert 'CanBePlacedIndoors = false' in cardcha
          assert 'CanBePlacedOutdoors = false' in cardcha
          machine_patch = (r/'Patches/MachineInteractionPatch.cs').read_text()
          assert 'nameof(SObject.isPlaceable)' in machine_patch
          assert 'IsPlaceablePostfix' in machine_patch

          visual = (r/'Services/MimiAtticVisualService.cs').read_text()
          assert '"(F)1466", 4, 7' in visual
          assert '"(F)432", 2, 11' in visual
          assert '"(F)724"' not in visual
          assert '"(F)1541", 6, 1' in visual
          assert 'mimi_attic_room_frame.png' in visual
          assert 'TvTable' not in visual
          assert 'alpha.27.0.7.7.5' in visual

          home = (r/'Services/MimiHomeService.cs').read_text()
          assert 'return preferred;' in home
          assert 'ResolveWizardLandingTile' in home
          assert 'warpFarmer("WizardHouse", landing.X, landing.Y, 2)' in home

          assert Image.open(r/'assets/mimi_walk.png').size == (128, 192)
          assert Image.open(r/'assets/mimi_walk_runtime.png').size == (128, 216)
          assert Image.open(r/'assets/mimi_social_mugshot.png').size == (16, 24)
          assert Image.open(r/'assets/mimi_broom.png').size == (192, 192)
          assert Image.open(r/'assets/mimi_attic_stairs.png').size == (16, 64)
          assert Image.open(r/'assets/mimi_attic_room_frame.png').size == (352, 224)

          walk = Image.open(r/'assets/mimi_walk.png').convert('RGBA')
          runtime = Image.open(r/'assets/mimi_walk_runtime.png').convert('RGBA')
          mug = Image.open(r/'assets/mimi_social_mugshot.png').convert('RGBA')
          assert runtime.crop((0, 0, 128, 192)).tobytes() == walk.tobytes()
          assert runtime.crop((0, 192, 16, 216)).tobytes() == mug.tobytes()
          assert hashlib.sha256((r/'assets/mimi_walk.png').read_bytes()).hexdigest() == locked_walk
          assert hashlib.sha256((r/'assets/mimi_broom.png').read_bytes()).hexdigest() == approved_broom
          outline_pixels = sum(1 for rr,gg,bb,aa in mug.getdata() if aa > 0 and rr <= 12 and gg <= 12 and bb <= 16)
          assert outline_pixels > 0

          tmx = (r/'assets/mimi_attic.tmx').read_text()
          assert 'CardchaAtticVersion" value="alpha.27.0.7.7.5"' in tmx
          assert 'fixed-wizard-ladder' in tmx
          print('0.7.7.5 static validation PASS')
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Post-build version validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          r = Path('src/Cardcha')
          target = '0.3.0-alpha.27.0.7.7.5'
          assert json.loads((r/'manifest.json').read_text())['Version'] == target
          print('post-build manifest version PASS:', target)
          PY

      - name: Package TEST and canonical source payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact/canonical-src/UI artifact/canonical-src/Patches artifact/canonical-src/Services artifact/canonical-src/assets stage/Cardcha

          cp "$(find src/Cardcha/bin -name Cardcha.dll -print -quit)" stage/Cardcha/
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/

          cp src/Cardcha/UI/CardchaRevealMenu.cs artifact/canonical-src/UI/
          cp src/Cardcha/UI/CardchaBinderMenu.cs artifact/canonical-src/UI/
          cp src/Cardcha/Patches/MachineInteractionPatch.cs artifact/canonical-src/Patches/
          cp src/Cardcha/Services/ItemAssetService.cs artifact/canonical-src/Services/
          cp src/Cardcha/Services/WorldActorService.cs artifact/canonical-src/Services/
          cp src/Cardcha/Services/MimiAtticVisualService.cs artifact/canonical-src/Services/
          cp src/Cardcha/Services/MimiHomeService.cs artifact/canonical-src/Services/
          cp src/Cardcha/assets/mimi_broom.png artifact/canonical-src/assets/
          cp src/Cardcha/assets/mimi_walk_runtime.png artifact/canonical-src/assets/
          cp src/Cardcha/assets/mimi_social_mugshot.png artifact/canonical-src/assets/
          cp src/Cardcha/assets/mimi_attic_stairs.png artifact/canonical-src/assets/
          cp src/Cardcha/assets/mimi_attic_room_frame.png artifact/canonical-src/assets/
          cp src/Cardcha/assets/mimi_attic.tmx artifact/canonical-src/assets/
          cp src/Cardcha/Cardcha.csproj src/Cardcha/Directory.Build.targets src/Cardcha/manifest.json src/Cardcha/ModEntry.cs artifact/canonical-src/

          test -s stage/Cardcha/Cardcha.dll
          test -f stage/Cardcha/assets/mimi_walk.png
          test -f stage/Cardcha/assets/mimi_broom.png
          test -f stage/Cardcha/assets/mimi_attic.tmx
          test -f stage/Cardcha/assets/mimi_attic_stairs.png
          test -f stage/Cardcha/assets/mimi_attic_room_frame.png

          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.27.0.7.7.5_VisualLocalizationPolish_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

      - name: Canonicalize 0.7.7.5 source if needed
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/Cardcha/UI/CardchaRevealMenu.cs \
            src/Cardcha/Patches/MachineInteractionPatch.cs \
            src/Cardcha/Services/ItemAssetService.cs \
            src/Cardcha/Services/WorldActorService.cs \
            src/Cardcha/Services/MimiAtticVisualService.cs \
            src/Cardcha/Services/MimiHomeService.cs \
            src/Cardcha/assets/mimi_broom.png \
            src/Cardcha/assets/mimi_walk_runtime.png \
            src/Cardcha/assets/mimi_social_mugshot.png \
            src/Cardcha/assets/mimi_attic_stairs.png \
            src/Cardcha/assets/mimi_attic_room_frame.png \
            src/Cardcha/assets/mimi_attic.tmx \
            src/Cardcha/Cardcha.csproj \
            src/Cardcha/Directory.Build.targets \
            src/Cardcha/manifest.json \
            src/Cardcha/ModEntry.cs

          if git diff --cached --quiet; then
            echo 'Canonical source already matches 0.7.7.5 candidate.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'alpha27.0.7.7.5: polish reveal localization, MiMi visuals, machine and attic'
          git push origin HEAD:cardcha-alpha27-mimi-real-npc

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha27-0775-visual-localization-polish
          path: artifact
          if-no-files-found: error
