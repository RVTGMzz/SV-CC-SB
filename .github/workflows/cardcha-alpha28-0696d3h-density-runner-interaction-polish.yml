name: Cardcha 0696D3-H Density Runner Interaction Polish TEST
# Repository: ronvotri/CC-SB — renamed from Cardcha-Shardbound and public as of 2026-09-18.

# Historical D3-H workflow. D3-I intentionally changes console alpha, Window ownership,
# ChaCha Resonance station scale, lamp placement and BOARD AIRSHIP pad position.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout D3-H branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup deterministic image tooling
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Run D3-H runtime-feedback contract validator
        run: python3 tools/alpha28_0696d3h_density_runner_interaction_polish.py

      - name: Validate no legacy Window overlay reuse
        run: python3 tools/validate_0696d2_no_legacy_overlay_reuse.py

      - name: Validate render-depth contract
        run: python3 tools/validate_render_depth_contract.py

      - name: Prove validators did not mutate production inputs
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- \
            src/Cardcha/assets/airship_deck.tmx \
            src/Cardcha/assets/sky_dock_interior.tmx \
            src/Cardcha/assets/airship_props/set01_redux/navigation_console_body_d3h.png \
            src/Cardcha/assets/airship_props/set01_redux/airship_runner_d3h.png \
            src/Cardcha/assets/airship_props/set02_harbor/waiting_bench_d3h.png \
            src/Cardcha/assets/airship_props/set02_harbor/lost_found_board_d3h.png \
            src/Cardcha/assets/airship_props/set02_harbor/luggage_cart_d3h.png \
            src/Cardcha/Services/AirshipFoundationService.cs \
            src/Cardcha/Services/AirshipAmbientAnimationService.cs \
            src/Cardcha/Services/AirshipInteriorStardewRenderer.cs \
            src/Cardcha/Patches/AirshipGateDepthPatch.cs \
            src/Cardcha/Patches/WorldPhysicalOverlaySafetyPatch.cs \
            src/Cardcha/i18n/default.json \
            src/Cardcha/i18n/vi.json \
            src/Cardcha/manifest.json \
            src/Cardcha/Cardcha.csproj \
            src/Cardcha/Directory.Build.targets

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha Release
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Package D3-H .72 TEST
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION='0.3.0-alpha.28.0.4.14.4.5.12.72'
          ZIP="Cardcha_v${VERSION}_0696D3H_DensityRunnerInteractionPolish_TEST.zip"
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name Cardcha.dll | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 "$GITHUB_WORKSPACE/tools/alpha28_0696d3h_package_audit.py" \
            "$ZIP" \
            --report "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3H_PACKAGE_AUDIT.json"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Record D3-H CI evidence
        id: evidence
        shell: bash
        env:
          ZIP_NAME: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          TAG="cardcha-0696d3h-test-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root=Path(os.environ['GITHUB_WORKSPACE'])
          package=root/'package'/os.environ['ZIP_NAME']
          tag=f"cardcha-0696d3h-test-{os.environ['GITHUB_SHA'][:8]}"
          evidence={
              'phase':'0696D3-H-ci-evidence',
              'runId':int(os.environ['GITHUB_RUN_ID']),
              'runUrl':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'sourceCommit':os.environ['GITHUB_SHA'],
              'releaseTag':tag,
              'releaseMode':'prerelease',
              'package':package.name,
              'packageSha256':hashlib.sha256(package.read_bytes()).hexdigest(),
              'd3hRuntimeFeedbackContract':'PASS',
              'noLegacyWindowReuse':'PASS',
              'renderDepthContract':'PASS',
              'compile':'PASS',
              'packageAudit':'PASS',
              'runtimeAcceptance':'PENDING-RON-IN-GAME',
          }
          out=root/'handoff/AIRSHIP_0696D3H_CI_EVIDENCE.json'
          out.write_text(json.dumps(evidence,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(evidence,indent=2))
          PY

      - name: Publish D3-H TEST as GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ steps.package.outputs.zip }}
          TAG: ${{ steps.evidence.outputs.tag }}
        run: |
          set -euo pipefail
          ZIP_PATH="$GITHUB_WORKSPACE/package/$ZIP_NAME"
          SHA_PATH="$ZIP_PATH.sha256"
          NOTES=$(cat <<'EOF'
          0696D3-H TEST package for Ron's post-D3-G runtime feedback.

          Main D3-H changes:
          - Sky Dock room resized from 30x18 to 24x15: exactly 2/3 the old area;
          - Room 1 daylight increased and functional anchors receive small pixel light pools;
          - waiting bench, Lost & Found board and luggage cart scaled to ~2/3 with nearest-neighbor pixel art;
          - Lost & Found interaction moved off the waiting bench to the large wall board;
          - prop bodies use native collision with open front interaction lanes;
          - cargo/bench/luggage moved out of Front2 head-cut ownership;
          - Stardew-style 16x16 woven runner leads from door to BOARD AIRSHIP / TRAVEL;
          - runner uses a small pixel palette, woven texture, brass stitch and subtle floor shadow;
          - D3-G frame-only console body retired; D3-H restores the original full-detail hard-alpha console;
          - TRAVEL gate presentation enlarged to 1.5x;
          - Navigation upgrade machine enlarged to 2x, all four stations get stronger pixel glow;
          - remaining signal lamp moved and blocked;
          - Observation Window presentation is exact 4.0x to sit against the wall instead of overscanning.

          CI/static/package PASS is not Runtime PASS.
          Runtime acceptance remains PENDING-RON-IN-GAME until Ron tests this exact package.
          EOF
          )
          gh release create "$TAG" \
            "$ZIP_PATH" \
            "$SHA_PATH" \
            "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3H_DENSITY_RUNNER_INTERACTION_POLISH_VALIDATION.json" \
            "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3H_PACKAGE_AUDIT.json" \
            "$GITHUB_WORKSPACE/handoff/AIRSHIP_0696D3H_CI_EVIDENCE.json" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Cardcha 0696D3-H Density Runner Interaction Polish TEST" \
            --notes "$NOTES"
