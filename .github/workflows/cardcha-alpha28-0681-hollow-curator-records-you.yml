name: Cardcha 0681 Hollow Curator Records You

on:
  push:
    branches:
      - cardcha-alpha28-0681-hollow-curator-records-you

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate 0681 Curator Records You
        run: python3 tools/alpha28_0681_hollow_curator_records_you.py

      - name: Validate repository rendering depth contract
        run: python3 tools/validate_render_depth_contract.py

      - name: Validate 0681 Curator adaptive encounter contracts
        run: python3 tools/validate_0681_hollow_curator_records_you.py

      - name: Verify later-region and locked assets are untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/cardcha-alpha28-0680-region2-roguelike-route-foundation -- \
            src/Cardcha/assets/mimi_walk.png \
            src/Cardcha/assets/airship_visual.png \
            src/Cardcha/assets/airship_deck.tmx \
            src/Cardcha/assets/sky_dock_interior.tmx \
            src/Cardcha/assets/region2_forgotten_archive.tmx \
            src/Cardcha/assets/region2_forgotten_archive_tiles.png \
            src/Cardcha/assets/region2_forgotten_archive_enemies.png \
            src/Cardcha/assets/region3_mirrorwild.tmx \
            src/Cardcha/assets/region4_resonance_verge.tmx \
            src/Cardcha/assets/boss2_hollow_curator_arena.tmx \
            src/Cardcha/assets/boss3_tricolor_resonance_arena.tmx \
            src/Cardcha/assets/boss4_mimi_resonance_arena.tmx \
            src/Cardcha/assets/bosses/milestone/tricolor_guardians.png \
            src/Cardcha/assets/bosses/milestone/tricolor_unified.png \
            src/Cardcha/assets/bosses/milestone/mimi_resonance_master.png

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize 0681 source and handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.49 Hollow Curator Records You [skip ci]'
            git push origin HEAD:cardcha-alpha28-0681-hollow-curator-records-you
          fi

      - name: Package 0681 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name Cardcha.dll | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP='Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.49_0681_HollowCuratorRecordsYou_TEST.zip'
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"
          python3 - <<'PY'
          from pathlib import Path
          import io, json, zipfile
          from PIL import Image
          p=Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.49_0681_HollowCuratorRecordsYou_TEST.zip')
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              m=json.loads(z.read('Cardcha/manifest.json'))
              assert m['Version']=='0.3.0-alpha.28.0.4.14.4.5.12.49'
              dll=z.read('Cardcha/Cardcha.dll')
              assert dll[:2]==b'MZ' and len(dll)>50000
              for req in [
                  'Cardcha/assets/region2_forgotten_archive.tmx',
                  'Cardcha/assets/region2_forgotten_archive_enemies.png',
                  'Cardcha/assets/boss2_hollow_curator_arena.tmx',
                  'Cardcha/assets/bosses/milestone/hollow_curator.png',
                  'Cardcha/assets/bosses/milestone/tricolor_guardians.png',
                  'Cardcha/assets/bosses/milestone/mimi_resonance_master.png',
                  'Cardcha/assets/mimi_walk.png',
                  'Cardcha/i18n/default.json',
                  'Cardcha/i18n/vi.json']:
                  assert req in names, req
              im=Image.open(io.BytesIO(z.read('Cardcha/assets/bosses/milestone/hollow_curator.png')))
              assert im.size==(864,64), im.size
          print('0681 package audit PASS:', p)
          PY

      - name: Upload 0681 TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0681-hollow-curator-records-you
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.49_0681_HollowCuratorRecordsYou_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.49_0681_HollowCuratorRecordsYou_TEST.zip.sha256
          if-no-files-found: error
