name: Cardcha 0696 Airship Set01 legacy evidence audit

# 0696A supersedes this evidence-only audit with a production-aware validator.
# Keep this workflow available for manual historical diagnosis only. In particular,
# collision_blocker.png is intentionally transparent, so alpha-footprint logic must
# not be used as the final production collision gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Run legacy evidence audit
        continue-on-error: true
        run: python tools/alpha28_0696_airship_set01_full_footprint_audit.py --strict

      - name: Upload legacy audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-0696-airship-set01-legacy-evidence-audit
          if-no-files-found: warn
          path: |
            handoff/AIRSHIP_SET01_FULL_FOOTPRINT_AUDIT_0696.json
            handoff/ALPHA28_0696_AIRSHIP_SET01_FULL_FOOTPRINT_AUDIT.md
            handoff/AIRSHIP_SET01_FULL_FOOTPRINT_AUDIT_0696.png
