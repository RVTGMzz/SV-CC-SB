name: Cardcha alpha28.0.4.14.4.5.11 MiMi Secret TV Routine

on:
  push:
    branches: [ cardcha-alpha28-0646-mimi-secret-tv-routine ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate .5.11 MiMi secret-TV routine
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/alpha28_0646_mimi_secret_tv_routine.py

      - name: Validate .5.11 routine + locked gameplay contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, xml.etree.ElementTree as ET

          root = Path('src/Cardcha')
          assets = root/'assets'
          version = '0.3.0-alpha.28.0.4.14.4.5.11'

          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['Version'] == version
          assert f'<Version>{version}</Version>' in (root/'Cardcha.csproj').read_text(encoding='utf-8')
          assert f'<Version>{version}</Version>' in (root/'Directory.Build.targets').read_text(encoding='utf-8')

          home = (root/'Services/MimiHomeService.cs').read_text(encoding='utf-8')
          for token in [
              'SecretTvHeartRequirement = 6',
              'SecretTvStart = 1730',
              'SecretTvEnd = 2200',
              'SecretTvWatchTile = new(6, 10)',
              'IsSecretTvRoutineNow()',
              'ResolveSecretTvTalkKey()',
              'PlayerIsNearNpc(mimi, 118f)',
              'Point tv = FindClearTileNear(attic, SecretTvWatchTile)',
              'PlaceMimi(mimi, attic, tv, 0)',
              'Point lateHome = FindClearTileNear(attic, SecretLateHomeTile)',
              'mimi.faceDirection(facing)',
              'A same-location move is intentional here',
              'SecretTV={secretTv} 17:30-22:00',
          ]:
              assert token in home, token

          visual = (root/'Services/MimiAtticVisualService.cs').read_text(encoding='utf-8')
          for token in [
              'SecretTvHeartRequirement = 6',
              'SecretTvTime = 1730',
              'SecretTvEndTime = 2200',
              'this.IsSecretTvRoutineEligible() => "mimi.attic.inspect.tv.routine"',
              'mimi.attic.inspect.tv.after',
              'Game1.timeOfDay >= SecretTvEndTime',
          ]:
              assert token in visual, token
          assert 'mimi_attic_room_frame.png' not in visual
          assert 'DrawRoomFrame' not in visual

          required_keys = [
              'mimi.attic.inspect.tv.routine',
              'mimi.attic.inspect.tv.after',
              'mimi.attic.routine.tv.talk.early',
              'mimi.attic.routine.tv.talk.late',
              'mimi.attic.routine.tv.talk.chacha-away',
          ]
          for lang in ['default.json', 'vi.json']:
              data = json.loads((root/'i18n'/lang).read_text(encoding='utf-8'))
              for key in required_keys:
                  assert key in data and len(data[key].strip()) >= 12, (lang, key)

          # The true-Stardew attic shell remains unchanged by this behavior-only pass.
          attic = ET.parse(assets/'mimi_attic.tmx').getroot()
          assert (int(attic.attrib['width']), int(attic.attrib['height'])) == (22, 14)
          props = {p.attrib['name']: p.attrib.get('value','') for p in attic.find('properties')}
          assert 'no-room-overlay' in props['CardchaVisualDirection']
          assert not (assets/'mimi_attic_room_frame.png').exists()

          # No persistence/schema expansion for the routine itself.
          save = (root/'Models/SaveData.cs').read_text(encoding='utf-8')
          assert 'SchemaVersion { get; set; } = 19' in save
          assert 'SecretTv' not in save

          # Locked Cardcha contracts carried from 0642+.
          assert hashlib.sha256((assets/'airship_visual.png').read_bytes()).hexdigest() == '1821ee869759a924f7ff2b6821aaeb64b80a000d84c46f207a578d3a1e771132'
          assert 'BossFormDurationMs = 10000' in (root/'Services/ChaChaBossFormService.cs').read_text(encoding='utf-8')
          assert 'EnergyGainScale = 1d / 3d' in (root/'Services/BossEnergyService.cs').read_text(encoding='utf-8')
          gate = (root/'Patches/AirshipGateRelocationPatch.cs').read_text(encoding='utf-8')
          assert 'CollisionEdits=NONE' in gate and 'CanonicalGateUseDistance = 160f' in gate
          audit = json.loads((assets/'card_auto_audit.json').read_text(encoding='utf-8'))
          assert len(audit) == 76 and all(row['status'] == 'PASS' for row in audit)

          print('alpha28 0646 MiMi secret-TV routine acceptance PASS')
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Materialize .5.11 secret-TV routine source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            src/Cardcha/Services/MimiHomeService.cs \
            src/Cardcha/Services/MimiAtticVisualService.cs \
            src/Cardcha/i18n/default.json \
            src/Cardcha/i18n/vi.json \
            src/Cardcha/manifest.json \
            src/Cardcha/Cardcha.csproj \
            src/Cardcha/Directory.Build.targets \
            tools/alpha28_0646_mimi_secret_tv_routine.py \
            .github/workflows/cardcha-alpha28-0646-mimi-secret-tv-routine.yml || true

          if git diff --cached --quiet; then
            echo "No materialized diff."
          else
            git commit -m "chore: materialize alpha28.0.4.14.4.5.11 MiMi secret TV routine [skip ci]"
            git push origin HEAD:cardcha-alpha28-0646-mimi-secret-tv-routine
          fi

      - name: Package .5.11 test build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha
          dll="$(find src/Cardcha/bin/Release -name Cardcha.dll -print -quit)"
          test -n "$dll" && test -s "$dll"
          cp "$dll" stage/Cardcha/Cardcha.dll
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/
          test "$(python3 -c "import json; print(json.load(open('stage/Cardcha/manifest.json'))['Version'])")" = "0.3.0-alpha.28.0.4.14.4.5.11"
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.11_MiMiSecretTvRoutine_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0646-mimi-secret-tv-routine
          path: artifact
          if-no-files-found: error
