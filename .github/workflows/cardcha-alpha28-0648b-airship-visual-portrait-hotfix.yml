name: Cardcha alpha28.0.4.14.4.5.12.8 Airship Visual Portrait Hotfix

on:
  push:
    branches: [ cardcha-alpha28-0648b-airship-visual-portrait-hotfix ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Pillow
        run: python3 -m pip install --quiet pillow

      - name: Generate 0648B hotfix
        run: python3 tools/alpha28_0648b_airship_visual_portrait_hotfix.py

      - name: Validate 0648B acceptance contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, xml.etree.ElementTree as ET
          root=Path('src/Cardcha'); assets=root/'assets'
          v='0.3.0-alpha.28.0.4.14.4.5.12.8'
          assert json.loads((root/'manifest.json').read_text())['Version']==v
          assert v in (root/'Cardcha.csproj').read_text()
          assert v in (root/'Directory.Build.targets').read_text()

          def map_layers(rel):
              m=ET.parse(assets/rel).getroot(); w=int(m.attrib['width']); h=int(m.attrib['height'])
              out={}
              for layer in m.findall('layer'):
                  body=(layer.find('data').text or '').strip(); vals=[int(x.strip()) for x in body.split(',')]
                  assert len(vals)==w*h,(rel,layer.attrib['name'],len(vals),w*h)
                  out[layer.attrib['name']]=vals
              return w,h,out

          dw,dh,d=map_layers('airship_deck.tmx')
          sw,sh,s=map_layers('sky_dock_interior.tmx')
          assert (dw,dh)==(24,14) and (sw,sh)==(30,18)
          assert set(d)=={'Back','BackDecor','Buildings','Front'}
          assert set(s)=={'Back','BackDecor','Buildings','Front'}
          # Vanilla shell: floor/wall gids below custom range; decor is the custom layer.
          assert max(d['Back']) < 4096 and max(s['Back']) < 4096
          assert min(x for x in d['BackDecor'] if x) >= 4096
          assert min(x for x in s['BackDecor'] if x) >= 4096
          # Walls stop at row 4. Row 7/8 center is visibly walkable, fixing the invisible blockers.
          for x in range(1,dw-1):
              for y in range(1,5): assert d['Buildings'][y*dw+x] != 0
          assert d['Buildings'][7*dw+12] == 0
          assert d['Buildings'][8*dw+12] == 0
          assert s['Buildings'][8*sw+15] == 0
          # Two-tile exits only.
          assert [x for x in range(dw) if d['Buildings'][(dh-1)*dw+x]==0] == [11,12]
          assert [x for x in range(sw) if s['Buildings'][(sh-1)*sw+x]==0] == [14,15]
          # Four separated visible machine blockers, center aisle free.
          for x,y in [(4,8),(19,8),(7,11),(16,11)]: assert d['Buildings'][y*dw+x] != 0
          for x,y in [(11,8),(12,8),(11,9),(12,9),(11,10),(12,10),(11,11),(12,11),(11,12),(12,12)]: assert d['Buildings'][y*dw+x] == 0

          deck=Image.open(assets/'airship_deck_stardew.png').convert('RGBA')
          dock=Image.open(assets/'sky_dock_stardew.png').convert('RGBA')
          assert deck.size==(384,224) and dock.size==(480,288)
          # Decor has transparency, proving it no longer replaces the whole room texture.
          assert min(px[3] for px in deck.getdata()) == 0
          assert min(px[3] for px in dock.getdata()) == 0

          air=(root/'Services/AirshipFoundationService.cs').read_text()
          assert 'if (interiorAction == route)' in air
          assert 'if (interiorAction == bay)' in air
          assert 'if (playerTile == bay)' in air
          assert 'ActionTouchesStation' in air
          assert 'PlayerIsNear(tile, 176f)' not in air
          assert 'ResolveOutdoorSkyPalette' in air and 'DrawFlightWeather' in air
          assert 'DrawPortalClouds(batch, aperture' not in air

          menu=(root/'UI/AirshipUpgradeMenu.cs').read_text()
          assert 'one physical station, one upgrade system' in menu.lower()
          assert 'ClickableComponent[] Rows' not in menu
          assert 'this.System' in menu

          portrait=(root/'Services/MimiMysteryTownService.cs').read_text()
          assert 'RuntimePortraitSheet' not in portrait
          assert 'GetLivePortraitTexture' in portrait
          assert 'portrait.IsDisposed' in portrait
          assert 'Game1.content.Load<Texture2D>(PortraitAsset)' in portrait

          visual=(root/'Services/MimiAtticVisualService.cs').read_text()
          # The legacy destructive helper may remain defined, but it must never be called.
          assert 'PrepareWizardStairArea(location, stair);' not in visual
          home=(root/'Services/MimiHomeService.cs').read_text()
          assert 'Deterministic right-half floor scan' in home
          print('0648B acceptance validator PASS')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Audit compiled DLL
        shell: bash
        run: |
          set -euo pipefail
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          echo "DLL=$DLL"
          stat -c '%s bytes' "$DLL"

      - name: Materialize .5.12.8 source and assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Cardcha
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.8 visual portrait hotfix [skip ci]'
            git push origin HEAD:cardcha-alpha28-0648b-airship-visual-portrait-hotfix
          fi

      - name: Package .5.12.8 test build
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.8_AirshipVisualPortraitHotfix_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0648b-airship-visual-portrait-hotfix
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.8_AirshipVisualPortraitHotfix_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.8_AirshipVisualPortraitHotfix_TEST.zip.sha256
          if-no-files-found: error
