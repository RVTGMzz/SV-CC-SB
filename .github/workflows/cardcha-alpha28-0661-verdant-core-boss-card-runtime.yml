name: Cardcha alpha28.0.4.14.4.5.12.28 Verdant Core Boss Card Runtime

on:
  push:
    branches: [ cardcha-alpha28-0661-verdant-core-boss-card-runtime ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install generator deps
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Generate 0661 Verdant Core Boss Card runtime
        run: python3 tools/alpha28_0661_verdant_core_boss_card_runtime.py

      - name: Validate 0661 acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, xml.etree.ElementTree as ET

          root = Path('src/Cardcha')
          version = '0.3.0-alpha.28.0.4.14.4.5.12.28'
          manifest = json.loads((root/'manifest.json').read_text())
          assert manifest['Version'] == version
          assert version in (root/'Cardcha.csproj').read_text()
          assert version in (root/'Directory.Build.targets').read_text()

          boss_cards = (root/'Services/BossCardService.cs').read_text()
          for token in [
              'public const string VerdantCoreId = "verdant_core";',
              'public const double VerdantGuardThreshold = 0.50d;',
              'public const double VerdantDamageReduction = 0.35d;',
              'public const int VerdantActiveDurationMs = 6000;',
              'public const int VerdantCooldownMs = 24000;',
              'public const int VerdantHealPerTick = 2;',
              'ModifyIncomingDamage',
              'DebugUnlock',
              'DebugEquip',
              'DebugTrigger',
              'OnRenderedHud',
              'OnRenderedWorld',
          ]:
              assert token in boss_cards, token

          farmer = (root/'Patches/FarmerDamagePatch.cs').read_text()
          assert 'private static BossCardService? BossCards;' in farmer
          assert 'BossCards.ModifyIncomingDamage' in farmer

          mod = (root/'ModEntry.cs').read_text()
          for token in [
              'private BossCardService BossCards = null!;',
              'new BossCardService(helper, this.Monitor, this.Save, this.Config)',
              'this.BossCards.OnUpdateTicked',
              'this.BossCards.OnRenderedHud',
              'this.BossCards.OnRenderedWorld',
              'this.CardArena, this.BossCards);',
              'cardcha_boss_card_status',
              'cardcha_boss_card_unlock',
              'cardcha_boss_card_equip',
              'cardcha_boss_card_trigger',
              '0.3.0-alpha.28.0.4.14.4.5.12.28 VERDANT CORE BOSS CARD RUNTIME TEST',
          ]:
              assert token in mod, token

          save = (root/'Models/SaveData.cs').read_text()
          assert 'SchemaVersion { get; set; } = 19;' in save
          assert 'BossCardsUnlocked' in save and 'EquippedBossCardId' in save

          # Boss Card stays outside the normal card registry/canon.
          cards = json.loads((root/'assets/cards.json').read_text())
          assert len([c for c in cards if c.get('Enabled', True)]) == 76
          assert all(c.get('Id') != 'verdant_core' for c in cards)

          icon = root/'assets/boss_cards/verdant_core_icon.png'
          assert icon.exists() and icon.stat().st_size > 100
          with Image.open(icon) as im:
              assert im.size == (64, 64)

          for lang in ['default.json', 'vi.json']:
              data = json.loads((root/'i18n'/lang).read_text())
              for key in [
                  'boss.card.verdant_core.name',
                  'boss.card.verdant_core.desc',
                  'boss.card.verdant_core.unlocked',
                  'boss.card.verdant_core.activated',
                  'boss.card.state.ready',
                  'boss.card.state.active',
                  'boss.card.state.cooldown',
              ]:
                  assert key in data, (lang, key)

          # Preserve 0660 Verdant Colossus implementation.
          visual = (root/'Services/VerdantGuardianVisualService.cs').read_text()
          assert 'private const float DrawScale = 8f;' in visual
          assert 'boss1_verdant_guardian_defeat.png' in visual
          assert 'fx_boss1_core_release.png' in visual
          boss = (root/'Services/VerdantGuardianBossService.cs').read_text()
          assert 'private const int DefeatSequenceDurationMs = 2200;' in boss
          assert 'private Vector2 HeavyAnchor;' in boss
          proxy = (root/'Patches/VerdantGuardianProxyDrawPatch.cs').read_text()
          assert 'BossMarkerKey' in proxy

          # Preserve 0659 stair resolver and 0656/0655 MiMi fixes.
          home = (root/'Services/MimiHomeService.cs').read_text()
          assert 'ResolvePreferredWizardStairTile' in home
          assert 'bool rightIsBoundary' in home
          profile = (root/'Patches/MimiProfileMenuPatch.cs').read_text()
          assert 'DrawScale=vanilla-4x' in profile
          vi = json.loads((root/'i18n/vi.json').read_text())
          assert 'trú mưa' in vi['mimi.social.community-center']

          # Runtime-safe TMX CSV contract.
          checked_layers = 0
          for tmx in sorted((root/'assets').rglob('*.tmx')):
              map_root = ET.parse(tmx).getroot()
              for layer in map_root.findall('layer'):
                  data = layer.find('data')
                  if data is None or data.attrib.get('encoding') != 'csv':
                      continue
                  tokens = (data.text or '').split(',')
                  vals = []
                  for i, token in enumerate(tokens):
                      s = token.strip()
                      assert s != '', f'{tmx}: empty CSV token layer={layer.attrib.get("name")} index={i}'
                      n = int(s)
                      assert 0 <= n <= 0xFFFFFFFF
                      vals.append(n)
                  assert len(vals) == int(layer.attrib['width']) * int(layer.attrib['height'])
                  checked_layers += 1
          assert checked_layers >= 21
          print(f'0661 validator PASS; normalCards=76, strictTMXLayers={checked_layers}')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.28 source + handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.28 Verdant Core Boss Card runtime [skip ci]'
            git push origin HEAD:cardcha-alpha28-0661-verdant-core-boss-card-runtime
          fi

      - name: Package .5.12.28 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.28_VerdantCoreBossCard_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"

          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile, xml.etree.ElementTree as ET
          z = Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.28_VerdantCoreBossCard_TEST.zip')
          with zipfile.ZipFile(z) as f:
              assert json.loads(f.read('Cardcha/manifest.json'))['Version'] == '0.3.0-alpha.28.0.4.14.4.5.12.28'
              assert len(f.read('Cardcha/Cardcha.dll')) > 100000
              assert len(f.read('Cardcha/assets/boss_cards/verdant_core_icon.png')) > 100
              vi = json.loads(f.read('Cardcha/i18n/vi.json'))
              assert vi['boss.card.verdant_core.name'] == 'Verdant Core'
              for name in [n for n in f.namelist() if n.endswith('.tmx')]:
                  map_root = ET.fromstring(f.read(name))
                  for layer in map_root.findall('layer'):
                      data = layer.find('data')
                      if data is None or data.attrib.get('encoding') != 'csv':
                          continue
                      tokens = (data.text or '').split(',')
                      vals = [int(t.strip()) for t in tokens if t.strip()]
                      assert len(vals) == len(tokens), f'{name}: packaged empty CSV token'
                      assert len(vals) == int(layer.attrib['width']) * int(layer.attrib['height'])
          print('Final .5.12.28 package audit PASS')
          PY

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0661-verdant-core-boss-card-runtime
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.28_VerdantCoreBossCard_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.28_VerdantCoreBossCard_TEST.zip.sha256
          if-no-files-found: error
