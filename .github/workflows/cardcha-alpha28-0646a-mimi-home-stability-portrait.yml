name: Cardcha alpha28.0.4.14.4.5.11.1 MiMi Home Stability Portrait

on:
  push:
    branches: [ cardcha-alpha28-0646a-mimi-home-stability-portrait ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate .5.11.1 MiMi home stability portrait hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/alpha28_0646a_mimi_home_stability_portrait.py

      - name: Validate .5.11.1 hotfix + locked gameplay contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('src/Cardcha')
          assets = root/'assets'
          version = '0.3.0-alpha.28.0.4.14.4.5.11.1'

          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['Version'] == version
          assert f'<Version>{version}</Version>' in (root/'Cardcha.csproj').read_text(encoding='utf-8')
          assert f'<Version>{version}</Version>' in (root/'Directory.Build.targets').read_text(encoding='utf-8')

          home = (root/'Services/MimiHomeService.cs').read_text(encoding='utf-8')
          for token in [
              'CachedAtticRoutineKey',
              'CachedAtticRoutineTile',
              'ResolveStableAtticRoutineTile(attic, "tv", SecretTvWatchTile)',
              'ResolveStableAtticRoutineTile(attic, "late", SecretLateHomeTile)',
              'ResolveStableAtticRoutineTile(attic, "home")',
              'OwnsSecretTvDialogueNow()',
              'ShowMimiPortraitDialogue(mimi, text)',
              'SecretTvStart = 1730',
              'SecretTvEnd = 2200',
          ]:
              assert token in home, token

          mystery = (root/'Services/MimiMysteryTownService.cs').read_text(encoding='utf-8')
          for token in ['PrepareCrispPortrait', 'TryShowCrispPortraitDialogue', 'AssignPortraitTexture(speaker, this.RuntimePortraitSheet)']:
              assert token in mystery, token

          social = (root/'Services/MimiSocialService.cs').read_text(encoding='utf-8')
          for token in ['PrepareMimiPortrait', 'DeferToHomeDialogue', 'this.PrepareMimiPortrait(mimi);', 'this.DeferToHomeDialogue()']:
              assert token in social, token

          modentry = (root/'ModEntry.cs').read_text(encoding='utf-8')
          for token in ['TryShowCrispPortraitDialogue', 'PrepareCrispPortrait', 'OwnsSecretTvDialogueNow', 'cardcha_test_gate', 'CommandTestGate', 'DebugWarpToGate']:
              assert token in modentry, token

          airship = (root/'Services/AirshipFoundationService.cs').read_text(encoding='utf-8')
          for token in ['TestGateAccessActive', 'DebugWarpToGate()', 'AirshipUnlocked || this.TestGateAccessActive', 'GateTest=']:
              assert token in airship, token

          # Regression guard: MiMi attic interaction shell remains unchanged by the hotfix.
          visual = (root/'Services/MimiAtticVisualService.cs').read_text(encoding='utf-8')
          assert 'SecretTvHeartRequirement = 6' in visual
          assert 'SecretTvTime = 1730' in visual
          assert 'SecretTvEndTime = 2200' in visual
          assert 'mimi_attic_room_frame.png' not in visual

          # Save schema and locked gameplay contracts remain untouched.
          save = (root/'Models/SaveData.cs').read_text(encoding='utf-8')
          assert 'SchemaVersion { get; set; } = 19' in save
          assert hashlib.sha256((assets/'airship_visual.png').read_bytes()).hexdigest() == '1821ee869759a924f7ff2b6821aaeb64b80a000d84c46f207a578d3a1e771132'
          assert 'BossFormDurationMs = 10000' in (root/'Services/ChaChaBossFormService.cs').read_text(encoding='utf-8')
          assert 'EnergyGainScale = 1d / 3d' in (root/'Services/BossEnergyService.cs').read_text(encoding='utf-8')
          gate = (root/'Patches/AirshipGateRelocationPatch.cs').read_text(encoding='utf-8')
          assert 'CollisionEdits=NONE' in gate and 'CanonicalGateUseDistance = 160f' in gate
          audit = json.loads((assets/'card_auto_audit.json').read_text(encoding='utf-8'))
          assert len(audit) == 76 and all(row['status'] == 'PASS' for row in audit)

          print('alpha28 0646a MiMi home stability portrait hotfix acceptance PASS')
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Materialize .5.11.1 hotfix source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            src/Cardcha/Services/MimiMysteryTownService.cs \
            src/Cardcha/Services/MimiHomeService.cs \
            src/Cardcha/Services/MimiSocialService.cs \
            src/Cardcha/Services/AirshipFoundationService.cs \
            src/Cardcha/ModEntry.cs \
            src/Cardcha/manifest.json \
            src/Cardcha/Cardcha.csproj \
            src/Cardcha/Directory.Build.targets \
            tools/alpha28_0646a_mimi_home_stability_portrait.py \
            .github/workflows/cardcha-alpha28-0646a-mimi-home-stability-portrait.yml || true

          if git diff --cached --quiet; then
            echo "No materialized diff."
          else
            git commit -m "chore: materialize alpha28.0.4.14.4.5.11.1 MiMi home stability portrait [skip ci]"
            git push origin HEAD:cardcha-alpha28-0646a-mimi-home-stability-portrait
          fi

      - name: Package .5.11.1 test build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha
          dll="$(find src/Cardcha/bin/Release -name Cardcha.dll -print -quit)"
          test -n "$dll" && test -s "$dll"
          cp "$dll" stage/Cardcha/Cardcha.dll
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/
          test "$(python3 -c "import json; print(json.load(open('stage/Cardcha/manifest.json'))['Version'])")" = "0.3.0-alpha.28.0.4.14.4.5.11.1"
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.11.1_MiMiHomeStabilityPortrait_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0646a-mimi-home-stability-portrait
          path: artifact
          if-no-files-found: error
