name: Cardcha alpha28.0.4.14.4.5.12.18 Verdant Guardian Boss I

on:
  push:
    branches: [ cardcha-alpha28-0650-verdant-guardian-boss1 ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 0650 Verdant Guardian candidate
        run: python3 tools/alpha28_0650_verdant_guardian_boss1.py

      - name: Validate Boss I technical contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess, xml.etree.ElementTree as ET

          root = Path('src/Cardcha')
          version = '0.3.0-alpha.28.0.4.14.4.5.12.18'
          assert json.loads((root/'manifest.json').read_text())['Version'] == version
          assert version in (root/'Cardcha.csproj').read_text()
          assert version in (root/'Directory.Build.targets').read_text()

          save_data = (root/'Models/SaveData.cs').read_text()
          save_service = (root/'Services/SaveService.cs').read_text()
          assert 'SchemaVersion { get; set; } = 19;' in save_data
          assert 'CurrentSchemaVersion = 19;' in save_service
          for token in ['Region1BossDefeated', 'BossCardsUnlocked', 'EquippedBossCardId']:
              assert token in save_data and token in save_service
          # New fields are intentionally excluded from the old canonical fingerprint to avoid
          # false warnings on existing schema-19 saves.
          fingerprint = save_service[save_service.index('private static string ComputeFingerprint'):]
          assert 'Region1BossDefeated' not in fingerprint
          assert 'BossCardsUnlocked' not in fingerprint

          boss = (root/'Services/VerdantGuardianBossService.cs').read_text()
          states = [
              'Dormant','Intro','Decision','SwipeTelegraph','RootSpikesTelegraph','SummonAdds',
              'ChargeTelegraph','Charging','VineTrapTelegraph','VineTrapActive',
              'AreaSlamTelegraph','PhaseTransition','Defeated','Victory'
          ]
          for state in states:
              assert state in boss
          for token in [
              'BossMaxHealth = 1300', '0.70f', '0.35f',
              '2200, 2 => 1800', '5200, 2 => 4500', '16000, 2 => 14000',
              '7000 : 5600', '8500 : 6500', 'AreaSlam => 7200',
              'BossCardId = "verdant_core"', 'GrantRegion1BossReward()',
              'AirshipHighestRegionUnlocked = Math.Max(2', 'Game1.player.takeDamage'
          ]:
              assert token in boss, token

          portable = (root/'Services/PortableMachineService.cs').read_text()
          assert 'GrantRegion1BossReward' in portable
          assert 'this.Save.Data.Region1BossDefeated' in portable

          airship = (root/'Services/AirshipFoundationService.cs').read_text()
          assert 'VerdantGuardianBossService.LocationName' in airship
          assert 'Region1GateCardRequirement = 20' in airship
          assert 'Region1RunRoomCount = 4' in airship

          mod = (root/'ModEntry.cs').read_text()
          for token in [
              'VerdantGuardianBossService VerdantGuardian',
              'this.VerdantGuardian.OnAssetRequested',
              'this.VerdantGuardian.OnUpdateTicked',
              'this.VerdantGuardian.OnRenderedWorld',
              'this.VerdantGuardian.OnRenderedHud',
              'this.VerdantGuardian.OnWarped',
              'cardcha_test_boss1', 'cardcha_boss1_status'
          ]:
              assert token in mod

          arena_path = root/'assets/verdant_guardian_arena.tmx'
          arena = ET.parse(arena_path).getroot()
          assert arena.attrib['width'] == '28' and arena.attrib['height'] == '20'
          props = {p.attrib['name']: p.attrib.get('value','') for p in arena.find('properties')}
          assert props['CardchaAssetPolicy'] == 'cardcha-owned-map|vanilla-tiles-only|no-third-party-assets'
          assert props['CardchaRegionRole'] == 'region1-boss-arena|verdant-guardian|boss1'
          assert arena.find('tileset').find('image').attrib['source'] == '.spring_outdoorsTileSheet.png'

          en = json.loads((root/'i18n/default.json').read_text())
          vi = json.loads((root/'i18n/vi.json').read_text())
          for data in (en, vi):
              for key in ['boss.verdant.name','boss.verdant.intro','boss.verdant.victory.first','boss.verdant.card.name']:
                  assert key in data

          assert (Path('handoff/VERDANT_GUARDIAN_TECHNICAL_SPEC.md')).exists()
          assert (Path('handoff/BOSS_CONCEPT_CANON.md')).exists()
          assert (Path('handoff/ALPHA28_0650_VERDANT_GUARDIAN_BOSS1.md')).exists()
          latest = Path('handoff/LATEST_CARDCHA_HANDOFF.md').read_text()
          assert 'cardcha-alpha28-0650-verdant-guardian-boss1' in latest

          # Accepted/pending systems outside Boss I must be byte-identical to 0649.
          protected = [
              'src/Cardcha/Services/BossEnergyService.cs',
              'src/Cardcha/Services/ChaChaBossFormService.cs',
              'src/Cardcha/Services/ProgressionService.cs',
              'src/Cardcha/Patches/MimiProfileMenuPatch.cs',
              'src/Cardcha/Services/MimiHomeService.cs',
              'src/Cardcha/Services/MimiAtticVisualService.cs',
              'src/Cardcha/assets/region1_hunting.tmx',
              'src/Cardcha/assets/airship_deck.tmx',
              'src/Cardcha/assets/sky_dock_interior.tmx',
          ]
          for rel in protected:
              rc = subprocess.run(['git','diff','--quiet','origin/cardcha-alpha28-0649-region1-huntrun-prototype','--',rel]).returncode
              assert rc == 0, f'protected file changed: {rel}'

          assert hashlib.sha256((root/'assets/mimi_walk.png').read_bytes()).hexdigest() == '04ff1cbf031c2be0a21f114b8f8eb6f8850bb800eeabd4c27df036d7b23d4fb7'
          assert hashlib.sha256((root/'assets/airship_visual.png').read_bytes()).hexdigest() == '1821ee869759a924f7ff2b6821aaeb64b80a000d84c46f207a578d3a1e771132'

          for junk in ['tmp.txt','tmp2.txt','tmp3.txt','tmp4.txt']:
              assert not Path(junk).exists(), junk

          print('0650 validator PASS')
          print('Boss I: 3 phases / 6 attacks / 20-card gate / Verdant Core first-clear persistence')
          print('Save schema 19, Boss Form 10s, Boss Energy 1/3 and 0648J pending systems protected')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.18 source + handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.18 Verdant Guardian Boss I [skip ci]'
            git push origin HEAD:cardcha-alpha28-0650-verdant-guardian-boss1
          fi

      - name: Package .5.12.18 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.18_VerdantGuardianBoss1_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"

          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile
          z = Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.18_VerdantGuardianBoss1_TEST.zip')
          with zipfile.ZipFile(z) as f:
              names = set(f.namelist())
              assert json.loads(f.read('Cardcha/manifest.json'))['Version'] == '0.3.0-alpha.28.0.4.14.4.5.12.18'
              assert 'Cardcha/assets/verdant_guardian_arena.tmx' in names
              assert len(f.read('Cardcha/Cardcha.dll')) > 100000
          print('Final .5.12.18 package audit PASS')
          PY

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0650-verdant-guardian-boss1
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.18_VerdantGuardianBoss1_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.18_VerdantGuardianBoss1_TEST.zip.sha256
          if-no-files-found: error
