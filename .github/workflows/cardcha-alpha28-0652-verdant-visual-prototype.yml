name: Cardcha alpha28.0.4.14.4.5.12.19 Verdant Guardian Visual Prototype

on:
  push:
    branches: [ cardcha-alpha28-0652-verdant-visual-prototype ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 0652 Verdant visual candidate
        run: python3 tools/alpha28_0652_verdant_visual_prototype.py

      - name: Validate visual-only animation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, struct, subprocess

          root = Path('src/Cardcha')
          version = '0.3.0-alpha.28.0.4.14.4.5.12.19'
          assert json.loads((root/'manifest.json').read_text())['Version'] == version
          assert version in (root/'Cardcha.csproj').read_text()
          assert version in (root/'Directory.Build.targets').read_text()

          boss = (root/'Services/VerdantGuardianBossService.cs').read_text()
          visual = (root/'Services/VerdantGuardianVisualService.cs').read_text()
          entry = (root/'ModEntry.cs').read_text()
          assert 'internal VerdantGuardianState VisualState => this.State;' in boss
          assert 'internal int VisualPhase => this.Phase;' in boss
          assert 'internal long VisualStateStartedAtMs => this.StateStartedAtMs;' in boss
          assert 'internal Monster? VisualBoss => this.ResolveBoss();' in boss
          assert 'private const int FrameSize = 64;' in visual
          assert 'private const float DrawScale = 4f;' in visual
          assert 'VerdantGuardianState.Intro => Clips["intro"]' in visual
          assert 'VerdantGuardianState.SwipeTelegraph => Clips["swipe"]' in visual
          assert 'VerdantGuardianState.RootSpikesTelegraph => Clips["root"]' in visual
          assert 'new VerdantGuardianVisualService' in entry
          assert 'this.VerdantGuardianVisual.OnRenderedWorld' in entry
          assert 'cardcha_boss1_visual_status' in entry

          assets = root/'assets'/'bosses'/'verdant_guardian'
          expected = {
              'boss1_verdant_guardian_idle.png': (384,64),
              'boss1_verdant_guardian_intro_awaken.png': (640,64),
              'boss1_verdant_guardian_swipe_attack.png': (576,64),
              'boss1_verdant_guardian_root_cast.png': (512,64),
              'boss1_verdant_guardian_core_glow.png': (384,64),
          }
          for name, dims in expected.items():
              raw = (assets/name).read_bytes()
              assert raw[:8] == b'\x89PNG\r\n\x1a\n', name
              width, height = struct.unpack('>II', raw[16:24])
              assert (width,height) == dims, (name, width, height, dims)

          # Locked systems remain untouched relative to the gameplay boss baseline.
          for protected in [
              'src/Cardcha/Models/SaveData.cs',
              'src/Cardcha/Services/SaveService.cs',
              'src/Cardcha/Services/BossEnergyService.cs',
              'src/Cardcha/Services/ChaChaBossFormService.cs',
              'src/Cardcha/Services/AirshipFoundationService.cs',
              'src/Cardcha/assets/region1_hunting.tmx',
              'src/Cardcha/assets/airship_visual.png',
              'src/Cardcha/Services/MimiHomeService.cs',
              'src/Cardcha/Services/MimiAtticVisualService.cs',
          ]:
              rc = subprocess.run([
                  'git','diff','--quiet','origin/cardcha-alpha28-0650-verdant-guardian-boss1','--',protected
              ]).returncode
              assert rc == 0, f'protected file changed: {protected}'

          print('0652 validator PASS')
          print('visual layer is read-only; combat timing remains in VerdantGuardianBossService')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.19 source + handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.19 Verdant visual prototype [skip ci]'
            git push origin HEAD:cardcha-alpha28-0652-verdant-visual-prototype
          fi

      - name: Package .5.12.19 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.19_VerdantGuardianVisualPrototype_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"

          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile
          z = Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.19_VerdantGuardianVisualPrototype_TEST.zip')
          with zipfile.ZipFile(z) as f:
              names = set(f.namelist())
              assert json.loads(f.read('Cardcha/manifest.json'))['Version'] == '0.3.0-alpha.28.0.4.14.4.5.12.19'
              assert len(f.read('Cardcha/Cardcha.dll')) > 100000
              for name in [
                  'boss1_verdant_guardian_idle.png',
                  'boss1_verdant_guardian_intro_awaken.png',
                  'boss1_verdant_guardian_swipe_attack.png',
                  'boss1_verdant_guardian_root_cast.png',
                  'boss1_verdant_guardian_core_glow.png',
              ]:
                  assert 'Cardcha/assets/bosses/verdant_guardian/' + name in names
          print('Final .5.12.19 package audit PASS')
          PY

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0652-verdant-visual-prototype
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.19_VerdantGuardianVisualPrototype_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.19_VerdantGuardianVisualPrototype_TEST.zip.sha256
          if-no-files-found: error
