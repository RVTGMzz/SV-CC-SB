name: Cardcha alpha28.0.4.14.4.5.12.32 Verdant Region I Balance Pass

on:
  push:
    branches: [ cardcha-alpha28-0665-verdant-balance-pass ]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 0665 balance pass
        run: python3 tools/alpha28_0665_verdant_balance_pass_fixed.py

      - name: Validate 0665 acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET

          root = Path('src/Cardcha')
          version = '0.3.0-alpha.28.0.4.14.4.5.12.32'
          manifest = json.loads((root/'manifest.json').read_text())
          assert manifest['Version'] == version
          assert version in (root/'Cardcha.csproj').read_text()
          assert version in (root/'Directory.Build.targets').read_text()

          boss = (root/'Services/VerdantGuardianBossService.cs').read_text()
          for token in [
              'private const int BossMaxHealth = 1600;',
              'private const int SwipeDamageP1 = 10;',
              'private const int SwipeDamageP2 = 12;',
              'private const int SwipeDamageP3 = 14;',
              'private const int RootDamageP1 = 8;',
              'private const int RootDamageP2 = 10;',
              'private const int RootDamageP3 = 12;',
              'private const int ChargeDamageP1 = 14;',
              'private const int ChargeDamageP2 = 16;',
              'private const int ChargeDamageP3 = 19;',
              'private const int VineDamageP1 = 4;',
              'private const int VineDamageP2 = 5;',
              'private const int VineDamageP3 = 7;',
              'private const int SlamDamageP1 = 16;',
              'private const int SlamDamageP2 = 18;',
              'private const int SlamDamageP3 = 22;',
              'private const float HeavyRecoilCapPixels = 18f;',
              'private const float HeavyRecenterFactor = 0.22f;',
              'this.ApplyHeavyRecoil(boss);',
              'PhaseDamage(SwipeDamageP1, SwipeDamageP2, SwipeDamageP3, this.Phase)',
              'PhaseDamage(RootDamageP1, RootDamageP2, RootDamageP3, this.Phase)',
              'PhaseDamage(ChargeDamageP1, ChargeDamageP2, ChargeDamageP3, this.Phase)',
              'PhaseDamage(VineDamageP1, VineDamageP2, VineDamageP3, this.Phase)',
              'PhaseDamage(SlamDamageP1, SlamDamageP2, SlamDamageP3, this.Phase)',
              'VerdantGuardianAttack.Swipe => phase switch { 1 => 2400, 2 => 2000, _ => 1700 }',
              'VerdantGuardianAttack.RootSpikes => phase switch { 1 => 5600, 2 => 4800, _ => 4000 }',
              'VerdantGuardianAttack.SummonAdds => phase switch { 1 => 17000, 2 => 14500, _ => 13000 }',
              'private static int DecisionGapMs(int phase) => phase switch { 1 => 750, 2 => 600, _ => 450 };',
              'add.MaxHealth = this.Phase switch { 1 => 34, 2 => 46, _ => 58 };',
              'add.Speed = this.Phase switch { 1 => 4, 2 => 5, _ => 5 };',
              'add.MaxHealth = this.Phase switch { 1 => 50, 2 => 68, _ => 84 };',
              'public string DescribeBalance()',
          ]:
              assert token in boss, token

          # Combat knockback is resistance + cap, not 0660 absolute immunity.
          patch = (root/'Patches/MonsterDamagePatch.cs').read_text()
          for token in [
              'private const double VerdantGuardianKnockbackScale = 0.08d;',
              'private const int VerdantGuardianKnockbackCap = 12;',
              'Math.Round(xTrajectory * VerdantGuardianKnockbackScale)',
              'Math.Round(yTrajectory * VerdantGuardianKnockbackScale)',
          ]:
              assert token in patch, token
          assert 'xTrajectory = 0;' not in patch
          assert 'yTrajectory = 0;' not in patch

          # Guardian Rabbit canon stays 10s / x1/3, but provisional pulse damage is tuned.
          form = (root/'Services/ChaChaBossFormService.cs').read_text()
          assert 'public const int BossFormDurationMs = 10000;' in form
          assert 'public const int GuardianRootPulseIntervalMs = 2000;' in form
          assert 'public const int GuardianRootPulseDamage = 14;' in form
          assert 'public const float GuardianRootPulseRadius = 176f;' in form
          energy = (root/'Services/BossEnergyService.cs').read_text()
          assert 'public const double EnergyGainScale = 1d / 3d;' in energy
          assert 'public const double MaxEnergy = 100d;' in energy

          # Verdant Core remains a rescue card, toned down from the 0661 prototype.
          card = (root/'Services/BossCardService.cs').read_text()
          assert 'public const double VerdantGuardThreshold = 0.50d;' in card
          assert 'public const double VerdantDamageReduction = 0.30d;' in card
          assert 'public const int VerdantActiveDurationMs = 6000;' in card
          assert 'public const int VerdantCooldownMs = 28000;' in card
          assert 'public const int VerdantHealPerTick = 2;' in card

          for lang in ['default.json','vi.json']:
              data = json.loads((root/'i18n'/lang).read_text())
              assert '30%' in data['boss.card.verdant_core.desc']
              assert '28' in data['boss.card.verdant_core.desc']
              assert '14' in data['chacha.boss.guardian.desc']

          mod = (root/'ModEntry.cs').read_text()
          assert 'cardcha_boss1_balance_status' in mod
          assert 'this.VerdantGuardian.DescribeBalance()' in mod
          assert '0.3.0-alpha.28.0.4.14.4.5.12.32 VERDANT REGION I BALANCE PASS TEST' in mod

          # Preserve 0660-0664 presentation/content.
          visual = (root/'Services/VerdantGuardianVisualService.cs').read_text()
          assert 'private const float DrawScale = 8f;' in visual
          assert 'boss1_verdant_guardian_defeat.png' in visual
          summons = (root/'Services/VerdantGuardianSummonVisualService.cs').read_text()
          assert 'briarling.png' in summons and 'leaf_wisp.png' in summons and 'summon_portal.png' in summons
          polish = (root/'Services/VerdantGuardianArenaPolishService.cs').read_text()
          for token in ['verdant_arena_seal.png','verdant_arena_obelisk.png','verdant_retreat_glyph.png','RestoreCameraOffset','DrawIntroPresentation']:
              assert token in polish, token

          # Save/card/progression locks.
          save = (root/'Models/SaveData.cs').read_text()
          assert 'SchemaVersion { get; set; } = 19;' in save
          cards = json.loads((root/'assets/cards.json').read_text())
          legacy_mythic = {'endless_hunt','fate_weaver','immortal_echo','worldbreaker'}
          assert len(cards) == 80
          assert len([c for c in cards if c.get('Id') not in legacy_mythic]) == 76
          assert all(c.get('Id') not in {'verdant_core','guardian_rabbit'} for c in cards)

          # MiMi + stair continuity remains locked.
          home = (root/'Services/MimiHomeService.cs').read_text()
          assert 'ResolvePreferredWizardStairTile' in home and 'bool rightIsBoundary' in home
          profile = (root/'Patches/MimiProfileMenuPatch.cs').read_text()
          assert 'DrawScale=vanilla-4x' in profile
          vi = json.loads((root/'i18n/vi.json').read_text())
          assert 'trú mưa' in vi['mimi.social.community-center']

          # Strict TMX runtime contract stays clean.
          checked_layers = 0
          for tmx in sorted((root/'assets').rglob('*.tmx')):
              map_root = ET.parse(tmx).getroot()
              for layer in map_root.findall('layer'):
                  data = layer.find('data')
                  if data is None or data.attrib.get('encoding') != 'csv':
                      continue
                  tokens = (data.text or '').split(',')
                  vals = []
                  for i, token in enumerate(tokens):
                      s = token.strip()
                      assert s != '', f'{tmx}: empty CSV token layer={layer.attrib.get("name")} index={i}'
                      n = int(s)
                      assert 0 <= n <= 0xFFFFFFFF
                      vals.append(n)
                  assert len(vals) == int(layer.attrib['width']) * int(layer.attrib['height'])
                  checked_layers += 1
          assert checked_layers >= 21
          print(f'0665 validator PASS; bossHP=1600 activeCards=76 strictTMXLayers={checked_layers}')
          PY

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile Cardcha
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release --nologo

      - name: Materialize .5.12.32 source + handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/Cardcha handoff
          if ! git diff --cached --quiet; then
            git commit -m 'chore: materialize alpha28.0.4.14.4.5.12.32 Verdant Region I balance pass [skip ci]'
            git push origin HEAD:cardcha-alpha28-0665-verdant-balance-pass
          fi

      - name: Package .5.12.32 TEST
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/package/Cardcha"
          rm -rf "$GITHUB_WORKSPACE/package"
          mkdir -p "$OUT"
          cp src/Cardcha/manifest.json "$OUT/"
          cp src/Cardcha/config.json "$OUT/" 2>/dev/null || true
          cp -R src/Cardcha/assets "$OUT/"
          cp -R src/Cardcha/i18n "$OUT/"
          DLL=$(find src/Cardcha/bin/Release -type f -name 'Cardcha.dll' | head -n1)
          test -n "$DLL" -a -s "$DLL"
          cp "$DLL" "$OUT/Cardcha.dll"
          cd "$GITHUB_WORKSPACE/package"
          ZIP="Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.32_VerdantRegion1Balance_TEST.zip"
          zip -qr "$ZIP" Cardcha
          sha256sum "$ZIP" | tee "$ZIP.sha256"

          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile, xml.etree.ElementTree as ET
          z = Path('Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.32_VerdantRegion1Balance_TEST.zip')
          with zipfile.ZipFile(z) as f:
              assert json.loads(f.read('Cardcha/manifest.json'))['Version'] == '0.3.0-alpha.28.0.4.14.4.5.12.32'
              assert len(f.read('Cardcha/Cardcha.dll')) > 100000
              vi = json.loads(f.read('Cardcha/i18n/vi.json'))
              assert '30%' in vi['boss.card.verdant_core.desc']
              assert '14' in vi['chacha.boss.guardian.desc']
              for asset in [
                  'Cardcha/assets/chacha_guardian_rabbit.png',
                  'Cardcha/assets/bosses/verdant_guardian/summons/briarling.png',
                  'Cardcha/assets/bosses/verdant_guardian/summons/leaf_wisp.png',
                  'Cardcha/assets/bosses/verdant_guardian/arena/verdant_arena_seal.png',
              ]:
                  assert len(f.read(asset)) > 150, asset
              for name in [n for n in f.namelist() if n.endswith('.tmx')]:
                  map_root = ET.fromstring(f.read(name))
                  for layer in map_root.findall('layer'):
                      data = layer.find('data')
                      if data is None or data.attrib.get('encoding') != 'csv':
                          continue
                      tokens = (data.text or '').split(',')
                      vals = [int(t.strip()) for t in tokens if t.strip()]
                      assert len(vals) == len(tokens), f'{name}: packaged empty CSV token'
                      assert len(vals) == int(layer.attrib['width']) * int(layer.attrib['height'])
          print('Final .5.12.32 package audit PASS')
          PY

      - name: Upload TEST artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha28-0665-verdant-balance-pass
          path: |
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.32_VerdantRegion1Balance_TEST.zip
            package/Cardcha_v0.3.0-alpha.28.0.4.14.4.5.12.32_VerdantRegion1Balance_TEST.zip.sha256
          if-no-files-found: error
