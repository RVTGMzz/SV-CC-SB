name: Cardcha alpha27.0.7.8.6 machine placement fix

on:
  push:
    branches: [ cardcha-alpha27-mimi-real-npc ]
    paths:
      - '.github/workflows/cardcha-alpha27-0786-machine-placement-fix.yml'
      - 'build_assets/apply_0786.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 0.7.8.6 candidate
        run: python3 build_assets/apply_0786.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          r = Path('src/Cardcha')
          target = '0.3.0-alpha.27.0.7.8.6'
          assert json.loads((r/'manifest.json').read_text())['Version'] == target
          assert target in (r/'Cardcha.csproj').read_text()
          assert target in (r/'Directory.Build.targets').read_text()
          assert target in (r/'ModEntry.cs').read_text()

          item = (r/'Services/ItemAssetService.cs').read_text()
          normal_start = item.index('data[CardchaMachineId] = new BigCraftableData')
          portable_start = item.index('data[PortableMachineId] = new BigCraftableData')
          normal = item[normal_start:portable_start]
          portable = item[portable_start:]
          assert 'CanBePlacedIndoors = true' in normal
          assert 'CanBePlacedOutdoors = false' in normal
          assert 'CanBePlacedIndoors = false' in portable
          assert 'CanBePlacedOutdoors = false' in portable

          patch = (r/'Patches/MachineInteractionPatch.cs').read_text()
          assert 'ItemAssetService.IsPortableMachine(__instance)' in patch
          assert 'if (__result && IsCardchaMachine(__instance))' not in patch
          assert 'public static bool IsCardchaMachine' in patch

          assert hashlib.sha256((r/'assets/mimi_walk.png').read_bytes()).hexdigest() == '04ff1cbf031c2be0a21f114b8f8eb6f8850bb800eeabd4c27df036d7b23d4fb7'
          assert hashlib.sha256((r/'assets/mimi_broom.png').read_bytes()).hexdigest() == '875c305258151512e46a66d42574a271590f4d184269c03be7b1c1f4f6a161e8'
          assert hashlib.sha256((r/'assets/mimi_social_mugshot.png').read_bytes()).hexdigest() == '7db5cd2f6c8815148d68e534bda26036c55f200402f09713d742d1ab1bfebd11'
          print('0.7.8.6 static validation PASS')
          PY

      - uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Compile
        run: dotnet build src/Cardcha/Cardcha.csproj -c Release -p:EnableModDeploy=false -p:EnableModZip=false

      - name: Package TEST
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact stage
          mkdir -p artifact stage/Cardcha artifact/canonical-src/Services artifact/canonical-src/Patches
          cp "$(find src/Cardcha/bin -name Cardcha.dll -print -quit)" stage/Cardcha/
          cp src/Cardcha/manifest.json src/Cardcha/config.json stage/Cardcha/
          cp -a src/Cardcha/assets src/Cardcha/i18n stage/Cardcha/
          test -s stage/Cardcha/Cardcha.dll
          (cd stage && zip -qr ../artifact/Cardcha_v0.3.0-alpha.27.0.7.8.6_MachinePlacementFix_TEST.zip Cardcha)
          sha256sum artifact/*.zip > artifact/SHA256.txt

          cp src/Cardcha/Services/ItemAssetService.cs artifact/canonical-src/Services/
          cp src/Cardcha/Patches/MachineInteractionPatch.cs artifact/canonical-src/Patches/
          cp src/Cardcha/Cardcha.csproj src/Cardcha/Directory.Build.targets src/Cardcha/manifest.json src/Cardcha/ModEntry.cs artifact/canonical-src/

      - name: Canonicalize 0.7.8.6 source if needed
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/Cardcha/Services/ItemAssetService.cs \
            src/Cardcha/Patches/MachineInteractionPatch.cs \
            src/Cardcha/Cardcha.csproj \
            src/Cardcha/Directory.Build.targets \
            src/Cardcha/manifest.json \
            src/Cardcha/ModEntry.cs

          if git diff --cached --quiet; then
            echo 'Canonical source already matches 0.7.8.6.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'alpha27.0.7.8.6: restore normal machine indoor placement'
            git push origin HEAD:cardcha-alpha27-mimi-real-npc
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cardcha-alpha27-0786-machine-placement-fix
          path: artifact
          if-no-files-found: error
